---
# CI + GitHub Pages deploy for legend-of-legaia-re.
# Modeled on faultline/.github/workflows/main-ci.yml (same self-hosted runner
# convention). Tailored:
#   - Pull requests run the disc-free gates (`gates`) and `pr-lint` (fmt,
#     clippy, wasm32 type-check, then the disc-free test suite) on every
#     push to the PR, so a red test stops a merge instead of breaking main.
#     The release builds (`ci`) stay on push-to-main and workflow_dispatch.
#     The deploy-pages job packages the wasm build with `wasm-pack`.
#   - No scenarios symlink to materialize.
#   - cargo runs directly on the runner (no docker-compose `rust-ci` service
#     in this repo yet; the only compose service here is `ghidra`).
#   - Validation suite is gated on LEGAIA_DISC_BIN, which is intentionally
#     not provided in the main `ci` job: this repo ships no game data. The
#     gated tests print a skip notice and pass.
#   - A separate `disc-test` job runs the full disc-gated suite. It fires
#     on: (a) manual workflow_dispatch, or (b) a PR that has the `disc-test`
#     label added. Set the `LEGAIA_DISC_BIN` repository variable (Settings >
#     Variables > Actions) to the disc image path on the self-hosted runner.
#     disc-nightly.yml runs the same suite on a schedule, so it runs whether
#     or not anyone asks for it.
#   - Tag pushes are NOT handled here. release.yml owns the `v*` tag event
#     and re-runs these same fmt/clippy/test gates as its own `verify` job,
#     so a release stays test-gated without two workflows contending for the
#     single self-hosted runner on one commit. See docs/tooling/releases.md.

name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    # opened / synchronize / reopened drive `gates` + `pr-lint`; `labeled`
    # is reserved for the `disc-test` job and runs nothing else.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A PR push supersedes the previous push's lint run, so PR runs cancel per
# PR; a label event gets its own group so adding `disc-test` never cancels
# the lint pass. Pushes to main keep one group per commit and never cancel.
concurrency:
  group: main-ci-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'labeled' && 'label' || 'push') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

# Every cargo step builds into one persistent target directory OUTSIDE the
# checkout. `actions/checkout` with `clean: true` runs `git clean -ffdx`, and
# `-x` deletes the gitignored `target/`, so each run used to start with a cold
# cargo fingerprint cache and recompile the whole workspace. sccache cannot
# absorb that: it hashes the checkout path (cargo's `-C metadata` and
# `CARGO_MANIFEST_DIR` embed it), so every workspace crate misses across the
# runner's path and a developer's, and it never caches bins, test harnesses
# or clippy at all (`crate-type` / `multiple input files` in its stats). Only
# cargo's own fingerprints, kept across runs, make a run rebuild just what
# changed. One directory for all jobs on the single self-hosted runner; the
# concurrency group above already serialises runs per commit, and cargo's
# build lock serialises the rest. Each cargo job narrows this root to a
# per-toolchain subdirectory first (scripts/ci/select-ci-target-dir.sh).
env:
  CARGO_TARGET_DIR: /home/mikunpc/.cache/legaia-ci-target

jobs:
  # -- Repository Gates -------------------------------------------------------
  # The scripts/ci/check-*.py gates used to run ONLY from
  # scripts/git-hooks/pre-commit. A gate that lives only in a hook is one
  # `LEGAIA_SKIP_PRECOMMIT=1`, or one clone that never ran
  # scripts/ci/install-hooks.sh, away from being fiction - and neither leaves a
  # trace in the repository. Running them here is what makes the pre-commit
  # hook a fast local mirror of CI rather than the only place they exist.
  #
  # Every gate in this job is disc-independent by construction: they read the
  # repo's own sources, docs and site fragments. That matters because this job
  # deliberately does NOT get LEGAIA_DISC_BIN, and because `extracted/` is
  # gitignored and absent on the runner even when the disc is present.
  #
  # Separate job, not a step of `ci`: these take seconds, so a doc-link typo
  # should report in seconds rather than behind a 40-minute clippy+test pass,
  # and a red gate here must not read as a broken build.
  gates:
    name: Repo Gates
    runs-on: self-hosted
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # Each gate self-tests its own detectors and refuses to report a pass
      # when a control fails, so `--selftest` is not run separately here.
      - name: Doc legibility density
        run: python3 scripts/ci/check-doc-density.py

      - name: Doc links + heading anchors
        run: python3 scripts/ci/check-md-links.py

      - name: Site internal links
        run: python3 scripts/ci/check-site-links.py

      # A @media block adds no specificity, so a breakpoint placed above the
      # rule it overrides is dead code that still reads like a feature. That is
      # how the mobile icon rail shipped never hiding, with the content column
      # laid out full-width underneath it.
      - name: CSS cascade order
        run: python3 scripts/ci/check-css-cascade-order.py

      # `.toLowerCase()` binds to the operand it is written on, so folding the
      # last literal of a `+` chain leaves every earlier one cased - while the
      # expression still reads as "this is lowercase". The texture filter's
      # search vocabulary shipped half-folded that way, and a disc-cased word
      # like "Ra-Seru" was unsearchable with the whole suite green.
      - name: JS split case folds
        run: python3 scripts/ci/check-js-case-fold-chains.py

      # `import.meta` (or a static import/export declaration) inside a script
      # loaded WITHOUT type="module" is a parse error for the whole file -
      # nothing in it runs and only a browser ever notices. The world-overview
      # viewer shipped dead that way.
      - name: JS module syntax in classic scripts
        run: python3 scripts/ci/check-js-classic-module-syntax.py

      # A private copy of a helper site/js/site-util.js already shares
      # (escaper, RGBA canvas, download, minigame poser) - copies drift.
      - name: Site shared helpers
        run: python3 scripts/ci/check-site-shared-helpers.py

      # The play page's renderer keeps a set value until the next call, and
      # the page draws field, battle and minigame frames through one renderer,
      # so frame state staged inside one draw branch leaks into the others.
      - name: Play page sticky frame state
        run: python3 scripts/ci/check-js-sticky-frame-state.py

      # The play page's scene writes log2(w) depth; a depth-tested fragment
      # shader that keeps the rasterised depth fails the test against it.
      - name: Play page fragment depth space
        run: python3 scripts/ci/check-js-depth-space.py

      # A hand-written `site/_content/` mirror of a docs page drifts silently:
      # it keeps building and keeps passing the link checker while whole areas
      # of its source stop appearing on the public site. The three register
      # pages are rendered from docs/ at build time instead (site/_registers.py);
      # the gate checks their markers, their expanded coverage, and the
      # freshness stamp of any local build.
      - name: Site mirrors cover their docs sources
        run: python3 scripts/ci/check-site-doc-mirrors.py

      - name: Shell observer traps
        run: python3 scripts/ci/check-shell-observer-traps.py

      # Each crate's tests/*.rs build as one `integration` binary, so a file
      # its tests/integration.rs does not declare never compiles or runs.
      - name: Integration-test declarations
        run: python3 scripts/ci/check-integration-tests.py

      # The edges among the engine's kernel crates are a committed table
      # (scripts/ci/crate-layering.toml); a Cargo.toml that departs from it
      # in either direction fails.
      - name: Crate layering
        run: python3 scripts/ci/check-crate-layering.py

      # The site's crate map, the README's crate diagrams and its layer list
      # are generated from the manifests; a stale copy fails.
      - name: Crate map freshness
        run: python3 scripts/ci/gen-crate-map.py --check

      # A ratchet's baseline is edited in the same commit as the code that
      # moved it, and the corpus ratchets below skip on this runner. This one
      # needs only the baseline files: a value that moved the wrong way against
      # the base revision fails without a scripts/ci/baseline-loosenings.toml
      # entry. A pull request checks out its merge commit, so the PR base is
      # the right comparison; a push compares against the commit it replaced.
      - name: Baseline loosening
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/ci/check-baseline-loosening.py --self-test
          if [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            git fetch --quiet --depth=1 origin "${BASE_SHA}"
            python3 scripts/ci/check-baseline-loosening.py --base "${BASE_SHA}"
          else
            echo "no base revision for this event; self-test only"
          fi

      - name: UI host drift
        run: python3 scripts/ci/check-ui-host-drift.py

      - name: Trait-override symmetry
        run: python3 scripts/ci/check-trait-override-symmetry.py

      # Hand-editing the generated register files is a build error, so the
      # drift check belongs wherever the generated files can be committed. The
      # hook runs it only when the staged set touches scripts/vrc-diorama/;
      # here it is unconditional, because a checkout has no staging area to
      # condition on and the check costs milliseconds.
      - name: VRChat-diorama register codegen drift
        run: python3 scripts/vrc-diorama/codegen.py --check

      # Disc-denominated coverage ratchet. Both its inputs are gitignored, so
      # this step reports SKIPPED on the runner and can only fail where the
      # bytes are - which is precisely why it must still appear here. It was
      # hook-only, and a hard gate that exists in one hook is one
      # LEGAIA_SKIP_PRECOMMIT=1 away from being fiction; a step that says
      # SKIPPED is at least a step whose absence would be noticed.
      - name: Disc coverage ratchet (skips without disc data)
        run: python3 scripts/ci/disc-coverage.py --check

      # One level finer than the step above: that one ratchets format
      # RECOGNITION, this one ratchets how many of an entry's BYTES a parser
      # here consumed. Its input is a sweep CSV under target/, so it reports
      # SKIPPED on the runner for the same reason and is listed for the same
      # reason - a hard gate that lives in one hook is one skip flag away from
      # being fiction.
      - name: Byte-accounting ratchet (skips without a sweep)
        run: python3 scripts/ci/byte-account-coverage.py --check

      # The catalog's numbers reach the site's landing page, so a silently
      # widening worklist is a published figure moving with nothing to say so.
      # Its `dumped` column reads the gitignored Ghidra corpus, so this reports
      # SKIPPED here and has teeth in the hook; it is listed for the same reason
      # the disc-coverage ratchet is.
      #
      # `--live` and no `--allow-uncompared` on purpose. The step is inert here,
      # but if the corpus ever reaches a runner this must be the invocation that
      # compares every baselined figure - a `--check` that skips one and exits 0
      # is what let `live/disclosure_gap` drift off its baseline of 0.
      - name: Port-catalog ratchet (skips without the dump corpus)
        run: python3 scripts/ci/port-catalog.py --check --live

      # site/wasm/ is build output that the deploy job rebuilds, so a stale
      # bundle on the runner is not a repository defect. Reported, never fatal.
      - name: Shipped wasm bundle freshness (advisory)
        run: python3 scripts/ci/check-wasm-freshness.py || true

      # Warn-only by design, matching the hook: the port catalog is kept in
      # sync incrementally rather than blocking unrelated changes.
      #
      # `--scan-all`, not the hook's default `--staged`: a CI checkout has an
      # empty staging area, so the staged mode would report "0 warnings across
      # 0 files" forever - a green line that measured nothing.
      #
      # Only the summary line is echoed. The corpus carries a backlog of
      # untagged citations from before the tag convention existed, and a step
      # that prints all of them every run teaches people to skip the whole job.
      # The number is the signal; drill in locally with --scan-all.
      - name: Port-tag drift (advisory)
        run: |
          python3 scripts/ci/check-port-tags.py --scan-all > port-tags.log 2>&1 || true
          tail -1 port-tags.log
          rm -f port-tags.log

  # -- PR Lint ----------------------------------------------------------------
  # The cargo half of `ci` for pull requests: format, clippy, the wasm32
  # type-check (`#[cfg(target_arch = "wasm32")]` code is invisible to every
  # host-target pass) and the test suite. Only the release builds wait for
  # push-to-main. The job keeps its name because branch protection keys on it.
  pr-lint:
    name: PR Lint
    runs-on: self-hosted
    # Same budget as `ci`: a cold cache after a big change can push the test
    # build alone past half an hour on the shared runner.
    timeout-minutes: 120
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Select per-toolchain target dir
        run: scripts/ci/select-ci-target-dir.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: wasm32 type-check
        run: scripts/ci/check-wasm-target.sh

      # No disc here, so every disc-gated test skips and passes; this is the
      # disc-free suite. Last, so a format or lint failure reports first.
      - name: Test
        run: cargo test --workspace --profile release-test

  # -- Cargo CI ---------------------------------------------------------------
  ci:
    name: Legaia CI
    runs-on: self-hosted
    # A cold sccache after a big wave can push the full build + test pass past
    # 30 minutes on the shared runner; match the disc-test job's budget.
    timeout-minutes: 120
    # The full build + test pass runs on push-to-main and workflow_dispatch;
    # pull requests get `pr-lint` (the same tests, without the release builds).
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # CARGO_TARGET_DIR above is the cache ROOT; this step narrows it to a
      # per-toolchain subdirectory and prunes the rest, so a rustc bump on the
      # runner cannot hand the new compiler the old one's rlibs (E0514 in the
      # doctest pass). See the script header.
      - name: Select per-toolchain target dir
        run: scripts/ci/select-ci-target-dir.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      # `release-test` is the release opt-level without thin LTO and with
      # 16 codegen units (Cargo.toml): the test harnesses are uncacheable by
      # sccache, so the LTO + single-codegen-unit link is paid on every run and
      # buys a test nothing. `cargo build --release` below still exercises the
      # shipped profile.
      - name: Test
        run: cargo test --workspace --profile release-test

      - name: Build
        run: cargo build --release --workspace

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build web-viewer for wasm32
        run: cargo build --release --target wasm32-unknown-unknown -p legaia-web-viewer

  # -- Disc-Gated Test Suite --------------------------------------------------
  disc-test:
    name: Disc-Gated Tests
    runs-on: self-hosted
    timeout-minutes: 120
    # Runs on:
    #   (a) manual workflow_dispatch (any branch), OR
    #   (b) a pull_request where the `disc-test` label was just added.
    # Requires the `LEGAIA_DISC_BIN` repository variable to be set to the
    # disc image path on the self-hosted runner (Settings > Variables > Actions).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'disc-test'))
    env:
      LEGAIA_DISC_BIN: ${{ vars.LEGAIA_DISC_BIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      # CARGO_TARGET_DIR above is the cache ROOT; this step narrows it to a
      # per-toolchain subdirectory and prunes the rest, so a rustc bump on the
      # runner cannot hand the new compiler the old one's rlibs (E0514 in the
      # doctest pass). See the script header.
      - name: Select per-toolchain target dir
        run: scripts/ci/select-ci-target-dir.sh

      # A gated test that finds no disc skips and passes, so a green run is
      # not evidence the suite ran. The script checks the image is there, keeps
      # every test's output, and fails on a test that skipped for want of the
      # disc; skips on another input are counted into the job summary.
      - name: Run disc-gated test suite
        run: scripts/ci/run-disc-tests.sh

  # -- Deploy GitHub Pages ----------------------------------------------------
  deploy-pages:
    name: Deploy GitHub Pages
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    # The runner is shared, so this job's wasm-pack build competes with any
    # other build on the box. 10 minutes was tight enough that contention
    # alone could fail a deploy that had nothing wrong with it.
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # CARGO_TARGET_DIR above is the cache ROOT; this step narrows it to a
      # per-toolchain subdirectory and prunes the rest, so a rustc bump on the
      # runner cannot hand the new compiler the old one's rlibs (E0514 in the
      # doctest pass). See the script header.
      - name: Select per-toolchain target dir
        run: scripts/ci/select-ci-target-dir.sh

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi
          wasm-pack --version

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build web-viewer WASM
        run: wasm-pack build crates/web-viewer --target web --release --out-dir ../../site/wasm

      - name: Generate site pages
        run: python3 site/_gen.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -- CI Summary -------------------------------------------------------------
  notify:
    name: CI Summary
    needs: [gates, pr-lint, ci, deploy-pages, disc-test]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Generate summary
        run: |
          echo "## Main CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repo Gates | ${{ needs.gates.result == 'success' && 'pass' || needs.gates.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Lint | ${{ needs.pr-lint.result == 'success' && 'pass' || needs.pr-lint.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CI | ${{ needs.ci.result == 'success' && 'pass' || needs.ci.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Pages | ${{ needs.deploy-pages.result == 'success' && 'pass' || needs.deploy-pages.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Disc Tests | ${{ needs.disc-test.result == 'success' && 'pass' || needs.disc-test.result == 'skipped' && 'skipped' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.gates.result }}" == "failure" || "${{ needs.pr-lint.result }}" == "failure" || "${{ needs.ci.result }}" == "failure" || "${{ needs.disc-test.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "CI failed - please review the logs" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
