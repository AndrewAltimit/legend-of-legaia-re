# Player characters: elemental affinity + favorite-weapon class.
#
# `affinity_strong` / `affinity_weak` are the elements whose attacks the
# character takes less / more damage from: the battle's element-affinity
# matrix (`0x801F53E8` in PROT 0898, `legaia_game_tables::element_affinity`,
# applied by FUN_801DD864 as `atk * matrix[attacker][defender] / 100`) read
# down the column of the character's element (`0x801F5480`). An element is
# strong below 100 and weak above it. The walkthrough this was mined from
# left Vahn's thunder weakness out and gave Gala wind and water, which his
# column scores at 100; `crates/gamedata/tests/characters_vs_disc.rs` pins
# the lists. `ra_seru_element` is the character's element in that table.
#
# `weapon_classes` lists the favorite-weapon class names; cross-checked
# against `weapons.toml` `equip_best`. Per docs/formats/art-data.md, a
# weapon in the favorite class shrinks the Arms-button width in the
# action queue.

[[character]]
key = "Vahn"
name = "Vahn"
ra_seru = "Meta"
ra_seru_element = "fire"
affinity_strong = ["fire"]
affinity_weak = ["water", "thunder"]
weapon_classes = ["Knives", "Swords", "Knuckles"]
notes = "Balanced offense and defense; weak at water-element Seru."

[[character]]
key = "Noa"
name = "Noa"
ra_seru = "Terra"
ra_seru_element = "wind"
affinity_strong = ["wind"]
affinity_weak = ["thunder", "earth"]
weapon_classes = ["Claw", "Feral"]
left_handed = true
notes = "Excellent agility and speed. The only left-handed party member; her Arms button is the right input direction."

[[character]]
key = "Gala"
name = "Gala"
ra_seru = "Ozma"
ra_seru_element = "thunder"
affinity_strong = ["thunder"]
affinity_weak = []
weapon_classes = ["Club", "Mace"]
notes = "Strongest melee output of the three; slower turn order."
