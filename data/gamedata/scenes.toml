# Scene display names: one row per CDNAME block, keyed by its dev label.
#
#   id           the CDNAME.TXT label (`#define <id> N`) the engine and every
#                tool address the scene by
#   cdname       the `#define` number - a raw in-RAM PROT-TOC index; the
#                block's extraction-space first entry is `cdname - 2`
#                (docs/formats/cdname.md, "Numbering space")
#   category     town | field | world_map | cutscene | battle | audio | system
#   name         the display name every consumer shows
#   banner       the scene MAN's section-2 name - the banner the game draws
#                on entering the scene and the save-screen location row
#                (docs/formats/place-names.md, site 3). Omitted where the
#                disc carries none (empty, untranslated Shift-JIS, or no MAN).
#                Pinned to the disc by crates/patcher/tests/place_names_real.rs.
#   contributor  Stann0x's in-game reading of the scene, verbatim in title
#                case, where one was given
#   note         why the name is what it is, when that is not obvious
#
# `name` follows the disc: it keeps the banner's spelling and adds a
# qualifier when several scenes share one banner. Where the contributor's
# reading and the disc disagree on spelling (Byron / Biron, Gate of Shadow /
# Shadow Gate) the disc wins and both are kept here.
#
# Source: scene identifications by Henrique Stanke Scandelari (Stann0x,
# github.com/Stann0xus), cross-checked against the disc's own name carriers
# and each scene's contents. Factual short labels only. Companion page:
# docs/reference/scene-names.md.

