# Armor table: body armor / helmet / shoes.
#
# `slot` = the equipment slot ("armor" / "helmet" / "shoes").
# The stat bonuses are the equipment record's (`DAT_80074F68`, parsed by
# `legaia_game_tables::equip_stats`), which the equip aggregator
# `FUN_801CF650` adds into the character's stats:
#   `int` = record +0 (helmets), `atk` = +1 (footwear), `udf` = +2 (body
#   armour + helmets), `ldf` = +3 (body armour + footwear), `spd` = +4
#   (footwear). A bonus that is zero is left out, except `udf` / `ldf`.
# `udf` = upper defense factor (used by power bytes 0x16-0x1A and 0x0C-0x10).
# `ldf` = lower defense factor (used by power bytes 0x1B-0x1F and 0x11-0x15).
# `equip` = the one character who can wear it (record +6 mask).
#
# The walkthrough this table was mined from printed two numbers per piece
# under UDF / LDF. For a helmet the second is its INT bonus and for footwear
# the first is its ATK bonus; it left out footwear SPD, gave the War God
# Plate the Ra-Seru Plate's numbers and no wearer, and named Vahn for two
# of Gala's plates. Every value here is the disc's, pinned by
# `crates/gamedata/tests/equip_slots_vs_disc.rs`.

