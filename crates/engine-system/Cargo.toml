[package]
name = "legaia-engine-system"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_engine_system"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
legaia-cheats.workspace = true
legaia-gamedata.workspace = true
serde.workspace = true
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
legaia-game-tables.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
