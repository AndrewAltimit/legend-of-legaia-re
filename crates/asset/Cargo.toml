[package]
name = "legaia-asset"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `asset` command-line tool: inspection, scanning and export subcommands over the format crates. No library target."
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[[bin]]
name = "asset"
path = "src/bin/asset.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary and its argument parser. On by default so
# `cargo build` builds the binary; kept as a feature so the package follows
# the same `cli` convention as every other crate with a binary.
cli = ["dep:clap", "dep:libc"]

[dependencies]
anyhow.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
legaia-actor-formats.workspace = true
legaia-bytes.workspace = true
legaia-container-formats.workspace = true
legaia-disc-audit.workspace = true
legaia-game-tables.workspace = true
legaia-iso.workspace = true
legaia-lzs.workspace = true
legaia-minigame-formats.workspace = true
legaia-overlay-images.workspace = true
legaia-prot.workspace = true
legaia-scene-formats.workspace = true
legaia-tim.workspace = true
legaia-tmd.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
