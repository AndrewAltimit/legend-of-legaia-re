[package]
name = "legaia-parity"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one module, which
# src/lib.rs mounts into the unit-test target (see the comment there); no
# integration binary is built.
autotests = false

[lib]
name = "legaia_parity"
