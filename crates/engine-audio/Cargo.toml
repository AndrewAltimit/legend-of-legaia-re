[package]
name = "legaia-engine-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "legaia_engine_audio"
path = "src/lib.rs"

[features]
default = []
# Activates the WebAudio backend for wasm32 targets. Enables a
# `WebAudioOut` struct (ScriptProcessorNode-based) that mirrors the
# `AudioOut` cpal API. Must be initialised from a user-gesture handler.
audio-webaudio = []

[dependencies]
anyhow.workspace = true
cpal = "0.15"
log = "0.4"
legaia-xa = { path = "../xa" }
legaia-vab = { path = "../vab" }
legaia-seq = { path = "../seq" }
legaia-prot = { path = "../prot" }
clap = { version = "4", features = ["derive"] }

# WebAudio deps - pulled in on all wasm32 builds; only wired up when
# audio-webaudio feature is enabled (gates the webaudio module).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "AudioContext",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "AudioNode",
    "AudioDestinationNode",
    "AudioParam",
    "GainNode",
]

[[bin]]
name = "note-trace"
path = "src/bin/note-trace.rs"

[dev-dependencies]
legaia-prot = { path = "../prot" }
# Disc-gated session ladder only: the SFX descriptor table (`DAT_8006F198`)
# and its cue -> VAB-slot routing live in the asset crate, and the ladder
# drives the same decode the hosts do. `legaia-asset` depends on
# prot/lzs/tim/tmd/vab/seq and never on engine-audio, so this dev-only edge is
# acyclic.
legaia-asset = { path = "../asset" }
