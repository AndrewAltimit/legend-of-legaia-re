[package]
name = "legaia-engine-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "legaia_engine_audio"
path = "src/lib.rs"

[features]
default = ["cli"]
# The command-line binary and its argument parser. On by default so
# `cargo build` still builds every binary; library dependents take this
# crate through [workspace.dependencies] with default features off, which
# keeps clap out of library-only builds (the wasm bundle among them).
cli = ["dep:clap"]
# Activates the WebAudio backend for wasm32 targets. Enables a
# `WebAudioOut` struct (ScriptProcessorNode-based) that mirrors the
# `AudioOut` cpal API. Must be initialised from a user-gesture handler.
audio-webaudio = []

[dependencies]
anyhow.workspace = true
log.workspace = true
legaia-xa.workspace = true
legaia-vab.workspace = true
legaia-seq.workspace = true
legaia-prot.workspace = true
clap = { workspace = true, optional = true }

# The native output stream (`AudioOut`). The browser host plays through
# `WebAudioOut` instead, so wasm32 builds never link cpal.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"

# WebAudio deps - pulled in on all wasm32 builds; only wired up when
# audio-webaudio feature is enabled (gates the webaudio module).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "AudioContext",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "AudioNode",
    "AudioDestinationNode",
    "AudioParam",
    "GainNode",
]

[[bin]]
name = "note-trace"
path = "src/bin/note-trace.rs"
required-features = ["cli"]

[dev-dependencies]
legaia-prot.workspace = true
# Disc-gated session ladder only: the SFX descriptor table (`DAT_8006F198`)
# and its cue -> VAB-slot routing live in the asset crate, and the ladder
# drives the same decode the hosts do. `legaia-asset` depends on
# prot/lzs/tim/tmd/vab/seq and never on engine-audio, so this dev-only edge is
# acyclic.
legaia-asset.workspace = true
