[package]
name = "legaia-engine-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_engine_ui"
path = "src/lib.rs"

[dependencies]
legaia-engine-battle-vm.workspace = true
legaia-render-kernels.workspace = true
bytemuck.workspace = true
glam.workspace = true
legaia-font.workspace = true
legaia-tim.workspace = true
legaia-game-tables.workspace = true
legaia-minigame-formats.workspace = true
legaia-ui-formats.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
legaia-engine-camera.workspace = true
legaia-engine-field.workspace = true
# `tests/camera_relative_retail_oracle.rs` reads retail save states (skips
# and passes without the library).
legaia-mednafen.workspace = true
legaia-ram-image.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
