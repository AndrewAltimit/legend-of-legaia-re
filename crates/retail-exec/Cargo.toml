[package]
name = "psx-retail-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[lib]
name = "psx_retail_exec"
path = "src/lib.rs"

[[bin]]
name = "retail-exec"
path = "src/bin/retail-exec.rs"
required-features = ["cli"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
default = ["cli"]
# The command-line binary and its argument parser; library dependents take
# the crate with default features off.
cli = ["dep:clap"]
# Branch coverage of the routines a run executes (`branch_cov`), recorded
# when `PSX_RETAIL_EXEC_BRANCHES` is also set; off, the interpreter's loop
# carries none of it. `scripts/ci/branch-coverage.py --record` turns it on.
branch-cov = []

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
legaia-disc-patch.workspace = true
psx-pcsx-redux.workspace = true
psx-ram-image.workspace = true

[dev-dependencies]
legaia-actor-formats.workspace = true
