[package]
name = "legaia-gamedata"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Curated game-data tables for Legend of Legaia (arts, magic, items, weapons, armor, accessories, enemies, shops, casino, fishing) mined from public walkthroughs and exposed as typed Rust accessors."

[lib]
name = "legaia_gamedata"
path = "src/lib.rs"

[[bin]]
name = "gamedata-tool"
path = "src/bin/gamedata-tool.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary and its argument parser. On by default so
# `cargo build` still builds every binary; library dependents take this
# crate through [workspace.dependencies] with default features off, which
# keeps clap out of library-only builds (the wasm bundle among them).
cli = ["dep:clap", "dep:libc"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
legaia-art.workspace = true

[dev-dependencies]
legaia-asset.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
