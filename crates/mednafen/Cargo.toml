[package]
name = "legaia-mednafen"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "legaia_mednafen"
path = "src/lib.rs"

[[bin]]
name = "mednafen-state"
path = "src/bin/mednafen-state/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary and its argument parser. On by default so
# `cargo build` still builds every binary; library dependents take this
# crate through [workspace.dependencies] with default features off, which
# keeps clap out of library-only builds (the wasm bundle among them).
cli = ["dep:clap", "dep:libc"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
flate2.workspace = true
legaia-asset.workspace = true
legaia-cheats.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
legaia-engine-core.workspace = true
legaia-prot.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
