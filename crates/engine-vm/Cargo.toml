[package]
name = "legaia-engine-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_engine_vm"
path = "src/lib.rs"

[dependencies]
legaia-anm.workspace = true
legaia-minigame-formats.workspace = true
legaia-scene-formats.workspace = true

[dev-dependencies]
anyhow.workspace = true
legaia-prot.workspace = true
# The camera-mover recomp oracle parses the external frame-tagged JSONL
# captures (env-gated via LEGAIA_RECOMP_TRACE_DIR; never committed).
serde_json.workspace = true
# The ambient-motion disc oracle LZS-decodes each scene bundle's MAN to
# re-derive the facing-op census (disc-gated; no bytes committed).
legaia-lzs.workspace = true
legaia-actor-formats.workspace = true
legaia-container-formats.workspace = true
legaia-game-tables.workspace = true
legaia-engine-battle-vm.workspace = true
legaia-engine-motion-vm.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
