[package]
name = "legaia-engine-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_engine_core"
path = "src/lib.rs"

[dependencies]
legaia-engine-mode.workspace = true
legaia-engine-scene.workspace = true
legaia-render-kernels.workspace = true
legaia-engine-battle-vm.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["display"] }
legaia-engine-effects.workspace = true
legaia-engine-field.workspace = true
legaia-engine-menus.workspace = true
legaia-engine-system.workspace = true
legaia-engine-vm.workspace = true
legaia-engine-battle.workspace = true
legaia-engine-minigames.workspace = true
legaia-engine-minigame-scenes.workspace = true
legaia-font.workspace = true
legaia-mes.workspace = true
legaia-prot.workspace = true
legaia-tim.workspace = true
legaia-tmd.workspace = true
legaia-anm.workspace = true
legaia-art.workspace = true
legaia-save.workspace = true
legaia-cheats.workspace = true
legaia-actor-formats.workspace = true
legaia-container-formats.workspace = true
legaia-engine-dialog.workspace = true
legaia-engine-motion-vm.workspace = true
legaia-game-tables.workspace = true
legaia-minigame-formats.workspace = true
legaia-overlay-images.workspace = true
legaia-scene-formats.workspace = true
legaia-ui-formats.workspace = true
legaia-engine-fishing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Disc-gated runtime oracle for the chest randomizer: patch a real disc's MAN in
# memory, then drive the patched bytes through the field VM. The patcher family
# depends only on format crates (never engine-core), so these dev-only edges are acyclic.
legaia-patcher.workspace = true
legaia-arts-patch.workspace = true
legaia-disc-patch.workspace = true
# Disc-gated field-state oracles: load a cataloged PCSX-Redux playthrough anchor's
# main RAM and assert the engine reproduces the captured retail facts. pcsx-redux
# and ram-image depend on no engine crate, so these dev-only edges are acyclic.
legaia-pcsx-redux.workspace = true
legaia-ram-image.workspace = true
# Disc-gated dance-minigame oracle: re-extract the dance overlay (PROT 0980) and
# drive the real parsed step chart through the dance rules engine. prot depends
# only on iso/lzs (never engine-core), so this dev-only edge is acyclic.
legaia-prot.workspace = true
# Save-library-gated live pin for the prescript stager-table relocation
# (u16-offset RAM form at _DAT_8007B8D0). mednafen depends on no engine
# crate, so this dev-only edge is acyclic.
legaia-mednafen.workspace = true
# Named only by tests.
legaia-disc-audit.workspace = true
legaia-iso.workspace = true
legaia-lzs.workspace = true
legaia-mdt.workspace = true
legaia-seq.workspace = true
legaia-vab.workspace = true
legaia-bytes.workspace = true
legaia-gamedata.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
