[package]
name = "legaia-engine-export"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_engine_export"
path = "src/lib.rs"

[dependencies]
legaia-engine-core.workspace = true
legaia-engine-scene.workspace = true
legaia-actor-formats.workspace = true
legaia-engine-field.workspace = true
legaia-engine-vm.workspace = true
legaia-game-tables.workspace = true
legaia-scene-formats.workspace = true
legaia-tim.workspace = true
legaia-tmd.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The disc-gated export test assembles its scene through `scene_staging`.
legaia-engine-world-views.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
