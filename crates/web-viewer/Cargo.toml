[package]
name = "legaia-web-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
legaia-tim.workspace = true
legaia-prot.workspace = true
legaia-asset.workspace = true
legaia-lzs.workspace = true
legaia-iso.workspace = true
legaia-patcher.workspace = true
legaia-tmd.workspace = true
legaia-art.workspace = true
legaia-gamedata.workspace = true
legaia-mes.workspace = true
legaia-seq.workspace = true
legaia-vab.workspace = true
legaia-xa.workspace = true
legaia-mdec.workspace = true
legaia-engine-vm.workspace = true
legaia-engine-ui.workspace = true
glam.workspace = true
legaia-font.workspace = true
legaia-save.workspace = true
legaia-engine-core.workspace = true
legaia-engine-audio = { workspace = true, features = ["audio-webaudio"] }
legaia-engine-session.workspace = true
legaia-engine-screens.workspace = true
legaia-mednafen.workspace = true
serde_json.workspace = true
anyhow.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Storage",
]

[dev-dependencies]
sha2.workspace = true
toml.workspace = true

# Strip only. The name section (function names for stack traces) is about
# 1.5 MB of the bundle and stripping it costs seconds; a full `-O` pass takes
# over twenty minutes on this bundle for a further ~2% gzipped, which no deploy
# budget pays for.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--strip-debug", "--strip-producers"]

[[test]]
name = "integration"
path = "tests/integration.rs"
