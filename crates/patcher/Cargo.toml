[package]
name = "legaia-patcher"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_patcher"
path = "src/lib.rs"

[[bin]]
name = "legaia-patcher"
path = "src/bin/legaia-patcher/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary and its argument parser. On by default so
# `cargo build` still builds every binary; library dependents take this
# crate through [workspace.dependencies] with default features off, which
# keeps clap out of library-only builds (the wasm bundle among them).
cli = ["dep:clap", "dep:libc"]

[dependencies]
legaia-party-swap.workspace = true
legaia-texture-replace.workspace = true
legaia-translate.workspace = true
legaia-disc-patch.workspace = true
anyhow.workspace = true
clap = { workspace = true, optional = true }
legaia-lzs.workspace = true
legaia-asset.workspace = true
legaia-bytes.workspace = true
legaia-mes.workspace = true
legaia-tim.workspace = true
legaia-tmd.workspace = true
legaia-vab.workspace = true
legaia-xa.workspace = true
legaia-art.workspace = true
legaia-prot.workspace = true
legaia-iso.workspace = true
legaia-gamedata.workspace = true
legaia-font.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
encoding_rs.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
# equip_transplant_real writes PNG renders of the transplanted meshes.
png.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
