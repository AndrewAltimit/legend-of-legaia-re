[package]
name = "legaia-pcsx-redux"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_pcsx_redux"
path = "src/lib.rs"

[[bin]]
name = "pcsxr-state"
path = "src/bin/pcsxr-state.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary and its argument parser. On by default so
# `cargo build` still builds every binary; library dependents take this
# crate through [workspace.dependencies] with default features off, which
# keeps clap out of library-only builds (the wasm bundle among them).
cli = ["dep:clap"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
flate2.workspace = true
legaia-ram-image.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The mednafen reader is a dev-dependency for the cross-emulator tests; tim,
# iso and seq for the `bring_your_own_game` example, which runs the generic
# crates on inputs built in code.
legaia-iso.workspace = true
legaia-mednafen.workspace = true
legaia-seq.workspace = true
legaia-tim.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
