[package]
name = "legaia-engine-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[[bin]]
name = "legaia-engine"
path = "src/bin/legaia-engine.rs"

# Windows double-click entry (shipped as "Legend of Legaia.exe"): a
# GUI-subsystem stub that starts legaia-engine without a console window.
[[bin]]
name = "legaia-launch"
path = "src/bin/legaia-launch.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
legaia-art.workspace = true
legaia-asset.workspace = true
legaia-cheats.workspace = true
legaia-engine-core.workspace = true
legaia-engine-vm.workspace = true
legaia-engine-audio.workspace = true
legaia-engine-session.workspace = true
legaia-parity.workspace = true
legaia-engine-render.workspace = true
legaia-prot.workspace = true
legaia-save.workspace = true
legaia-seq.workspace = true
legaia-vab.workspace = true
legaia-tim.workspace = true
legaia-tmd.workspace = true
legaia-font.workspace = true
legaia-mdec.workspace = true
legaia-mednafen.workspace = true
legaia-iso.workspace = true
legaia-xa.workspace = true
glam.workspace = true
png.workspace = true
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["display"] }
sha2.workspace = true
# First-run launcher (`legaia-engine` with no subcommand): the platform config
# dir for the remembered disc path, and a native file picker. rfd's Linux
# backend here is the xdg-desktop-portal (D-Bus, no GTK link), which keeps the
# zig-cross x86_64 Linux release build free of a GTK sysroot.
dirs = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# SIGPIPE reset in the bin's main() so piping stdout into `head` exits
# quietly instead of panicking on a broken pipe.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
legaia-lzs.workspace = true
legaia-mes.workspace = true
# chapter1_spine_oracle Part A reads pcsx-redux .sstate anchors (scene / mode /
# player position) off the save library.
legaia-pcsxr.workspace = true
# `mode_seat_host_parity` drives the BROWSER host beside this one, so the two
# mode traces are compared by running both rather than by transcribing one.
# `legaia-web-viewer` never depends on this crate, so the edge is acyclic, and
# it is dev-only: the shipped `legaia-engine` binary links none of it.
legaia-web-viewer.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
