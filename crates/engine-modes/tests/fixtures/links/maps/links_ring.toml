# A walled ring over the retail `tower`: a three-tile corridor round an
# inner block, the race track of `links-race`.
name = "Tower Ring"
base = { scene = { kind = "scene", name = "tower" }, geometry = "none" }

[tiles]
origin = [16, 16]
