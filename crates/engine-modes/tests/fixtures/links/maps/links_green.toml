# A walled green over the retail `tower`: fairway, a rough patch, a bunker,
# a pond and a raised plateau.
name = "Tower Green"
base = { scene = { kind = "scene", name = "tower" }, geometry = "none" }
floor_heights = [0, 48]

[tiles]
origin = [16, 16]
rows = [
  "##############",
  "#............#",
  "#.T........O.#",
  "#........,,,.#",
  "#....ww......#",
  "#....ww..ss..#",
  "#........ss..#",
  "#.O..^^^...T.#",
  "#....^^^.....#",
  "##############",
]

[tiles.legend]
"#" = { label = "wall", walls = "all" }
"." = { label = "fairway", ground = { kind = "base_cell", cell = [8, 11] } }
"T" = { label = "tee", ground = { kind = "base_cell", cell = [8, 11] } }
"O" = { label = "cup", ground = { kind = "base_cell", cell = [8, 11] } }
"," = { label = "long grass", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
"s" = { label = "sand bunker", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 2 } }
"w" = { label = "pond water", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 3 } }
"^" = { label = "plateau", height = 1, ground = { kind = "texture", tpage = 28, clut = 32576, tile = 0 } }

[[spawns]]
id = "tee"
tile = [2, 2]
