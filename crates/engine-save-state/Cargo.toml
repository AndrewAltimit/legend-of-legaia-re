[package]
name = "legaia-engine-save-state"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/integration.rs gathers every tests/*.rs into one binary.
autotests = false

[lib]
name = "legaia_engine_save_state"
path = "src/lib.rs"

[dependencies]
legaia-engine-core.workspace = true
legaia-engine-battle.workspace = true
legaia-engine-menus.workspace = true
legaia-engine-mode.workspace = true
legaia-engine-system.workspace = true
legaia-save.workspace = true

[dev-dependencies]
legaia-engine-world-views.workspace = true
# `finish_battle` for the capture round-trips (`world::test_drivers`).
legaia-engine-core = { workspace = true, features = ["test-drivers"] }
legaia-engine-battle-vm.workspace = true
legaia-engine-field.workspace = true
legaia-prot.workspace = true
legaia-scene-formats.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
