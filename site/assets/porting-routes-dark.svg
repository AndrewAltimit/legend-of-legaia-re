<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" width="1000" height="466" role="img" aria-labelledby="t d"><title id="t">Three ways to port a PS1 game</title><desc id="d">Decompilation starts from the executable rewritten as source and produces source that rebuilds the game, with fidelity proved by the byte match. Static recompilation translates the machine code and produces the original game running over a hardware model, with fidelity inherited. Reimplementation, this repository&#x27;s route, starts from format docs and traced behaviour and produces a new engine that loads the game data, with fidelity measured against retail states. A recomp gets you the game. A reimplementation, plus the oracles that measure it, gets you an engine for the game.</desc><defs><marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3}.h{font-size:19px;font-weight:700}.nl{font-size:14.5px;font-weight:600}.ns{font-size:12.5px;fill:#9198a1}.ni{font-size:13px}.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em;fill:#9198a1}.pl{font-size:12px;font-weight:700;fill:#0d1117}.tg{font-size:15px;font-style:italic}</style><rect width="1000" height="466" rx="12" fill="#151b23"/><rect x="20" y="20" width="300" height="390" rx="10" fill="#4493f8" fill-opacity="0.0" stroke="#4493f8" stroke-width="1.2"/><text x="170.0" y="52" class="h" text-anchor="middle" fill="#4493f8">Decompilation</text><text x="36" y="104" class="cap">STARTS FROM</text><rect x="34" y="112" width="272" height="60" rx="7" fill="#4493f8" fill-opacity="0.10" stroke="#4493f8" stroke-width="1.2"/><text x="170.0" y="137" class="nl" text-anchor="middle">The executable</text><text x="170.0" y="157" class="ns" text-anchor="middle">rewritten as source, function by function</text><text x="36" y="206" class="cap">PRODUCES</text><rect x="34" y="214" width="272" height="60" rx="7" fill="#4493f8" fill-opacity="0.10" stroke="#4493f8" stroke-width="1.2"/><text x="170.0" y="239" class="nl" text-anchor="middle">Source that rebuilds the game</text><text x="170.0" y="259" class="ns" text-anchor="middle">matching: compiles to the retail bytes</text><path d="M170.0,172 L170.0,194" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#ra)"/><text x="36" y="296" class="cap">FIDELITY</text><text x="36" y="316" class="nl">Fidelity is proved</text><text x="36" y="333" class="ns">by the byte match, per function</text><text x="36" y="358" class="cap">GOOD AT</text><text x="36" y="377" class="ni">Exact source-level truth;</text><text x="36" y="394" class="ni">source mods; retarget it later</text><rect x="350" y="20" width="300" height="390" rx="10" fill="#ab7df8" fill-opacity="0.0" stroke="#ab7df8" stroke-width="1.2"/><text x="500.0" y="52" class="h" text-anchor="middle" fill="#ab7df8">Static recompilation</text><text x="366" y="104" class="cap">STARTS FROM</text><rect x="364" y="112" width="272" height="60" rx="7" fill="#ab7df8" fill-opacity="0.10" stroke="#ab7df8" stroke-width="1.2"/><text x="500.0" y="137" class="nl" text-anchor="middle">The executable&#x27;s machine code</text><text x="500.0" y="157" class="ns" text-anchor="middle">translated whole into host code</text><text x="366" y="206" class="cap">PRODUCES</text><rect x="364" y="214" width="272" height="60" rx="7" fill="#ab7df8" fill-opacity="0.10" stroke="#ab7df8" stroke-width="1.2"/><text x="500.0" y="239" class="nl" text-anchor="middle">The original game, running</text><text x="500.0" y="259" class="ns" text-anchor="middle">over a model of the PS1 hardware</text><path d="M500.0,172 L500.0,194" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#ra)"/><text x="366" y="296" class="cap">FIDELITY</text><text x="366" y="316" class="nl">Fidelity is inherited</text><text x="366" y="333" class="ns">its code runs, translated</text><text x="366" y="358" class="cap">GOOD AT</text><text x="366" y="377" class="ni">Retail behaviour early, with</text><text x="366" y="394" class="ni">its quirks and timing included</text><rect x="680" y="20" width="300" height="390" rx="10" fill="#3fb950" fill-opacity="0.07" stroke="#3fb950" stroke-width="2.2"/><text x="830.0" y="52" class="h" text-anchor="middle" fill="#3fb950">Reimplementation</text><rect x="768.0" y="62" width="124" height="22" rx="11" fill="#3fb950"/><text x="830.0" y="78" class="pl" text-anchor="middle">this repository</text><text x="696" y="104" class="cap">STARTS FROM</text><rect x="694" y="112" width="272" height="60" rx="7" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-width="1.2"/><text x="830.0" y="137" class="nl" text-anchor="middle">Format docs + traced behaviour</text><text x="830.0" y="157" class="ns" text-anchor="middle">the disassembly read, never translated</text><text x="696" y="206" class="cap">PRODUCES</text><rect x="694" y="214" width="272" height="60" rx="7" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-width="1.2"/><text x="830.0" y="239" class="nl" text-anchor="middle">A new engine for the game</text><text x="830.0" y="259" class="ns" text-anchor="middle">loads the game data off your disc</text><path d="M830.0,172 L830.0,194" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#ra)"/><text x="696" y="296" class="cap">FIDELITY</text><text x="696" y="316" class="nl">Fidelity is measured</text><text x="696" y="333" class="ns">against retail states, ratcheted</text><text x="696" y="358" class="cap">GOOD AT</text><text x="696" y="377" class="ni">New renderers, hosts, mechanics;</text><text x="696" y="394" class="ni">modding by game concept</text><text x="500.0" y="442" class="tg" text-anchor="middle">A recomp gets you the game. A reimplementation, plus the oracles that measure it, gets you an engine for the game.</text></svg>
