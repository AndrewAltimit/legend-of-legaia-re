<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 366" width="1094" height="366" role="img" aria-labelledby="t d"><title id="t">From your disc to everything the project makes</title><desc id="d">Your disc image is read into its files, PROT.DAT's entries and decoded assets, which feed the port, the viewers and exported files; legaia-patcher writes a patched image or a PPF.</desc><defs><marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}.nl{font-size:15px;font-weight:600}.ns{font-size:12.5px;fill:#59636e}</style><rect width="1094" height="366" rx="12" fill="#f6f8fa"/><path d="M210,140.0 L233,140.0" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#mm)"/><path d="M426,140.0 L449,140.0" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#mm)"/><path d="M642,140.0 L665,140.0" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#mm)"/><path d="M858,140.0 C869.5,140.0 869.5,54.0 881,54.0" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#mm)"/><path d="M858,140.0 L881,140.0" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#mm)"/><path d="M858,140.0 C869.5,140.0 869.5,226.0 881,226.0" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#mm)"/><path d="M547.0,174 L547.0,275" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#mp)"/><path d="M642,312.0 L881,312.0" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#mp)"/><rect x="20" y="106" width="190" height="68" rx="8" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-width="1.4"/><text x="115.0" y="132" class="nl" text-anchor="middle">Your disc image</text><text x="115.0" y="151" class="ns" text-anchor="middle">.bin / .cue</text><rect x="236" y="106" width="190" height="68" rx="8" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-width="1.4"/><text x="331.0" y="132" class="nl" text-anchor="middle">Disc files</text><text x="331.0" y="151" class="ns" text-anchor="middle">PROT.DAT, SCUS_942.54,</text><text x="331.0" y="165" class="ns" text-anchor="middle">movies, XA</text><rect x="452" y="106" width="190" height="68" rx="8" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-width="1.4"/><text x="547.0" y="132" class="nl" text-anchor="middle">PROT.DAT entries</text><text x="547.0" y="151" class="ns" text-anchor="middle">named by CDNAME.TXT</text><rect x="668" y="106" width="190" height="68" rx="8" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-width="1.4"/><text x="763.0" y="132" class="nl" text-anchor="middle">Decoded assets</text><text x="763.0" y="151" class="ns" text-anchor="middle">textures, meshes, audio,</text><text x="763.0" y="165" class="ns" text-anchor="middle">dialog, scripts, tables</text><rect x="884" y="20" width="190" height="68" rx="8" fill="#0969da" fill-opacity="0.10" stroke="#0969da" stroke-width="1.4"/><text x="979.0" y="46" class="nl" text-anchor="middle">The port</text><text x="979.0" y="65" class="ns" text-anchor="middle">native window and browser</text><rect x="884" y="106" width="190" height="68" rx="8" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-width="1.4"/><text x="979.0" y="132" class="nl" text-anchor="middle">Viewers and data pages</text><text x="979.0" y="151" class="ns" text-anchor="middle">the project site</text><rect x="884" y="192" width="190" height="68" rx="8" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-width="1.4"/><text x="979.0" y="218" class="nl" text-anchor="middle">Files on disk</text><text x="979.0" y="237" class="ns" text-anchor="middle">PNG, WAV, O