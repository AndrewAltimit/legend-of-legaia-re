# Genesis Tower, second floor: the Ember Stair. Laid out from scratch
# (`geometry = "none"`) out of the retail Rogue's Tower (`rugi`) brick and
# rock: a stair of fire that climbs away from the camera, landing over
# landing, above the lava lake far down the tower's core. The landing opens
# on the lower hall, its centre aisle cut from the side aisles by two
# chasms with a bridge across each, the lake's glow coming up through them;
# off the hall, the west forge (anvils and a slag trough) and the east ash
# shrine. The first flight climbs to the middle landing, a span of stone
# with nothing either side of it but the drop and four ember pillars on it;
# the second to the upper terrace, where the Cinder Warden's brazier burns
# on a raised dais and the stair up leaves through the far wall behind it.
#
# The follow camera looks south from the north side: every room's north
# edge is a low parapet, its far and side walls stand full height.

name = "Genesis Tower 2F - Ember Stair"
size = [37, 40]
base = { scene = { kind = "scene", name = "rugi" }, geometry = "none" }
# Sound-test track 7, "The Fire Fortress".
bgm = { kind = "bgm", id = 7 }
camera = "far"
# Tier 0 the landing, lower hall and side rooms, tier 1 the middle hall,
# tier 2 the upper terrace, tier 3 the brazier dais. Each flight is the row
# before the next tier: tiers are corner heights, so that row is the slope.
floor_heights = [0, 56, 112, 160]

# Past the floor's edge - and down the chasms and either side of the
# middle landing - the tower falls away to a lake of lava far below, the
# stair's own walls dropping to it. The lake heaves (the lava material
# below tints the drop's own floor).
[surround]
ground = { tpage = 5, clut = 30720, tile = 0 }
side = { tpage = 11, clut = 32523, tile = 38 }
depth = 1024
# The chasm walls go down from the rim into the dark, so each chasm reads
# as a hole and not a block; the lake's glow comes from the lamps and the
# rising embers.
shade = 96
fade = 0
# The tower's outer wall stands round the drop on every side but the
# camera's, so the view over the far walls ends on stone, fading into the
# dark, rather than on the clear colour.
backdrop = { tpage = 11, clut = 32523, tile = 38, height = 1152, distance = 2, shade = 104 }

