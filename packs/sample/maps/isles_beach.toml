# Lantern Isles: the arrival beach. Laid out from scratch over Rim Elm's
# (`town01`) grass, sand and water textures: a long white beach, the surf,
# and a ruined jetty running out into the sea, under the dune terrace - a
# grassy shelf along the cliffs, its lip a low rock face over the sand, with
# the rootlight shrubs along it. The sea stair from the tower's west wall
# lands on the stone platform at the west end, and a sandy stair climbs from
# it onto the terrace; a second stair comes up from mid-beach; Gull Point
# juts out over the sand halfway along; and the dune path climbs from the
# beach onto the terrace and on up the cliff to the village.
# Palms and ferns are the West Voz Forest's (`vell`), the wreck, crates and
# driftwood Rim Elm's.

name = "Lantern Isles - Saltwind Beach"
size = [64, 36]
base = { scene = { kind = "scene", name = "town01" }, geometry = "none" }
# Sound-test track 2 (M03, "Winds, Trees and Water"): sea wind, easy and bright.
bgm = { kind = "bgm", id = 2 }
camera = "far"
# Tiers: sand, the dune terrace, the cliff top, the seabed, the outcrops
# (and the landing, set by its plateau).
# The terrain below smooths them into slopes and sculpts the rest.
floor_heights = [0, 100, 300, -70, 34]

[tiles]
