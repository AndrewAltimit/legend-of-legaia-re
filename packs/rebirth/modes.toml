# --- The Gambler's Rest (Tower of Rebirth, 5F) -------------------------------
#
# Keeper Odalric's five tables. The keeper's quests (quests.toml,
# `keeper_tables`, `high_roller`) count wins at each of them by id.

# High stakes for a late-game purse: buy in for 5,000 gold, five expert
# opponents, blinds doubling every eight hands.
[[poker]]
id = "tower-high-table"
name = "Tower High Table"
location = { kind = "scene", name = "koin1" }
seats = 6
buy_in = 5000
small_blind = 50
big_blind = 100
currency = "gold"
chip_value = 1
ai_tier = "expert"
max_hands = 60
blind_double_every = 8
# Dealt at the High Table in the Gambler's Rest hall: five of the tower's
# regulars round the felt, the player's chair at its south edge.
map = "rebirth_tower_5f"
spawn = "from_below"

[poker.table]
tile = [18, 10]
facing = 0
radius = 92
# Dealt on the table's own felt; the hall's card table that stands there
# between games (the map's `high_table` prop) is put away while the seat
# is taken.
hide = ["high_table"]
height = 84
# Reactions picked from front renders of each regular's rig. Odile reacts
# in his chair (29 chin in hand while he thinks, 30 a fist on a win, 33 a
# hand over his face on a loss); Brann's rig has one seated clip, his sit,
# so he takes his results sitting still.
players = [
  { npc = "high_table_odile", name = "Odile", sit = 31, think = 29, cheer = 30, slump = 33 },
  { npc = "high_table_brann", name = "Brann", sit = 46 },
  { npc = "high_table_sefa", name = "Sefa", cheer = 27, slump = 28 },
  { npc = "high_table_corwin", name = "Corwin", cheer = 35, slump = 37 },
  { npc = "high_table_mott", name = "Old Mott", cheer = 25, slump = 28 },
]

# The keeper plays the tower's own breed, hands face up, captures chaining
# and the loser's best card on the line.
[[card_duels]]
id = "wardens-duel"
name = "The Warden's Duel"
deck = ["ironhide-brute", "rune-sentinel", "ember-scale", "iron-colossus", "frost-maw"]
ai_tier = "expert"
elemental_cells = true
chain = true
stakes = true
win_booster = "mistborn"
# Played at the card room's table on the Gambler's Rest floor, the
# Warden's second across the board and two regulars looking on.
map = "rebirth_tower_5f"
spawn = "from_below"

[card_duels.table]
tile = [3, 12]
offset = [64, 0, 0]
facing = 0
# The duel lays its own table; the card room's `card_table` that stands
# there between duels is put away while it is played.
hide = ["card_table"]
# The second spreads his arms wide on a win (35) and bows his head over
# the board on a loss (37).
opponent = { npc = "duel_second", name = "The Warden's Second", cheer = 35, slump = 37 }
# The watcher throws his arms out for the player (25) and folds them
# against (13); the regular's rig has only two plain idles.
spectators = [{ npc = "duel_regular" }, { npc = "duel_watcher", cheer = 25, slump = 13 }]

