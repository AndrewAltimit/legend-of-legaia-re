# --- Tower Game Night ---------------------------------------------------------
# The Gambler's Rest's party night: six short rounds of the tower's own
# games, scored by placement. Played alone from the 5F games-room table
# (against the keeper and two regulars), or hosted for a room of friends
# from the room screen. Last place picks the next game; the final round
# scores double; the Hold'em round is a wager.
[[party_nights]]
id = "tower-game-night"
name = "Tower Game Night"
location = { kind = "scene", name = "koin1" }
points = [10, 6, 4, 2]
last_place_picks = true
double_final = true
players = 4
rivals = ["Keeper Odalric", "Mirela", "Old Tobin"]
ai_tier = "regular"
# The night ends on a podium in the Rest's hall (5F), facing the stair the
# party came up: the top three's leaders on the blocks, the rivals played
# by the Rest's regulars.
podium = { map = "rebirth_tower_5f", tile = [24, 10], facing = 0, bodies = ["card_room_dealer", "high_table_odile", "high_table_mott"] }

[[party_nights.rounds]]
mode = "tower-green"
name = "Tower Green"

