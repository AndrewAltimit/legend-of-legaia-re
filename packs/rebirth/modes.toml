# Rebirth game-mode instances. Rules live in the engine; these pick the
# numbers and the layout.

[[poker]]
id = "mist-lantern-table"
name = "Mist Lantern Table"
seats = 4
buy_in = 1000
small_blind = 10
big_blind = 20
currency = "coins"
chip_value = 1
ai_tier = "regular"
blind_double_every = 10
# Dealt by lantern light on the meadow below the lodge in Tolva's Haven:
# three islanders round a plank table, the player's place at its south
# edge, looking up at the lodge's hedge.
map = "isles_village"
spawn = "from_thornwood"

[poker.table]
tile = [56, 32]
facing = 0
radius = 90
# The game is dealt on the table's own felt; the plank table that stands
# on that tile between games (the map's `lantern_table` prop) is put away
# while the seat is taken.
hide = ["lantern_table"]
height = 90
# Reactions (cheer on a won pot, slump on a lost one) are clips picked
# from front renders of each NPC's own rig: the islanders throw their arms
# out (25) or hang their heads (22).
players = [
  { npc = "lantern_wenna", name = "Wenna", sit = 34, cheer = 35, slump = 53 },
  { npc = "lantern_harl", name = "Harl", cheer = 25, slump = 22 },
  { npc = "lantern_ysel", name = "Ysel", cheer = 25, slump = 22 },
]

