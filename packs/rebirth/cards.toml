# Rebirth trading cards. Each card's art is a retail monster by its
# monster-archive id (1-based, PROT 867): the engine renders that monster
# off the player's own disc as the card's portrait. Names and flavour text
# are the pack's own. Sides are [top, right, bottom, left] for the Grid
# Duel. Format: docs/formats/expansion-pack.md#cardstoml.

# Handed over the first time the collection opens: a duel deck to start.
starter = ["mist-wisp", "burrow-pup", "reed-skimmer", "ember-moth", "hollow-shell"]

[sell_prices]
common = 10
uncommon = 40
rare = 150
legendary = 600

[[cards]]
