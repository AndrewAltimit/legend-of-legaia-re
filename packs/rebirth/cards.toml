# --- Boosters ----------------------------------------------------------------

[[boosters]]
id = "rebirth-starter"
name = "Rebirth Starter Pack"
cards_per_pack = 5
weights = { common = 70, uncommon = 23, rare = 6, legendary = 1 }
guaranteed = "uncommon"
price = 300

[[boosters]]
id = "mistborn"
name = "Mistborn Pack"
cards_per_pack = 3
pool = ["fen-lurker", "gloom-stalker", "veil-phantom", "ruin-titan", "heart-of-the-mist", "mist-wisp"]
weights = { common = 40, uncommon = 35, rare = 20, legendary = 5 }
guaranteed = "rare"
price = 1200

[[boosters]]
id = "hollow-court"
name = "Hollow Court Pack"
cards_per_pack = 3
pool = ["ironhide-brute", "ember-scale", "rune-sentinel", "hollow-sovereign", "iron-colossus", "cinder-drake",
        "magma-visage", "thorn-mantis", "furnace-mask", "fallen-lantern", "storm-gilium", "sovereign-unbound"]
weights = { uncommon = 50, rare = 40, legendary = 4 }
guaranteed = "rare"
price = 4000

# --- Dealers -----------------------------------------------------------------

# The tower's ground floor (maps/rebirth_tower_1f.toml, trigger
# `card_dealer`).
[[dealers]]
id = "tower"
name = "Tower Card Dealer"
stock = ["rebirth-starter", "mistborn", "hollow-court"]
sell_percent = 100

