# Legend of Legaia: Rebirth - progression.
#
# Retail's curve to level 99 asks for 9.6 million XP, 7.5 million of it
# past level 60, and the retail game has nothing left to fight by then.
# Rebirth keeps the retail steps through level 59, then cuts each step to
# about a third, so 60 to 99 costs about 2.4 million. With half again on
# every fight's EXP and the tower's monsters (battle.toml), that is around
# a hundred tower battles - two or three climbs of the tower. The README
# works the numbers through.
# Format: docs/formats/expansion-pack-battle.md.

xp_mul = 1.5
gold_mul = 1.25

[xp_curve]
kind = "banded"
bands = [
    { from_level = 60, mul = 0.35 },
    { from_level = 80, mul = 0.3 },
]

# The tower grows with the party: +1% to its monsters' stats and spoils
# per level of the strongest member past 50, so a floor cleared at 60 still
# answers a party of 99 (x1.49 there). Retail fights are left alone.
[enemy_scaling]
from_level = 50
per_level = 0.01
max_mul = 1.5
scope = "pack"
rewards = true

[[level_rewards]]
level = 60
items = [{ item = { kind = "item", id = 121 }, count = 3 }]

[[level_rewards]]
level = 70
items = [{ item = { kind = "item", id = 248 } }]

[[level_rewards]]
level = 80
items = [{ item = { kind = "item", id = 249 } }]

[[level_rewards]]
level = 90
items = [{ item = { kind = "item", id = 250 } }]

[[level_rewards]]
level = 99
items = [{ item = { kind = "item", id = 237 } }]
