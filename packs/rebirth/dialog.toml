# Legend of Legaia: Rebirth - dialogue.
#
# Each line of `text` is one row of the dialog box; a blank line starts a
# new page. Rows are short: retail boxes do not wrap, and the validator
# warns past 36 characters.
# Format: docs/formats/expansion-pack-quests.md.
#
# The tower's guide is Warden Ysolde, a keeper who once held the tower's
# seal and now speaks through the Warden's Stone on the first floor. Every
# word here is the pack's own.

# --- The Warden's Stone (1F) -------------------------------------------------

[lines.guide_intro]
speaker = "Warden Ysolde"
text = """
...So the stone wakes, and someone
stands before it at last.

I am Ysolde. I kept the seal of
this tower, long before the Mist.

When the Mist was torn away, it
did not simply vanish. What it
had swallowed came here.

Every place it smothered is
remembered inside these walls.
Every beast it twisted, too.

Will you hear what the tower asks
of those who climb it?"""
choices = [
    { label = "Tell me.", set_flags = ["tower_listened"] },
    { label = "Who are you, really?", reply = "A voice with no body left.\nA warden with nothing to guard.\n\nListen, then.", set_flags = ["guide_asked"] },
]

[lines.guide_trial]
speaker = "Warden Ysolde"
text = """
The tower will not open its stair
to the weak. It would only eat you.

Win three battles. Grow until you
stand at level 40.

Then come back to the stone, and
I will unseal the way up."""

[lines.guide_trial_active]
speaker = "Warden Ysolde"
text = """
Three battles, and level 40.

The tower is patient. It has
waited longer than you have
lived."""

[lines.guide_done]
speaker = "Warden Ysolde"
text = """
Yes... you will do.

The seal is lifted. Eight floors
rise above us, each one a memory
the Mist would not let go.

At the top sits the thing that
gathered them. Climb, and do not
let the Seru beside you falter."""

[lines.guide_rebirth]
speaker = "Warden Ysolde"
text = """
The throne is empty, and still
you climb these floors.

Then reach the very peak of
yourself. Level 99, and nothing
less.

Come back to the stone when there
is nothing left in you to grow."""

[lines.guide_rebirth_done]
speaker = "Warden Ysolde"
text = """
There is nothing more the tower
can teach you.

The memories are at rest. The
seal can sleep, and so can I.

Thank you. Whatever you face out
there, you face it reborn."""

[lines.gauntlet_offer]
speaker = "The Bell"
text = """
A bronze bell hangs over the back
of the dais. Its rope is warm.

Ring it, and the tower will send
its first breed against you, wave
after wave."""
choices = [
    { label = "Ring the bell.", battle = "tower_gauntlet" },
    { label = "Leave it.", reply = "The bell sways, and is still." },
]

# --- Floor arrivals ----------------------------------------------------------

[lines.floor_2f_intro]
speaker = "Warden Ysolde"
text = """
(The Ember Stair. Can you feel the
heat? The Mist burned here once.

Something tends the brazier at the
heart of this hall. Approach it
only when you are ready.)"""

[lines.floor_3f_intro]
speaker = "Warden Ysolde"
text = """
(The Hanging Garden. Pretty, isn't
it? Nothing grows here that does
not bite.

The sundial on the middle terrace
counts out the garden's trial.)"""

[lines.floor_4f_intro]
speaker = "Warden Ysolde"
text = """
(The Verdant Vault. A palace court
the green swallowed whole.

Something vast sleeps in the
sunken court. Let it sleep, or
wake it on your own terms.)"""

[lines.floor_5f_intro]
speaker = "Warden Ysolde"
text = """
(The Gambler's Rest. No beast will
follow you this high.

Catch your breath. The keeper here
plays for stakes, not for blood.)"""

[lines.floor_6f_intro]
speaker = "Warden Ysolde"
text = """
(The Engine Deep. The Mist built
machines once. They remember how
to run.

Their master waits in the upper
alcove. The lever below starts
something that does not stop.)"""

[lines.floor_7f_intro]
speaker = "Warden Ysolde"
text = """
(The Sanctum of Echoes. Every
prayer the Mist drowned is still
whispering in these walls.

The voice in the inner hall is
not one of them. Be careful.)"""

[lines.floor_8f_intro]
speaker = "Warden Ysolde"
text = """
(The Hollow Throne.

This is where it all gathered.
Whatever sits up there, it has
been waiting for you.)"""

# --- Floor trials ------------------------------------------------------------

[lines.sundial_offer]
speaker = "The Sundial"
text = """
The sundial's shadow points at no
hour you know.

Turn the dial, and the garden will
test you four times over."""
choices = [
    { label = "Turn the dial.", battle = "garden_gauntlet" },
    { label = "Race the shadow.", challenge = "garden_sprint", battle = "garden_gauntlet" },
    { label = "Not now.", reply = "The shadow creeps back to where\nit started." },
]

[lines.garden_hint]
speaker = "Warden Ysolde"
text = """
(The Hanging Garden waits above.

Turn its sundial and outlast what
comes. The stair beyond answers
only to those who do.)"""

[lines.garden_done]
speaker = "Warden Ysolde"
text = """
(The garden is quiet. Even the
thorns are watching you now.)"""

[lines.engine_offer]
speaker = "The Lever"
text = """
A great iron lever, worn smooth by
hands that are long gone.

Pull it, and the engine will feed
you everything it has."""
choices = [
    { label = "Pull the lever.", battle = "engine_gauntlet" },
    { label = "Vahn pulls alone.", challenge = "lone_fist", battle = "engine_gauntlet" },
    { label = "Step back.", reply = "The engine ticks over, waiting." },
]

[lines.challenge_board]
speaker = "The Trial Stone"
text = """
A plain stone, carved with the
tower's old trials. One glows.

BARE HANDS: win the next battle
in ten rounds, with no items and
no Ra-Seru magic."""
choices = [
    { label = "Take the trial.", challenge = "bare_hands" },
    { label = "Not today.", reply = "The glow fades back into\nthe stone." },
]

# --- Bosses ------------------------------------------------------------------

[lines.ember_offer]
speaker = "The Brazier"
text = """
The brazier flares. A shape of ash
and cinder rises out of it, and
turns its burning face to you.

It has kept this fire since the
Mist first came."""
choices = [
    { label = "Face the Warden.", boss = "cinder_warden" },
    { label = "Step back.", reply = "The flame sinks, but does not\ngo out." },
]

[lines.ember_done]
speaker = "Warden Ysolde"
text = """
(The fire is out. For the first
time in an age, the stair is
cold.)"""

[lines.vault_offer]
speaker = "The Sunken Court"
text = """
The moss in the sunken court is
breathing. Slowly, the whole floor
rises - it was never a floor."""
choices = [
    { label = "Stand and fight.", boss = "verdant_colossus" },
    { label = "Back away quietly.", reply = "The court settles. The moss\nkeeps breathing." },
]

[lines.vault_done]
speaker = "Warden Ysolde"
text = """
(It sleeps for good now. Let the
green have the rest of it.)"""

[lines.regent_offer]
speaker = "The Iron Regent"
text = """
"You walk my halls as if they
belonged to you."

"The engine answers to me. And I
answer to no one.\""""
choices = [
    { label = "Then answer to us.", boss = "iron_regent" },
    { label = "Leave him be.", reply = "\"Run along. The engine will\nstill be here.\"" },
]

[lines.regent_done]
speaker = "Warden Ysolde"
text = """
(The engine is winding down. You
can hear the tower breathe again.)"""

[lines.seraph_offer]
speaker = "The Azure Seraph"
text = """
"Every prayer drowned in the Mist
came to me. I am all of them."

"Will you silence the last voice
left in this sanctum?\""""
choices = [
    { label = "We will.", boss = "azure_seraph" },
    { label = "We will, humbly.", challenge = "humble_seraph", boss = "azure_seraph" },
    { label = "Not yet.", reply = "\"Then I will keep singing.\"" },
]

[lines.seraph_done]
speaker = "Warden Ysolde"
text = """
(The sanctum is silent. Only the
throne is left above you.)"""

[lines.guide_sovereign]
speaker = "The Hollow Throne"
text = """
The throne at the top is not empty.
Something hollow sits there, made
of everything the Mist took.

It knows your names. It has been
saying them for a long time.

Will you climb the last steps?"""
choices = [
    { label = "Climb.", boss = "hollow_sovereign" },
    { label = "Not yet.", reply = "The throne will wait. It has\nnothing else to do." },
]

[lines.guide_sovereign_done]
speaker = "Warden Ysolde"
text = """
The throne is empty at last. The
memories are drifting home.

You did what no one before you
could. The tower is yours now."""

[lines.echo_offer]
speaker = "The Hollow Throne"
text = """
Something stirs on the empty
throne - an echo of what you
broke, still holding its shape."""
choices = [
    { label = "Break it again.", boss = "throne_echo" },
    { label = "Break the storm.", challenge = "echo_storm", boss = "throne_echo" },
    { label = "Let it fade.", reply = "The echo thins, and waits." },
]

# Said at a beaten boss's place in place of its challenge (a trigger gated
# on `requires = { bosses = [...] }`).

[lines.ember_after]
speaker = "The Brazier"
text = """
Cold ash. Nothing rises from it
any more."""

[lines.vault_after]
speaker = "The Sunken Court"
text = """
The moss lies still. It is only
a floor now."""

[lines.regent_after]
speaker = "The Empty Seat"
text = """
The Regent's seat is cold. The
engine runs on without him."""

[lines.seraph_after]
speaker = "The Sanctum"
text = """
No hymn. Only the echo of your
own steps."""

# --- The Gambler's Rest (5F) -------------------------------------------------

[lines.keeper_welcome]
speaker = "Keeper Odalric"
text = """
Well now! Visitors who climbed all
the way up here. Sit, sit.

I am Odalric. I kept the dice when
this was a gambling hall, and I
see no reason to stop now.

Cards, golf, a race, a game of
hide and seek. Win my tables and
I will make it worth your while."""

[lines.keeper_tables]
speaker = "Keeper Odalric"
text = """
Every table in the tower is open
to you now.

Win one of each, and come back to
tell me about it."""

[lines.keeper_done]
speaker = "Keeper Odalric"
text = """
Ha! Every table, beaten.

I have not lost like this since
before the Mist. Take this, and
come back any time."""

[lines.rest_board]
speaker = "The Notice Board"
text = """
THE GAMBLER'S REST

Hold'em at the Tower High Table.
The Warden's Duel, cards on view.

The Rebirth Links, nine holes up
the tower's side. The Spiral
Circuit. And hide and seek in the
Old Vault."""

[lines.rest_cards]
speaker = "Keeper Odalric"
text = """
The card room. Hold'em at the
High Table, or the Warden's Duel
with every card face up."""
choices = [
    { label = "The High Table.", mode = "tower-high-table" },
    { label = "The Warden's Duel.", mode = "wardens-duel" },
    { label = "Not now.", reply = "\"The cards will keep.\"" },
]

# The card room's table (maps/rebirth_tower_5f.toml).
[lines.duel_second_hello]
speaker = "The Warden's Second"
text = """
Sit, if you have five cards and
the nerve. The Warden's deck does
not lose often."""
choices = [
    { label = "Deal me in.", mode = "wardens-duel" },
    { label = "Not yet.", reply = "\"The table will wait.\"" },
]

[lines.duel_regular_hello]
speaker = "Card-Room Regular"
text = """
Watch the corners. The second
plays them like a fortress."""

[lines.duel_watcher_hello]
speaker = "Watching Gambler"
text = """
Two captures in one move and the
whole room stands up. You will see."""

[lines.card_room_dealer_hello]
speaker = "Tower Card Dealer"
text = """
Boosters, singles, a fair price
for what you would rather not
keep."""

[lines.rest_games]
speaker = "Keeper Odalric"
text = """
The games room. Nine holes, a
race, or hide and seek in the
old vault."""
choices = [
    { label = "The Rebirth Links.", mode = "rebirth-links" },
    { label = "The Spiral Circuit.", mode = "spiral-circuit" },
    { label = "The Old Vault.", mode = "old-vault" },
    { label = "Not now.", reply = "\"Come back when you are\nfeeling lucky.\"" },
]

# --- Bounties and errands ----------------------------------------------------

[lines.bounty_ogres_start]
speaker = "Warden Ysolde"
text = """
The Ironhide breed is spreading
out of the tower and into the
fortress below.

Thin them out. Ten will do, for
now."""

[lines.bounty_ogres_done]
speaker = "Warden Ysolde"
text = """
Ten fewer. They will breed again,
of course. Come back when they
do."""

[lines.remedy_start]
speaker = "Warden Ysolde"
text = """
I need a remedy for the stone. It
cracks a little more each day.

Bring me five Healing Fruit, and I
will share what the seal kept for
me."""

[lines.remedy_done]
speaker = "Warden Ysolde"
text = """
Thank you. The cracks are already
closing.

Take these. I have no use for a
body's strength anymore."""

[lines.sentinel_hunt_start]
speaker = "Warden Ysolde"
text = """
(The Brass Sentinels keep marching
out of the Engine Deep.

Break a dozen of them, and the
engine will run slower for it.)"""

[lines.sentinel_hunt_done]
speaker = "Warden Ysolde"
text = """
(A dozen sentinels scrapped. The
engine stutters. Well done.)"""

[lines.every_floor_done]
speaker = "Warden Ysolde"
text = """
(You have stood on every floor of
the tower. Not many can say that.)"""

# --- Boss battle lines ---------------------------------------------------------
#
# Each of these shows as the battle banner, one row, when a boss script
# changes phase, charges a telegraphed move, enrages or makes its last
# stand (battle.toml, `[monsters.<key>.script]`). Keep them to one short row.

[lines.warden_rage]
text = "The Warden's armour splits in fire!"

[lines.warden_inferno]
text = "The Warden burns hotter and hotter!"

[lines.colossus_roots]
text = "Roots knot the Colossus whole again!"

[lines.colossus_quake]
text = "The Colossus raises both fists..."

[lines.colossus_bloom]
text = "The Colossus blooms into rage!"

[lines.regent_guard]
text = "\"Guards! To your Regent!\""

[lines.regent_iron]
text = "\"Kneel. All of you. KNEEL.\""

[lines.regent_crush]
text = "The Regent raises its iron fist..."

[lines.seraph_tide]
text = "The Seraph's wings turn to storm!"

[lines.seraph_tide_charge]
text = "The sea itself rises behind her..."

[lines.seraph_storm]
text = "The sky splits above the Seraph!"

[lines.sovereign_hollow]
text = "\"You fight a shell. I am beneath.\""

[lines.sovereign_unmade]
text = "The Sovereign's mask falls away..."

[lines.sovereign_ultimate]
text = "Light gathers in the hollow crown..."

[lines.sovereign_end]
text = "\"Enough. This tower ends with you.\""

[lines.sovereign_last]
text = "\"Not yet... I am not finished!\""

[lines.unbound_break]
text = "The Unbound tears its chains apart!"

[lines.unbound_charge]
text = "Thunder pours into the Unbound..."

[lines.unbound_last]
text = "\"I was the Mist's last dream!\""

# --- Cutscenes (cutscenes.toml) ----------------------------------------------

[lines.intro_hall]
speaker = "Narration"
text = """
(The hall rises further than the
tower stood tall from outside.

Dust hangs in the air without
falling, as if time stopped here
when the Mist came.)"""

[lines.intro_familiar]
speaker = "The Warden's familiar"
text = """
Rrrowww...

(A grey shape pads down from the
dais and circles you once.

Then it looks back at the great
stone behind it, and waits.)"""

[lines.intro_voice]
speaker = "Warden Ysolde"
text = """
(A voice, faint as settling dust:

...You came. After so long, the
stair has a sound on it again.

Come to the stone. I will tell
you what this tower keeps.)"""

[lines.familiar_purr]
speaker = "The Warden's familiar"
text = """
Rrrowww...

(It keeps one eye on the stone.)"""

[lines.hollow_stirs_voice]
speaker = "The Hollow Voice"
text = """
...I hear you.

Every step up my tower, I hear
you. Every Seru beside you, I
hear it breathing.

Climb, then. I am so tired of
being only what I took."""

[lines.hollow_stirs_reply]
speaker = "Warden Ysolde"
text = """
(Do not answer it.

That is the thing on the throne.
It has never spoken before.

It is afraid of you. Remember
that when you reach the top.)"""

[lines.sovereign_rises]
speaker = "The Hollow Sovereign"
text = """
So the little lights climbed all
the way to me.

I am every voice the Mist ever
swallowed. I am Rim Elm's lost
children. I am the Seru that
never woke.

Take my throne, if you think a
throne is something you can take."""

[lines.sovereign_rises_reply]
speaker = "Warden Ysolde"
text = """
(Steady. It is only as strong as
what it holds on to.

Break its grip, and everything it
took can finally go home.)"""

[lines.sovereign_falls]
speaker = "The Hollow Sovereign"
text = """
...Ah.

So that is what it feels like,
to let go."""

[lines.sovereign_falls_after]
speaker = "Narration"
text = """
(The throne cracks down the middle.
Light pours up out of it, then out
of the walls, then out of the
floor beneath your feet.

Somewhere far below, a bell that
has not rung in a hundred years
rings once.)"""

# --- The Rebirth Isles -------------------------------------------------------

[lines.isles_sea_gate]
text = """
(Salt wind blows through a crack
in the west wall. Beyond it, a
stair runs down to the sea.)
"""

[lines.isles_beach_intro]
text = """
(White sand, a ruined jetty and
the sound of surf. The tower is
nowhere to be seen behind you.)
"""

[lines.isles_ferry_hello]
speaker = "Ferrywoman Maro"
text = """
You came down the old sea stair?
Then the tower let you go. Good.

These are the Rebirth Isles. The
Mist sat on them longest of all.

The village is up over the dunes.
Tell the elder Maro sent you.
"""

[lines.isles_ferry_active]
speaker = "Ferrywoman Maro"
text = """
Over the dunes, to the north-east.
Follow the lanterns.
"""

[lines.isles_ferry_idle]
speaker = "Ferrywoman Maro"
text = """
The tide is kind tonight. Mind
the gulls; they bite.
"""

[lines.isles_elder_hello]
speaker = "Elder Tolva"
text = """
Strangers! From the tower, Maro
says. Then the old stair is open.

Rest at the lodge, and buy what
Pell can spare. You are welcome.
"""

[lines.isles_elder_idle]
speaker = "Elder Tolva"
text = """
The isles remember the Mist, but
we will not let it be all they
remember.
"""

[lines.isles_elder_thorns]
speaker = "Elder Tolva"
text = """
Our path inland is lost under the
Thornwood. Wasps nest in the old
ruins, and something rules them.

The hermit at the ruins' gate has
watched it grow. Will you go?
"""

[lines.isles_elder_thorns_active]
speaker = "Elder Tolva"
text = """
The Thornwood path starts past the
lodge, to the east.
"""

[lines.isles_fisher_offer]
speaker = "Fisher Dunn"
text = """
Every net torn to rags by dawn.
It's the reef beasts - they wade
right up onto the sand at night.

Thin them out for me, would you?
"""

[lines.isles_fisher_active]
speaker = "Fisher Dunn"
text = """
Down on the beach. You'll hear
them before you see them.
"""

[lines.isles_fisher_done]
speaker = "Fisher Dunn"
text = """
Not a tear in a week! Here, take
these. Fresh from the smokehouse.
"""

[lines.isles_shop_keeper]
speaker = "Trader Pell"
text = """
Not much comes over the sea, but
what does, I keep for travellers.
"""

[lines.isles_lodge]
text = """
(The lodge fire is warm. The
party rests.)
"""

[lines.isles_villager_a]
speaker = "Islander"
text = """
My grandmother says the tower
used to ring like a bell.
"""

[lines.isles_villager_b]
speaker = "Islander"
text = """
Don't go into the Thornwood
after dark. The wasps don't
sleep.
"""

[lines.isles_child]
speaker = "Child"
text = """
I found a pearl once! It sang.
Then it rolled into the sea.
"""

[lines.isles_thornwood_intro]
text = """
(Thorns close overhead. Somewhere
ahead, a deep, steady humming.)
"""

[lines.isles_ruins_intro]
text = """
(Old stones under the vines - a
gate, and a hive grown through
it like a second wall.)
"""

[lines.isles_hermit_hello]
speaker = "Hermit Ost"
text = """
Quiet. She can hear you. The
queen sleeps in the gate itself.
"""

[lines.isles_hermit_done]
speaker = "Hermit Ost"
text = """
The hum is gone. Do you hear the
other sound now, under the
stones? The sea, singing.
"""

[lines.isles_hermit_grotto]
speaker = "Hermit Ost"
text = """
The stair past the gate runs down
to the grotto. Whatever sings
there has waited a long time.
"""

[lines.isles_grotto_intro]
text = """
(Water drips in the dark. Light
moves on the walls, as if the
cave were breathing.)
"""

[lines.isles_pearl_done]
speaker = "The Pearl"
text = """
...You are not the Mist. Then I
may sing again.

Take my voice back to the tower.
The isles are awake.
"""

[lines.isles_pearl_idle]
speaker = "The Pearl"
text = """
(A soft note rings through the
grotto, and the water glows.)
"""

[lines.isles_queen_rage]
text = """
The hive shrieks!
"""
