[lines.banner_iron_regent]
text = "Iron Regent, Master of the Engine"

[lines.banner_azure_seraph]
text = "Azure Seraph, Voice of the Sanctum"

[lines.banner_hollow_sovereign]
text = "The Hollow Sovereign"

[lines.banner_throne_echo]
text = "Echo of the Throne"

[lines.fallen_cinder_warden]
text = "The Ember Stair goes cold"

[lines.fallen_verdant_colossus]
text = "The Vault sleeps"

[lines.fallen_iron_regent]
text = "The Engine is still"

[lines.fallen_azure_seraph]
text = "The Sanctum falls silent"

[lines.fallen_throne_echo]
