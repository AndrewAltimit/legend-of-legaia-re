# Legend of Legaia: Rebirth - dialogue.
#
# Each line of `text` is one row of the dialog box; a blank line starts a
# new page. Rows are short: retail boxes do not wrap, and the validator
# warns past 36 characters.
# Format: docs/formats/expansion-pack-quests.md.
#
# The tower's guide is Warden Ysolde, a keeper who once held the tower's
# seal and now speaks through the Warden's Stone on the first floor. Every
# word here is the pack's own.

# --- The Warden's Stone (1F) -------------------------------------------------

[lines.guide_intro]
speaker = "Warden Ysolde"
text = """
...So the stone wakes. I am
Ysolde. I kept this tower's seal.

What the Mist swallowed is here
now. Will you hear what it asks?"""

[lines.guide_trial]
speaker = "Warden Ysolde"
text = """
Win three battles and reach
level 40. Then come back to me.

The sea gate in the west wall
leads to gentler isles."""

[lines.guide_trial_active]
speaker = "Warden Ysolde"
text = """
Three battles, and level 40.
The sea gate west will help."""

[lines.guide_done]
speaker = "Warden Ysolde"
text = """
Yes... you will do. The seal is
lifted, and eight floors await.

The fire on the second floor
wakes at level 50. Climb well."""

[lines.guide_rebirth_done]
speaker = "Warden Ysolde"
text = """
There is nothing more the tower
can teach you.

The true seal is on this stone:
the Mist's first breath. I held
it alone. Help me let it go?"""

[lines.gauntlet_offer]
speaker = "The Bell"
text = """
A bronze bell. Ring it, and the
tower sends its first breed."""
choices = [
    { label = "Ring the bell.", battle = "tower_gauntlet" },
    { label = "Leave it.", reply = "The bell sways, and is still." },
]

# --- The First Breath (1F, past level 99) -------------------------------------

[lines.breath_offer]
speaker = "Warden Ysolde"
text = """
When I lift the seal, it comes
up all at once. That is yours."""
choices = [
    { label = "Lift the seal.", boss = "first_breath" },
    { label = "Not yet.", reply = "Then I hold it a little longer.\nI am good at that." },
]

[lines.breath_done]
speaker = "Warden Ysolde"
text = """
...It is gone. The stone is light.
Thank you. Go on, reborn."""

[lines.breath_wind]
text = "The Breath turns to a howling gale!"

[lines.breath_thunder]
text = "The heralds answer the Breath!"

[lines.breath_charge]
text = "The whole hall breathes in..."

[lines.breath_end]
text = "The stone shudders under it!"

[lines.breath_last]
text = "It will not be held. It will not!"

# --- Floor arrivals ----------------------------------------------------------
#
# One short page each, said once on a floor's first arrival. Joined, each
# also fits one toast row (a map trigger `kind = "toast"`), so a floor can
# announce itself without stopping the player.

[lines.floor_2f_intro]
speaker = "Warden Ysolde"
text = """
Ember Stair.
Its keeper wakes at Lv 50."""

[lines.floor_3f_intro]
speaker = "Warden Ysolde"
text = """
The Hanging Garden.
Turn the sundial."""

[lines.floor_4f_intro]
speaker = "Warden Ysolde"
text = """
The Verdant Vault.
It stirs at Lv 60."""

[lines.floor_5f_intro]
speaker = "Warden Ysolde"
text = """
The Gambler's Rest.
No beast hunts here."""

[lines.floor_6f_intro]
speaker = "Warden Ysolde"
text = """
Engine Deep.
Its master waits: Lv 70."""

[lines.floor_7f_intro]
speaker = "Warden Ysolde"
text = """
Sanctum of Echoes.
It sings at Lv 80."""

[lines.floor_8f_intro]
speaker = "Warden Ysolde"
text = """
The Hollow Throne.
Climb at Lv 88."""

# --- Floor trials ------------------------------------------------------------

[lines.sundial_offer]
speaker = "The Sundial"
text = """
Turn the dial, and the garden
tests you four times over."""
choices = [
    { label = "Turn the dial.", battle = "garden_gauntlet" },
    { label = "Race the shadow.", challenge = "garden_sprint", battle = "garden_gauntlet" },
    { label = "Not now.", reply = "The shadow creeps back to where\nit started." },
]

[lines.engine_offer]
speaker = "The Lever"
text = """
A great iron lever. Pull it, and
the engine sends all it has."""
choices = [
    { label = "Pull the lever.", battle = "engine_gauntlet" },
    { label = "Vahn pulls alone.", challenge = "lone_fist", battle = "engine_gauntlet" },
    { label = "Step back.", reply = "The engine ticks over, waiting." },
]

[lines.challenge_board]
speaker = "The Trial Stone"
text = """
BARE HANDS: win the next battle in
ten rounds, no items, no magic."""
choices = [
    { label = "Take the trial.", challenge = "bare_hands" },
    { label = "Not today.", reply = "The glow fades back into\nthe stone." },
]

# --- Bosses ------------------------------------------------------------------

[lines.ember_offer]
speaker = "The Brazier"
text = """
A shape of ash rises from the
brazier and turns to face you."""
choices = [
    { label = "Face the Warden.", boss = "cinder_warden" },
    { label = "Step back.", reply = "The flame sinks, but does not\ngo out." },
]

[lines.vault_offer]
speaker = "The Sunken Court"
text = """
The moss in the sunken court is
breathing. Slowly, the whole floor
rises - it was never a floor."""
choices = [
    { label = "Stand and fight.", boss = "verdant_colossus" },
    { label = "Back away quietly.", reply = "The court settles. The moss\nkeeps breathing." },
]

[lines.regent_offer]
speaker = "The Iron Regent"
text = """
"You walk my halls as if they
belonged to you."

"The engine answers to me. And I
answer to no one.\""""
choices = [
    { label = "Then answer to us.", boss = "iron_regent" },
    { label = "Leave him be.", reply = "\"Run along. The engine will\nstill be here.\"" },
]

[lines.seraph_offer]
speaker = "The Azure Seraph"
text = """
"Every prayer drowned in the Mist
came to me. I am all of them."

"Will you silence the last voice
left in this sanctum?\""""
choices = [
    { label = "We will.", boss = "azure_seraph" },
    { label = "We will, humbly.", challenge = "humble_seraph", boss = "azure_seraph" },
    { label = "Not yet.", reply = "\"Then I will keep singing.\"" },
]

[lines.guide_sovereign]
speaker = "The Hollow Throne"
text = """
Something hollow sits on the
throne. It knows your names."""
choices = [
    { label = "Climb.", boss = "hollow_sovereign" },
    { label = "Not yet.", reply = "The throne will wait. It has\nnothing else to do." },
]

[lines.guide_sovereign_done]
speaker = "Warden Ysolde"
text = """
The throne is empty at last. Come
back to the stone at level 99."""

[lines.echo_offer]
speaker = "The Hollow Throne"
text = """
Something stirs on the empty
throne - an echo of what you
broke, still holding its shape."""
choices = [
    { label = "Break it again.", boss = "throne_echo" },
    { label = "Break the storm.", challenge = "echo_storm", boss = "throne_echo" },
    { label = "Let it fade.", reply = "The echo thins, and waits." },
]

# Said at a beaten boss's place in place of its challenge (a trigger gated
# on `requires = { bosses = [...] }`).

[lines.ember_after]
speaker = "The Brazier"
text = """
Cold ash. Nothing rises from it
any more."""

[lines.vault_after]
speaker = "The Sunken Court"
text = """
The moss lies still. It is only
a floor now."""

[lines.regent_after]
speaker = "The Empty Seat"
text = """
The Regent's seat is cold. The
engine runs on without him."""

[lines.seraph_after]
speaker = "The Sanctum"
text = """
No hymn. Only the echo of your
own steps."""

# --- The Gambler's Rest (5F) -------------------------------------------------

[lines.keeper_welcome]
speaker = "Keeper Odalric"
text = """
Visitors, this high up! I am
Odalric. I keep the tables here.

Win at every table - the card room
by the bar, the games room past it."""

[lines.keeper_done]
speaker = "Keeper Odalric"
text = """
Ha! Every table, beaten. Take
this, and come back any time."""

[lines.rest_board]
speaker = "The Notice Board"
text = """
THE GAMBLER'S REST: Hold'em, the
Duel, golf, a race, hide and seek."""

[lines.rest_cards]
speaker = "Keeper Odalric"
text = """
The card room. Hold'em at the
High Table, or the Warden's Duel
with every card face up."""
choices = [
    { label = "The High Table.", mode = "tower-high-table" },
    { label = "The Warden's Duel.", mode = "wardens-duel" },
    { label = "Not now.", reply = "\"The cards will keep.\"" },
]

# The card room's table (maps/rebirth_tower_5f.toml).
[lines.duel_second_hello]
speaker = "The Warden's Second"
text = """
Sit, if you have five cards and
the nerve. The Warden's deck does
not lose often."""
choices = [
    { label = "Deal me in.", mode = "wardens-duel" },
    { label = "Not yet.", reply = "\"The table will wait.\"" },
]

[lines.high_table_hello]
speaker = "High Table Regular"
text = """
Five thousand to sit, blinds that
double every eight hands. Pull up
a chair if your purse can stand it."""
choices = [
    { label = "Deal me in.", mode = "tower-high-table" },
    { label = "Not tonight.", reply = "\"The felt will be warm.\"" },
]

[lines.duel_regular_hello]
speaker = "Card-Room Regular"
text = """
Watch the corners. The second
plays them like a fortress."""

[lines.duel_watcher_hello]
speaker = "Watching Gambler"
text = """
Two captures in one move and the
whole room stands up. You will see."""

[lines.duel_regular_after]
speaker = "Card-Room Regular"
text = """
The throne's empty, they say. The
second has been playing looser
ever since. Watch the corners."""

[lines.duel_watcher_after]
speaker = "Watching Gambler"
text = """
You heard it too, didn't you? A
voice from the top of the tower.
The whole room went quiet."""

[lines.duel_second_after]
speaker = "The Warden's Second"
text = """
Odalric says you beat every table
in the house. Sit anyway. The deck
wants a rematch."""
choices = [
    { label = "Deal me in.", mode = "wardens-duel" },
    { label = "Not yet.", reply = "\"The table will wait.\"" },
]

[lines.card_room_dealer_hello]
speaker = "Tower Card Dealer"
text = """
Boosters, singles, a fair price
for what you would rather not
keep."""

[lines.rest_games]
speaker = "Keeper Odalric"
text = """
The games room. Six holes, a
race, or hide and seek in the
old vault."""
choices = [
    { label = "The Rebirth Links.", mode = "rebirth-links" },
    { label = "The Spiral Circuit.", mode = "spiral-circuit" },
    { label = "The Old Vault.", mode = "old-vault" },
    { label = "Not now.", reply = "\"Come back when you are\nfeeling lucky.\"" },
]

# --- Bounties and errands ----------------------------------------------------

[lines.bounty_ogres_done]
speaker = "Warden Ysolde"
text = """
Six packs fewer. Come back when
they breed again."""

[lines.remedy_done]
speaker = "Warden Ysolde"
text = """
The cracks are closing. Take
these, with my thanks."""

# --- Boss battle lines ---------------------------------------------------------
#
# Each of these shows as the battle banner, one row, when a boss script
# changes phase, charges a telegraphed move, enrages or makes its last
# stand (battle.toml, `[monsters.<key>.script]`). Keep them to one short row.

[lines.warden_rage]
text = "The Warden's armour splits in fire!"

[lines.warden_inferno]
text = "The Warden burns hotter and hotter!"

[lines.colossus_roots]
text = "Roots knot the Colossus whole again!"

[lines.colossus_quake]
text = "The Colossus raises both fists..."

[lines.colossus_bloom]
text = "The Colossus blooms into rage!"

[lines.regent_guard]
text = "\"Guards! To your Regent!\""

[lines.regent_iron]
text = "\"Kneel. All of you. KNEEL.\""

[lines.regent_crush]
text = "The Regent raises its iron fist..."

[lines.seraph_tide]
text = "The Seraph's wings turn to storm!"

[lines.seraph_tide_charge]
text = "The sea itself rises behind her..."

[lines.seraph_storm]
text = "The sky splits above the Seraph!"

[lines.sovereign_hollow]
text = "\"You fight a shell. I am beneath.\""

[lines.sovereign_unmade]
text = "The Sovereign's mask falls away..."

[lines.sovereign_ultimate]
text = "Light gathers in the hollow crown..."

[lines.sovereign_end]
text = "\"Enough. This tower ends with you.\""

[lines.sovereign_last]
text = "\"Not yet... I am not finished!\""

[lines.unbound_break]
text = "The Unbound tears its chains apart!"

[lines.unbound_charge]
text = "Thunder pours into the Unbound..."

[lines.unbound_last]
text = "\"I was the Mist's last dream!\""

# --- Cutscenes (cutscenes.toml) ----------------------------------------------

[lines.intro_voice]
speaker = "Warden Ysolde"
text = """
(A voice, faint as dust: ...You
came. Come to the stone.)"""

[lines.familiar_purr]
speaker = "The Warden's familiar"
text = """
Rrrowww...

(It keeps one eye on the stone.)"""

[lines.stair_sealed]
text = """
(Pale light seals the stair.)"""

[lines.familiar_rest]
speaker = "The Warden's familiar"
text = """
Prrr...

(It has curled up on the stone,
as if something heavy has been
lifted from under it.)"""

[lines.hollow_stirs_voice]
speaker = "The Hollow Voice"
text = """
...I hear every step up my tower.
Climb, then. I am so tired."""

[lines.sovereign_rises]
speaker = "The Hollow Sovereign"
text = """
I am every voice the Mist ever
swallowed. Take my throne, if you
think a throne can be taken."""

[lines.sovereign_falls]
speaker = "The Hollow Sovereign"
text = """
...Ah.

So that is what it feels like,
to let go."""

# --- The Rebirth Isles -------------------------------------------------------

[lines.isles_sea_gate]
text = """
(Salt wind blows from the west.)"""

[lines.isles_beach_intro]
text = """
(White sand, surf.
The tower is gone.)"""

[lines.isles_ferry_hello]
speaker = "Ferrywoman Maro"
text = """
These are the Rebirth Isles. The
village is up over the dunes.

Tell the elder Maro sent you."""

[lines.isles_ferry_active]
speaker = "Ferrywoman Maro"
text = """
Over the dunes, to the north-east.
Follow the lanterns.
"""

[lines.isles_ferry_idle]
speaker = "Ferrywoman Maro"
text = """
The tide is kind tonight. Mind
the gulls; they bite.
"""

[lines.isles_elder_hello]
speaker = "Elder Tolva"
text = """
Strangers! From the tower, Maro
says. Then the old stair is open.

Rest at the lodge, and buy what
Pell can spare. You are welcome.
"""

[lines.isles_elder_idle]
speaker = "Elder Tolva"
text = """
The isles remember the Mist, but
we will not let it be all they
remember.
"""

[lines.isles_elder_thorns]
speaker = "Elder Tolva"
text = """
The Thornwood swallowed our path
east, and a hive queen rules it.

A hermit camps below the ruins.
He knows more. Will you go?"""

[lines.isles_elder_thorns_active]
speaker = "Elder Tolva"
text = """
The Thornwood path starts past the
lodge, to the east.
"""

[lines.isles_fisher_offer]
speaker = "Fisher Dunn"
text = """
Reef beasts shred my nets every
night. Thin them out for me?"""

[lines.isles_fisher_active]
speaker = "Fisher Dunn"
text = """
Down on the beach. You'll hear
them before you see them.
"""

[lines.isles_fisher_done]
speaker = "Fisher Dunn"
text = """
Not a tear in a week! Here, take
these. Fresh from the smokehouse.
"""

[lines.isles_shop_keeper]
speaker = "Trader Pell"
text = """
Not much comes over the sea, but
what does, I keep for travellers.
"""

[lines.isles_lodge]
text = """
(The lodge fire is warm. The
party rests.)
"""

[lines.isles_villager_a]
speaker = "Islander"
text = """
My grandmother says the tower
used to ring like a bell.
"""

[lines.isles_villager_b]
speaker = "Islander"
text = """
Don't go into the Thornwood
after dark. The wasps don't
sleep.
"""

[lines.isles_child]
speaker = "Child"
text = """
I found a pearl once! It sang.
Then it rolled into the sea.
"""

[lines.isles_thornwood_intro]
text = """
(Thorns close overhead.
Something hums.)"""

[lines.isles_ruins_intro]
text = """
(A gate, grown through
with a hive.)"""

[lines.isles_thorns_locked]
text = "The elder should hear of you first."

[lines.isles_grotto_locked]
text = "The hive seals the stair down."

[lines.isles_hermit_hello]
speaker = "Hermit Ost"
text = """
Quiet. She can hear you. The
queen sleeps in the gate itself.
"""

[lines.isles_hermit_done]
speaker = "Hermit Ost"
text = """
The hum is gone. Do you hear the
other sound now, under the
stones? The sea, singing.
"""

[lines.isles_hermit_grotto]
speaker = "Hermit Ost"
text = """
The stair past the gate runs down
to the grotto. Whatever sings
there has waited a long time.
"""

[lines.isles_grotto_intro]
text = """
(Water drips. The cave
breathes.)"""

[lines.isles_pearl_done]
speaker = "The Pearl"
text = """
...You are not the Mist. Then I
may sing again.

Take my voice back to the tower.
The isles are awake.
"""

[lines.isles_pearl_idle]
speaker = "The Pearl"
text = """
(A soft note rings through the
grotto, and the water glows.)
"""

[lines.isles_queen_rage]
text = """
Quiet. The queen sleeps
in the gate."""

