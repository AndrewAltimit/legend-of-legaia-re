    { do = "camera", focus = { tile = [24, 20] }, pitch = -14.0, zoom = 0.9, frames = 80 },
    { do = "shake", amplitude = 6, frames = 60 },
    { do = "sound", sound = { kind = "sound", id = "sting_boss" } },
    { do = "shake", amplitude = 16, frames = 50 },
    { do = "flash", color = [90, 255, 120], frames = 36 },
    { do = "tint", color = [0, 40, 10], mode = "add", frames = 30 },
    { do = "banner", line = "banner_verdant_colossus" },
