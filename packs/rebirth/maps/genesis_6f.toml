"^" = { label = "dais", height = 1, ground = { kind = "texture", tpage = 25, clut = 31179, tile = 36 } }
"R" = { label = "the Regent's step", height = 2, ground = { kind = "texture", tpage = 26, clut = 31300, tile = 6 } }
# The side rooms' machine cabinets, the lever and the furnace: solid.
"d" = { label = "cabinet", height = 1, walls = "all", wall = { kind = "box", height = 288, tpage = 9, clut = 31176, tile = 3 } }
