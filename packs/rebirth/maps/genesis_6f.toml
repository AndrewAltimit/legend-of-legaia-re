[tiles.legend]
# Every floor of the Deep is on tier 1 but the Regent's own step: the
# walkways, gantry and bridges are iron decks over the open pit, and a
# space in the rows is the pit itself (the surround's drop, a wall to every
# mover). A wall takes the tier of the floor on its north or west side, so
# no floor's last row tilts into it.
"#" = { label = "wall", height = 1, walls = "all", wall = { kind = "box", height = 320, tpage = 8, clut = 30979, tile = 27 } }
"%" = { label = "wall (dais)", height = 2, walls = "all", wall = { kind = "box", height = 320, tpage = 8, clut = 30979, tile = 27 } }
