# Tower of Rebirth, sixth floor: the Engine Deep. The oval transport hall
# of the retail Jette's Fortress (`chitei2`), kept whole. The Iron Regent
# holds the upper alcove; the lower one starts the Engine Gauntlet, a
# battle that keeps feeding monsters into every seat that frees.

