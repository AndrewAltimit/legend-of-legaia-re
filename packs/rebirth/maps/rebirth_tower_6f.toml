# Tower of Rebirth, sixth floor: the Engine Deep. Laid out from scratch
# (`geometry = "none"`) out of the retail Jette's Fortress (`chitei2`)
# marble, riveted plate and machinery: a long engine hall whose sunken floor
# runs between two raised walkways, crossed by two bridges and ringed with
# railings. Off the walkways' middle, the control room (west), where the
# lever starts the Engine Gauntlet, and the furnace room (east). The Iron
# Regent holds the raised dais at the hall's far end, his flywheels turning
# either side of it; the stair up leaves from the end of the east walkway.
#
# The follow camera looks south from the north side: the hall's and the side
# rooms' north walls are low, so the camera sees in over them.

name = "Tower of Rebirth 6F - Engine Deep"
size = [35, 37]
base = { scene = { kind = "scene", name = "chitei2" }, geometry = "none" }
# Sound-test track 13, "Bio-Castle".
bgm = { kind = "bgm", id = 13 }
camera = "far"
# Tier 0 is the engine floor, tier 1 the walkways, bridges, side rooms and
# the Regent's dais, tier 2 the Regent's own step.
floor_heights = [0, 64, 112]

