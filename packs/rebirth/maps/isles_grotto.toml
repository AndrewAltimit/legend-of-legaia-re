# Rebirth Isles: the Singing Grotto, under the ruins. Laid out from scratch
# over the Snowdrift Cave's (`cave01`) blue rock: a stair down from the
# ruins' gate, a cavern of dripping stone and mushrooms, and a still pool at
# its heart with an islet where the Pearl sings. Water light ripples on the
# walls, crystals turn over the pool, and the drips never stop.

name = "Rebirth Isles - The Singing Grotto"
size = [40, 36]
base = { scene = { kind = "scene", name = "cave01" }, geometry = "none" }
# Sound-test track 20.
bgm = { kind = "bgm", id = 20 }
camera = "far"
floor_heights = [0, 16]

[tiles]
