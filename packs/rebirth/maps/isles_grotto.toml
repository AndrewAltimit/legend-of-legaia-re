rect = [33, 1, 37, 4]
event = { kind = "toast", line = "isles_grotto_intro" }
once = true

# On the islet, the action button speaks to the Pearl.
[[triggers]]
id = "pearl"
rect = [33, 48, 37, 51]
press = true
event = { kind = "talk", npc = "isles_pearl" }

[[triggers]]
id = "pearl_song"
rect = [33, 48, 37, 51]
press = true
event = { kind = "dialog", line = "isles_pearl_idle" }
