# Rebirth Isles: the Singing Grotto, under the ruins. Laid out over the
# Snowdrift Cave's (`cave01`) rock as four chambers linked by passages: the
# antechamber at the foot of the stair; the crystal gallery to the west,
# its walls grown with crystal clusters that light the rock; the mushroom
# grotto to the east round a spring; and, at the end, the singing pool - a
# still lake under a vault with an islet at its heart, reached by stepping
# stones, where the Pearl turns over its rune circle among a crown of
# crystals. A low tunnel runs straight from the antechamber to the pool.

name = "Rebirth Isles - The Singing Grotto"
size = [72, 60]
base = { scene = { kind = "scene", name = "cave01" }, geometry = "none" }
# Sound-test track 20.
bgm = { kind = "bgm", id = 20 }
camera = "far"
# Tiers: the cavern floor, the islet, the rock, the pool's bed.
floor_heights = [0, 20, 340, -110]

