# Lantern Isles: the Singing Grotto, under the ruins. Laid out over the
# Snowdrift Cave's (`cave01`) rock round a great hollow: the stair comes down
# into the antechamber, and from its lip a stone causeway runs out over the
# drop to the Landing, the crown of a rock pillar halfway across. From there
# a bridge goes west to a ledge that climbs into the crystal gallery, another
# east to the mushroom grotto, and the last causeway runs south to the islet
# where the Pearl turns over its rune circle. Far below, the Genesis root
# lights the hollow's floor and the sea that seeps in under the isles; a
# ledge path falls along the east wall to the shelf where the root breaks
# from the rock and dips into the dark, and a low bridge runs from the shelf
# back to the islet. Daylight falls through cracks in the vault.

name = "Lantern Isles - The Singing Grotto"
size = [72, 60]
base = { scene = { kind = "scene", name = "cave01" }, geometry = "none" }
# Sound-test track 3 (M04, "Path of Secrets"): the underground path to Octam.
bgm = { kind = "bgm", id = 3 }
camera = "farther"
# Tiers: the cavern floor, the islet, the rock, the root shelf, the hollow's floor.
floor_heights = [0, 20, 340, -60, -1100]

