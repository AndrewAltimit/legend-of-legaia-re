[[spawns]]
id = "from_ruins"
tile = [20, 2]
facing = 4

[[exits]]
id = "stair_up"
rect = [19, 0, 21, 0]
to = { kind = "map", map = "isles_thornwood", spawn = "from_grotto" }

[[triggers]]
id = "grotto_intro"
rect = [18, 1, 22, 4]
event = { kind = "dialog", line = "isles_grotto_intro" }
once = true

# Wading out to the islet is talking to the Pearl.
[[triggers]]
id = "pearl"
rect = [21, 20, 23, 22]
event = { kind = "talk", npc = "isles_pearl" }

[[triggers]]
id = "pearl_song"
rect = [21, 20, 23, 22]
event = { kind = "dialog", line = "isles_pearl_idle" }
requires = { quests = ["isles_pearl"] }

[[encounters]]
id = "cavern"
rect = [1, 5, 38, 34]
table = "isles_grotto"

# The Pearl: a crystal over the islet, turning and breathing light.
[[props]]
id = "pearl"
mesh = { asset = "models/ember_crystal.glb" }
tile = [22, 21]
offset = [0, 90, 0]
scale = 2.0
animate = [{ kind = "spin", period = 360 }, { kind = "bob", amplitude = 16, period = 180 }, { kind = "pulse", amount = 0.08, period = 90 }]
light = { color = [140, 220, 255], radius = 1100, height = 0, flicker = 0.15, period = 45 }

