# Tower of Rebirth, fifth floor: the Gambler's Rest. The lobby of the
# retail Sol Tower rooms (`koin1`), kept whole. No monster climbs this
# high-ceilinged room; the Rest's keeper runs the tower's tables instead
# (`modes.toml`), and their quests send the party to every one of them.

name = "Tower of Rebirth 5F - Gambler's Rest"
base = { scene = { kind = "scene", name = "koin1" }, geometry = "keep", scenery = true }
# Sound-test track 24, "Where Everyone Drinks".
bgm = { kind = "bgm", id = 24 }
camera = "default"

[tiles]
origin = [62, 56]
rows = [
  "      #..#",
  "      #..#",
  "      #..#",
  "#cccccc..cccccc#",
  "#..............#",
  "#...u..v...w...#",
  "#..............#",
  "#.b#.......##.##",
  "#.b#.......##.#",
  "#.b####....##.#",
  "#.b   ###.#####",
  "###     ###",
]

[tiles.legend]
"#" = { label = "wall", walls = "all" }
"." = { label = "floor" }
"b" = { label = "wall edge", walls = ["tr", "br"] }
"c" = { label = "wall edge", walls = ["tl", "tr"] }
# The lobby's overhead boards (koin1 records 0x813 / 0x817, meshes 96 and
# 106, the far-sorted decoration cells over the counter row) hang between
# the follow camera and the room the Rest's arrivals stand in, and cover
# half the screen. These three cells keep their own floor texture and drop
# the boards (docs/subsystems/renderer.md, the decoration cell's 0x800 flag).
"u" = { label = "floor (boards cleared)", ground = { kind = "base_cell", cell = [66, 61] } }
"v" = { label = "floor (boards cleared)", ground = { kind = "base_cell", cell = [69, 61] } }
"w" = { label = "floor (boards cleared)", ground = { kind = "base_cell", cell = [73, 61] } }

[[spawns]]
id = "from_below"
tile = [13, 6]
facing = 4

[[spawns]]
id = "from_above"
tile = [8, 3]

# Halfway up, once the Verdant Vault has fallen, the thing on the throne
# speaks for the first time (`cutscenes.toml` `hollow_stirs`).
[[enter_cutscenes]]
cutscene = "hollow_stirs"
requires = { quests = ["verdant_vault"] }

[[exits]]
id = "stair_down"
rect = [13, 9, 13, 9]
to = { kind = "map", map = "rebirth_tower_4f", spawn = "from_above" }

[[exits]]
id = "stair_up"
rect = [8, 0, 9, 0]
to = { kind = "map", map = "rebirth_tower_6f", spawn = "from_below" }

[[triggers]]
id = "arrival"
rect = [9, 4, 12, 6]
event = { kind = "dialog", line = "floor_5f_intro" }
once = true

# The keeper's counter: every table quest is given here.
[[triggers]]
id = "keeper"
rect = [5, 4, 6, 5]
event = { kind = "talk", npc = "rest_keeper" }

[[triggers]]
id = "table_board"
rect = [1, 4, 1, 6]
event = { kind = "dialog", line = "rest_board" }

# The keeper's tables open once he has welcomed the party: the card room
# on the west side, the games room on the east.
[[triggers]]
id = "card_room"
rect = [4, 8, 5, 8]
event = { kind = "dialog", line = "rest_cards" }
requires = { quests = ["gamblers_rest"] }

[[triggers]]
id = "games_room"
rect = [9, 8, 10, 8]
event = { kind = "dialog", line = "rest_games" }
requires = { quests = ["gamblers_rest"] }

# The High Table's empty seat: sitting down deals in.
[[triggers]]
id = "high_table_seat"
rect = [7, 9, 7, 9]
event = { kind = "mode", mode = "tower-high-table" }
requires = { quests = ["gamblers_rest"] }

# The Tower Armory (items.toml): its stock grows as the bosses fall.
[[triggers]]
id = "armory"
rect = [2, 6, 3, 6]
event = { kind = "shop", shop = "tower_armory" }

# The games-room table: Tower Game Night, six short rounds against the
# keeper and two regulars (`modes.toml`, `tower-game-night`).
[[triggers]]
id = "game_night_table"
rect = [8, 9, 8, 9]
event = { kind = "mode", mode = "tower-game-night" }
requires = { quests = ["gamblers_rest"] }

# The Rest itself: the party recovers by the hearth, and may save.
[[triggers]]
id = "hearth"
rect = [13, 4, 14, 4]
event = { kind = "rest", save = true }

# ---------------------------------------------------------------------------
# Detail: the Rest by lamplight. The hearth breathes smoke and sparks, the
# lobby's air is full of the dust of a hundred card games, and the Sol
# Tower's own animated fittings run (`scenery`).
# ---------------------------------------------------------------------------

[[emitters]]
kind = "embers"
rect = [13, 4, 14, 4]
height = [0, 30]
count = 18
seed = 501

[[emitters]]
kind = "smoke"
rect = [13, 4, 14, 4]
height = [60, 120]
count = 8
color = [90, 85, 80]
seed = 502

[[emitters]]
kind = "dust"
rect = [1, 4, 14, 8]
count = 50
color = [255, 220, 170]
seed = 503

[lighting]
mood = "dusk"
lamps = [
  { id = "hearth", tile = [13, 4], offset = [0, 60, 0], color = [255, 140, 60], radius = 700, flicker = 0.35, period = 10 },
  { id = "keeper", tile = [5, 4], offset = [0, 160, 0], color = [255, 210, 150], radius = 600 },
]

# Sound: the Rest plays the bar's tune (`bgm` above); the games room on the
# east side has the Sol casino's "Wild Declaration" (18), cross-fading as the
# party walks through its door.
[audio]
fade_frames = 40

[[audio.zones]]
id = "games_room"
rect = [8, 7, 14, 10]
music = { kind = "bgm", id = 18 }

[[audio.ambient]]
id = "hearth"
sound = { kind = "sound", id = "torch" }
tile = [13, 4]
radius = 512
inner = 96
volume = 0.5
