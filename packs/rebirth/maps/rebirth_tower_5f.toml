# Tower of Rebirth, fifth floor: the Gambler's Rest. Laid out from scratch
# (`geometry = "none"`) out of the retail Sol Tower rooms' (`koin1`) dark
# planks, brick and furniture. No monster climbs this high: the stair from
# below opens on the hall, where Keeper Odalric pours behind the long bar,
# five regulars wait round the High Table and the hearth burns on the east
# wall (rest and save). Off the hall, the card room to the west (the
# Warden's Duel table and the tower's card dealer) and the games room to
# the east (Tower Game Night, the arcade cabinets, its own music); behind
# the bar, the lounge with its piano stage and the stair up.
#
# The follow camera looks south from the north side: each room's north edge
# is a low rail, the far and side walls stand full height.

name = "Tower of Rebirth 5F - Gambler's Rest"
size = [37, 30]
base = { scene = { kind = "scene", name = "koin1" }, geometry = "none" }
# Sound-test track 24, "Where Everyone Drinks".
bgm = { kind = "bgm", id = 24 }
camera = "far"
# Tier 1 is the lounge's stage.
floor_heights = [0, 40]

[tiles]
