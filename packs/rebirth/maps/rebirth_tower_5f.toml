# Tower of Rebirth, fifth floor: the Gambler's Rest. The lobby of the
# retail Sol Tower rooms (`koin1`), kept whole. No monster climbs this
# high-ceilinged room; the Rest's keeper runs the tower's tables instead
# (`modes.toml`), and their quests send the party to every one of them.

name = "Tower of Rebirth 5F - Gambler's Rest"
base = { scene = { kind = "scene", name = "koin1" }, geometry = "keep", scenery = true }
# Sound-test track 24, "Where Everyone Drinks".
bgm = { kind = "bgm", id = 24 }
camera = "default"

[tiles]
origin = [62, 56]
rows = [
  "      #..#",
  "      #..#",
  "      #..#",
  "#cccccc..cccccc#",
  "#..............#",
  "#...u..v...w...#",
  "#..............#",
  "#.b#.......##.##",
  "#.b#.......##.#",
  "#.b####....##.#",
  "#.b   ###.#####",
  "###     ###",
]

[tiles.legend]
"#" = { label = "wall", walls = "all" }
"." = { label = "floor" }
"b" = { label = "wall edge", walls = ["tr", "br"] }
"c" = { label = "wall edge", walls = ["tl", "tr"] }
# The lobby's overhead boards (koin1 records 0x813 / 0x817, meshes 96 and
# 106, the far-sorted decoration cells over the counter row) hang between
# the follow camera and the room the Rest's arrivals stand in, and cover
# half the screen. These three cells keep their own floor texture and drop
# the boards (docs/subsystems/renderer.md, the decoration cell's 0x800 flag).
"u" = { label = "floor (boards cleared)", ground = { kind = "base_cell", cell = [66, 61] } }
"v" = { label = "floor (boards cleared)", ground = { kind = "base_cell", cell = [69, 61] } }
"w" = { label = "floor (boards cleared)", ground = { kind = "base_cell", cell = [73, 61] } }

[[spawns]]
id = "from_below"
tile = [13, 6]
facing = 4

[[spawns]]
id = "from_above"
tile = [8, 3]

# Halfway up, once the Verdant Vault has fallen, the thing on the throne
# speaks for the first time (`cutscenes.toml` `hollow_stirs`).
[[enter_cutscenes]]
cutscene = "hollow_stirs"
requires = { quests = ["verdant_vault"] }

[[exits]]
id = "stair_down"
rect = [13, 9, 13, 9]
to = { kind = "map", map = "rebirth_tower_4f", spawn = "from_above" }

[[exits]]
id = "stair_up"
rect = [8, 0, 9, 0]
to = { kind = "map", map = "rebirth_tower_6f", spawn = "from_below" }

# The keeper's counter: every table quest is given here.
[[triggers]]
id = "keeper"
rect = [5, 4, 6, 5]
event = { kind = "talk", npc = "rest_keeper" }

# The notice board by the west wall lists the tables: read once, on the
# first walk past it.
[[triggers]]
id = "table_board"
rect = [1, 4, 1, 6]
event = { kind = "dialog", line = "rest_board" }
once = true

# The keeper's tables open once he has welcomed the party: the card room
# on the west side, the games room on the east.
[[triggers]]
id = "card_room"
rect = [4, 8, 5, 8]
event = { kind = "dialog", line = "rest_cards" }
requires = { flags = ["rest_open"] }

[[triggers]]
id = "games_room"
rect = [9, 8, 10, 8]
event = { kind = "dialog", line = "rest_games" }
requires = { flags = ["rest_open"] }

# The High Table's empty seat: sitting down deals in.
[[triggers]]
id = "high_table_seat"
rect = [7, 9, 7, 9]
event = { kind = "mode", mode = "tower-high-table" }
requires = { flags = ["rest_open"] }

# The Tower Armory (items.toml): its stock grows as the bosses fall.
[[triggers]]
id = "armory"
rect = [2, 6, 3, 6]
event = { kind = "shop", shop = "tower_armory" }

# The games-room table: Tower Game Night, six short rounds against the
# keeper and two regulars (`modes.toml`, `tower-game-night`).
[[triggers]]
id = "game_night_table"
rect = [8, 9, 8, 9]
event = { kind = "mode", mode = "tower-game-night" }
requires = { flags = ["rest_open"] }

# The Rest itself: the party recovers by the hearth, and may save.
[[triggers]]
id = "hearth"
rect = [13, 4, 14, 4]
event = { kind = "rest", save = true }

# ---------------------------------------------------------------------------
# Detail: the Rest by lamplight. The hearth breathes smoke and sparks, the
# lobby's air is full of the dust of a hundred card games, and the Sol
# Tower's own animated fittings run (`scenery`).
# ---------------------------------------------------------------------------

[[emitters]]
kind = "embers"
rect = [13, 4, 14, 4]
height = [0, 30]
count = 18
seed = 501

[[emitters]]
kind = "smoke"
rect = [13, 4, 14, 4]
height = [60, 120]
count = 8
color = [90, 85, 80]
seed = 502

[[emitters]]
kind = "dust"
rect = [1, 4, 14, 8]
count = 50
color = [255, 220, 170]
seed = 503

[lighting]
mood = "dusk"
lamps = [
  { id = "hearth", tile = [13, 4], offset = [0, 60, 0], color = [255, 140, 60], radius = 700, flicker = 0.35, period = 10 },
  { id = "keeper", tile = [5, 4], offset = [0, 160, 0], color = [255, 210, 150], radius = 600 },
  # The game-night table under its own lamp: the room's centre of play.
  { id = "game_table", tile = [8, 9], offset = [0, 180, 0], color = [255, 225, 160], radius = 420, flicker = 0.08, period = 30 },
]

# Sound: the Rest plays the bar's tune (`bgm` above); the games room on the
# east side has the Sol casino's "Wild Declaration" (18), cross-fading as the
# party walks through its door.
[audio]
fade_frames = 40

[[audio.zones]]
id = "games_room"
rect = [8, 7, 14, 10]
music = { kind = "bgm", id = 18 }

[[audio.ambient]]
id = "hearth"
sound = { kind = "sound", id = "torch" }
tile = [13, 4]
radius = 512
inner = 96
volume = 0.5

# --- The card room's duel table (`modes.toml` `wardens-duel`) ---------------
# The Warden's Duel is played at a table on the card room's floor: the
# Warden's second sits across it, two regulars watch from the wall, and the
# tower's card dealer keeps his counter beside them.

[[npcs]]
id = "duel_second"
label = "the Warden's second"
model = { kind = "npc", scene = "koin1", index = 18 }
tile = [8, 8]
facing = 6
line = "duel_second_hello"
line_after = "duel_second_after"
after = { flags = ["tables_beaten"] }

[[npcs]]
id = "duel_regular"
label = "a card-room regular"
model = { kind = "npc", scene = "koin1", index = 12 }
tile = [9, 7]
facing = 2
line = "duel_regular_hello"
line_after = "duel_regular_after"
after = { flags = ["sovereign_fallen"] }

[[npcs]]
id = "duel_watcher"
label = "a watching gambler"
model = { kind = "npc", scene = "koin1", index = 14 }
tile = [9, 8]
facing = 2
line = "duel_watcher_hello"
line_after = "duel_watcher_after"
after = { flags = ["hollow_heard"] }

[[npcs]]
id = "card_room_dealer"
label = "the tower's card dealer"
model = { kind = "npc", scene = "koin1", index = 5 }
tile = [4, 7]
facing = 2
line = "card_room_dealer_hello"
shop = "tower"

# --- The High Table (`modes.toml` `tower-high-table`) ------------------------
# Five regulars sit round the High Table in the hall; the table seats them
# itself, so their tiles here are only where they wait between games.

[[npcs]]
id = "high_table_odile"
label = "Odile, a High Table regular"
model = { kind = "npc", scene = "koin1", index = 16 }
tile = [8, 4]
facing = 2
line = "high_table_hello"

[[npcs]]
id = "high_table_brann"
label = "Brann, a High Table regular"
model = { kind = "npc", scene = "koin1", index = 15 }
tile = [9, 4]
facing = 4
line = "high_table_hello"

[[npcs]]
id = "high_table_sefa"
label = "Sefa, a High Table regular"
model = { kind = "npc", scene = "koin1", index = 17 }
tile = [11, 4]
facing = 4
line = "high_table_hello"

[[npcs]]
id = "high_table_corwin"
label = "Corwin, a High Table regular"
model = { kind = "npc", scene = "koin1", index = 18 }
tile = [12, 4]
facing = 6
line = "high_table_hello"

[[npcs]]
id = "high_table_mott"
label = "Old Mott, a High Table regular"
model = { kind = "npc", scene = "koin1", index = 11 }
tile = [12, 6]
facing = 6
line = "high_table_hello"

# Old Mott's placement is a koin1 slot player, posed seated: he waits on
# one of the Sol Tower's own stools (koin1 mesh 76) rather than on air.
[[decor]]
mesh = { object = 76 }
tile = [12, 6]

# --- The Rest by lantern-light ------------------------------------------------
# Paper lanterns hang over the hall, swaying a little in the hearth's draught
# (`assets/models/lantern.glb`); the regulars' talk fills the room, loudest
# by the tables.

[[props]]
id = "lantern_west"
mesh = { asset = "models/lantern.glb" }
tile = [3, 5]
offset = [0, 250, 0]
scale = 1.4
animate = [{ kind = "sway", axis = "z", degrees = 5.0, period = 170 }, { kind = "spin", period = 900 }]
light = { color = [255, 180, 100], radius = 520, height = 0, flicker = 0.12, period = 26 }

[[props]]
id = "lantern_mid"
mesh = { asset = "models/lantern.glb" }
tile = [10, 5]
offset = [0, 260, 0]
scale = 1.6
animate = [{ kind = "sway", axis = "x", degrees = 4.0, period = 190, phase = 0.3 }, { kind = "spin", period = -1100 }]
light = { color = [255, 180, 100], radius = 600, height = 0, flicker = 0.12, period = 29 }

[[props]]
id = "lantern_east"
mesh = { asset = "models/lantern.glb" }
tile = [14, 6]
offset = [0, 250, 0]
scale = 1.4
animate = [{ kind = "sway", axis = "z", degrees = 5.0, period = 150, phase = 0.6 }, { kind = "spin", period = 1000 }]
light = { color = [255, 180, 100], radius = 520, height = 0, flicker = 0.12, period = 23 }

[[props]]
id = "lantern_games"
mesh = { asset = "models/lantern.glb" }
tile = [10, 8]
offset = [0, 240, 0]
scale = 1.3
animate = [{ kind = "sway", axis = "x", degrees = 5.0, period = 160, phase = 0.5 }]
light = { color = [255, 140, 170], radius = 480, height = 0, flicker = 0.1, period = 31 }

[[audio.ambient]]
id = "crowd_hall"
sound = { kind = "sound", id = "crowd" }
tile = [9, 5]
radius = 1100
inner = 320
volume = 0.45

[[audio.ambient]]
id = "crowd_tables"
sound = { kind = "sound", id = "crowd" }
tile = [8, 8]
radius = 640
inner = 128
volume = 0.5
