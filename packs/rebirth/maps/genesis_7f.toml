# The water: the vault's ribbed cyan light-strip (a palette nothing else on
# the floor draws through), turned to a dark sea green and drifting slowly,
# so the ribs read as the faint swell of still water.
[[materials]]
kind = "tint"
clut = 31042
hue = -10.0
value = -10
color = [44, 84, 112]

[[materials]]
kind = "scroll"
cell = { tpage = 9, clut = 31042, tile = 52 }
dx = 0
dy = 1
period = 20

[fog]
regions = [{ rect = [8, 13, 24, 25], angle = 0.0, spread = 180.0, speed = 6 }]

# Sound: inside the sanctum the floor's music gives way to the tower's echo,
# the pack's own drone (`audio.toml` `tracks.echo_drone`).
[audio]
fade_frames = 90

[[audio.zones]]
id = "inner_sanctum"
rect = [9, 13, 23, 25]
music = { kind = "track", id = "echo_drone" }

# The ring breathes the drone faintly, from each shrine, so the walk round
# to the sanctum's door is never silent between the music zones.
[[audio.ambient]]
id = "shrine_nw"
sound = { kind = "sound", id = "drone" }
tile = [5, 10]
radius = 640
inner = 128
volume = 0.25

[[audio.ambient]]
id = "shrine_ne"
sound = { kind = "sound", id = "drone" }
tile = [27, 10]
radius = 640
inner = 128
volume = 0.25

[[audio.ambient]]
id = "shrine_sw"
sound = { kind = "sound", id = "drone" }
tile = [5, 28]
radius = 640
inner = 128
volume = 0.25

[[audio.ambient]]
id = "shrine_se"
sound = { kind = "sound", id = "drone" }
