# Tower of Rebirth, third floor: the Hanging Garden. The terraces of the
# retail Sky Gardens (`teien`), kept whole, with the garden's own walls
# re-traced. The sundial on the middle terrace runs the Garden Gauntlet:
# four waves in one battle, as often as the party asks for it.

name = "Tower of Rebirth 3F - Hanging Garden"
base = { scene = { kind = "scene", name = "teien" }, geometry = "keep", scenery = true }
# Sound-test track 12, "The Sacred Realm".
bgm = { kind = "bgm", id = 12 }
camera = "default"

[tiles]
origin = [31, 28]
rows = [
  "     #............a#",
  "   #b#.####cd####..a",
  "  #b.#.............e#",
  " #b..#....f...f.....###",
  "#b.#.######...#.......a#",
  "b....#....#g.e#####....a",
  ".##....#..#h.i#..#...#.#",
  ".......#..#...#..#...#..",
  "#......#.........#...##.",
  "#.####.#....f....#f..#..",
  "###....#############.#.#",
  "  #....#.........#.#.#..",
  "  #....#.#.........#.##.",
  "  #....##..........#.#..",
  "  #.####.......#########",
  "  #..................#",
  "###....##............#",
  "g.#.#####........#...#",
  "c.......ibh..ia####..#",
  "###....#.g....e......#",
  "  #g.#...g....e.a...##",
  "   c.....g....ec...e#",
  "   #c..#.g....e#g#.d",
  "    #c...g....e   d#",
]

[tiles.legend]
"#" = { label = "wall", walls = "all" }
"." = { label = "floor" }
"a" = { label = "wall nook", walls = ["tl", "tr", "br"] }
"b" = { label = "wall nook", walls = ["tl", "tr", "bl"] }
"c" = { label = "wall nook", walls = ["tl", "bl", "br"] }
"d" = { label = "wall nook", walls = ["tr", "bl", "br"] }
"e" = { label = "wall edge", walls = ["tr", "br"] }
"f" = { label = "wall edge", walls = ["bl", "br"] }
"g" = { label = "wall edge", walls = ["tl", "bl"] }
"h" = { label = "wall corner", walls = ["tl"] }
"i" = { label = "wall corner", walls = ["tr"] }

[[spawns]]
id = "from_below"
tile = [11, 21]
facing = 4

[[spawns]]
id = "from_above"
tile = [11, 2]

[[exits]]
id = "stair_down"
rect = [10, 23, 13, 23]
to = { kind = "map", map = "rebirth_tower_2f", spawn = "from_above" }

[[exits]]
id = "stair_up"
rect = [8, 0, 15, 0]
to = { kind = "map", map = "rebirth_tower_4f", spawn = "from_below" }

[[triggers]]
id = "arrival"
rect = [9, 19, 14, 20]
event = { kind = "dialog", line = "floor_3f_intro" }
once = true

[[triggers]]
id = "sundial"
rect = [10, 12, 15, 12]
event = { kind = "dialog", line = "sundial_offer" }

[[encounters]]
id = "west_terrace"
rect = [0, 4, 9, 9]
table = "tower_3f"

[[encounters]]
id = "east_terrace"
rect = [15, 4, 23, 13]
table = "tower_3f"

[[encounters]]
id = "lower_garden"
rect = [2, 15, 20, 18]
table = "tower_3f"

# ---------------------------------------------------------------------------
# Detail: the garden in late summer. Leaves fall from the terraces' trees,
# fireflies hang over the lower garden, and a ring of cloud turns slowly
# over the sundial. The garden's own animated scenery plays (`scenery`).
# All of it draws only.
# ---------------------------------------------------------------------------

[[props]]
id = "cloud_ring"
mesh = { object = 3 }
tile = [12, 11]
offset = [0, 230, 0]
scale = 0.45
animate = [{ kind = "spin", period = 900 }, { kind = "bob", amplitude = 12, period = 240 }]
light = { color = [200, 230, 255], radius = 700, height = 0 }

# Young trees in clumps on the lower garden.
[[scatter]]
id = "saplings"
rect = [2, 14, 20, 21]
on = "."
density = 0.5
seed = 301
jitter = 50
scale = [0.4, 0.65]
tilt = 4.0
cluster = { centre = [6.0, 17.0], radius = 5.0, falloff = 1.5 }
meshes = [{ mesh = { object = 5 }, weight = 3 }, { mesh = { object = 8 }, weight = 1 }]

# Flower beds round the sundial (the garden's flowering grass).
[[decals]]
id = "flowers"
cell = { tpage = 8, clut = 32512, tile = 0 }
cells = [{ tpage = 8, clut = 32512, tile = 1 }, { tpage = 8, clut = 32512, tile = 8 }]
rect = [8, 9, 16, 14]
on = "."
density = 0.5
seed = 302
size = [96, 96]
size_jitter = 0.3
sides = 10
jitter = 40

[[emitters]]
kind = "leaves"
rect = [2, 2, 21, 21]
count = 36
seed = 303

[[emitters]]
kind = "sparkles"
rect = [3, 14, 20, 21]
height = [20, 90]
count = 36
color = [210, 255, 120]
seed = 304

[[emitters]]
kind = "dust"
rect = [8, 9, 16, 14]
count = 30
color = [255, 240, 190]
seed = 305

[lighting]
mood = "day"
