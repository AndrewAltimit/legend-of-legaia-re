# Rebirth Isles: Tolva's village at dusk. Laid out from scratch over Rim
# Elm's (`town01`) grass and earth: a green in the middle with the well and
# the windmill, thatched huts round it, the lodge to the east, the trading
# post by the south lane, and the jetty out over the bay. Lanterns burn on
# the lanes, smoke rises from the huts, and the village's beasts wander
# (Rim Elm's own animated scenery, `scenery = true` NPCs).

name = "Rebirth Isles - Tolva's Haven"
size = [52, 42]
base = { scene = { kind = "scene", name = "town01" }, geometry = "none" }
# Sound-test track 6, "Rim Elm".
bgm = { kind = "bgm", id = 6 }
camera = "far"
# Tiers: the meadow, the green, the wooded rise round the village, the bay.
floor_heights = [0, 16, 210, -60]

