# Rebirth Isles: Tolva's village at dusk, a fishing village on a low hill
# over the bay. Laid out from scratch over Rim Elm's (`town01`) grass and
# earth: the lane from the beach runs east past a row of hedged cottages to
# the green, where the well stands and the elder's house looks down from its
# terrace; the market square and Pell's trading post sit south-west of it,
# the south lane runs down to the boardwalk and the two jetties, the lodge
# keeps the east end, and the climb past the orchard leads into the
# Thornwood. The windmill turns on its knoll in the north-west.

name = "Rebirth Isles - Tolva's Haven"
size = [64, 50]
base = { scene = { kind = "scene", name = "town01" }, geometry = "none" }
# Sound-test track 6, "Rim Elm".
bgm = { kind = "bgm", id = 6 }
camera = "far"
# Tiers: the meadow, the green, the wooded rise round the village, the bay.
floor_heights = [0, 16, 210, -60]

