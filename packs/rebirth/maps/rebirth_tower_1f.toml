# Tower of Rebirth, first floor: the Atrium. Unlike the floors above, this
# one is laid out from scratch (`geometry = "none"`): a walled hall with a
# raised dais floating in the dark, built from the retail Sky Gardens
# Tower's (`tower`) textures and meshes. The Warden's Stone stands on the
# dais; the stair at the south edge leads back down to Rim Elm, the one at
# the north edge up into the tower. East of the dais a pillared gallery
# climbs into the Hall of Trials: the gauntlet bell in its niche, the trial
# obelisk in the middle of the floor, and the card dealer's stall against
# the far wall - each a place the party walks to, not a tile it trips over.

name = "Tower of Rebirth 1F - Atrium"
size = [29, 13]
base = { scene = { kind = "scene", name = "tower" }, geometry = "none" }
# Sound-test track 45, "The Sol Tower".
bgm = { kind = "bgm", id = 45 }
camera = "default"
# Tier 0 is the Atrium floor, tier 1 the dais and the Hall of Trials, tier
# 2 the bell niche. Tiers are corner heights, so the gallery's last row of
# cells is a ramp up into the hall and the niche's rim slopes down to it.
floor_heights = [0, 48, 96]

[tiles]
origin = [16, 16]
rows = [
  "#######<#######   ___________",
  "#....bj.jb....#   #::kNBNk::%",
  "#.o.,.,.,.,.o.#   #:O:NNN:O:%",
  "#.............#   #:::::::::%",
  "#,...^^^^^...,#____:::::::::%",
  "#....^^^^^......o..:::::::::%",
  "w,.o.^^^^^.o...........T::::%",
  "#....^^^^^......o..:::::::::%",
  "#,...^^^^^...,#####:::::::::%",
  "#.............#   #:::::::::%",
  "#.,.,.,.,.,.,.#   #:O:::::O:%",
  "#.o...j=j...o.#   #c::cxc::c%",
  "_______>_______   %%%%%%%%%%%",
]

[tiles.legend]
# The walls stand: the Sky Gardens Tower's own tile-sized stone block
# (mesh 10, three storeys) on the north, east and west, and a low generated
# parapet along the south so the follow camera sees over it. The Hall of
# Trials turns that round: the follow camera looks south from its north
# side, so the hall and the gallery keep the low parapet on the camera's
# side and the tall stone on the far side, where it closes the room in.
# The hall's east and south walls stand on its raised floor (`%`), so the
# floor stays level up to them rather than sloping down at the rim.
"#" = { label = "wall", walls = "all", wall = { kind = "mesh", index = 10 } }
"%" = { label = "wall (hall)", height = 1, walls = "all", wall = { kind = "mesh", index = 10 } }
"_" = { label = "parapet", walls = "all", wall = { kind = "box", height = 96, tpage = 28, clut = 32576, tile = 2 } }
"." = { label = "stone floor", ground = { kind = "base_cell", cell = [8, 11] } }
"," = { label = "worn stone", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
"^" = { label = "dais", height = 1, ground = { kind = "texture", tpage = 28, clut = 32576, tile = 0 } }
":" = { label = "hall floor", height = 1, ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
"N" = { label = "bell niche", height = 2, ground = { kind = "texture", tpage = 28, clut = 32576, tile = 0 } }
"B" = { label = "under the bell", height = 2, ground = { kind = "texture", tpage = 28, clut = 32576, tile = 0 } }
# Pillar and statue bases: solid, the floor under them. The columns
# themselves are decorations (below), so each can carry a cap.
"o" = { label = "pillar base", walls = "all", ground = { kind = "base_cell", cell = [8, 11] } }
"O" = { label = "pillar base (hall)", height = 1, walls = "all", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
# Brazier stands (`models/brazier.glb` props): solid.
"j" = { label = "brazier", walls = "all", ground = { kind = "base_cell", cell = [8, 11] } }
"k" = { label = "brazier (hall)", height = 1, walls = "all", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
# The trial obelisk and the card dealer's stall: solid.
"T" = { label = "trial obelisk", height = 1, walls = "all", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
"c" = { label = "stall plants", height = 1, walls = "all", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
"x" = { label = "stall counter", height = 1, walls = "all", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }
# Where the stair-up banners hang: stone floor the wall edges leave bare.
"b" = { label = "banner spot", ground = { kind = "base_cell", cell = [8, 11] } }
"=" = { label = "stair landing", ground = { kind = "base_cell", cell = [8, 11] } }
">" = { label = "stair down", ground = { kind = "base_cell", cell = [8, 11] } }
"<" = { label = "stair up", ground = { kind = "base_cell", cell = [8, 11] } }
# The sea gate: a crack in the west wall, salt wind and a stair down to
# the Rebirth Isles (maps/isles_beach.toml).
"w" = { label = "sea gate", ground = { kind = "texture", tpage = 28, clut = 32576, tile = 1 } }

[[spawns]]
id = "entrance"
tile = [7, 10]
facing = 4

[[spawns]]
id = "from_above"
tile = [7, 2]
# Facing the room, so the follow camera frames it over the low south
# parapet rather than from behind the tall north wall.
facing = 4

# Inside the sea gate, back up from the Rebirth Isles.
[[spawns]]
id = "from_sea"
tile = [1, 6]
facing = 2

# On the dais beside the Warden's Stone: where the Journal's Travel lands.
[[spawns]]
id = "dais"
tile = [7, 7]

# The first arrival plays the tower's intro (`cutscenes.toml`
# `tower_intro`): the camera rises up the hall and the Warden's familiar
# comes down to meet the party.
[[enter_cutscenes]]
cutscene = "tower_intro"

[[exits]]
id = "stair_down"
rect = [7, 12, 7, 12]
to = { kind = "retail", scene = { kind = "scene", name = "town01" }, tile = [20, 44], facing = 4 }

# The way in from the retail game: behind the woodpile by Rim Elm's south
# gate (town01 field-grid tiles 17..18 x 43), clear of the gate's own
# walk-on tiles (24..26, 44..46). The stair down lands beside it on (20, 44).
# It opens to a party that has reached level 30, the level the
# `tower_rumour` quest starts at.
[[entrances]]
id = "rim_elm_mist_stair"
scene = { kind = "scene", name = "town01" }
rect = [17, 43, 18, 43]
spawn = "entrance"
requires = { min_level = 30 }

# The sea gate in the west wall opens once Ysolde has spoken: the Rebirth
# Isles beyond it are where a level-30 party grows into the Warden's Trial.
[[exits]]
id = "sea_gate"
rect = [0, 6, 0, 6]
to = { kind = "map", map = "isles_beach", spawn = "sea_stair" }
requires = { flags = ["tower_heard"] }
locked_line = "isles_sea_gate"
locked_toast = true

# The stair up is the seal Ysolde lifts: shut until the Warden's Trial.
[[exits]]
id = "stair_up"
rect = [7, 0, 7, 0]
to = { kind = "map", map = "rebirth_tower_2f", spawn = "from_below" }
requires = { flags = ["tower_open"] }
locked_line = "stair_sealed"
locked_toast = true

# Stepping onto the dais wakes the floor's guardian - once, ever, and only
# once the seal is lifted (a party fresh from Rim Elm meets the Warden
# first). The stone's own row (8) stays clear of it.
[[triggers]]
id = "dais_guardian"
rect = [5, 5, 9, 7]
event = { kind = "battle", formation = "forge_guard" }
once = true
requires = { flags = ["tower_open"] }


# The card dealer keeps a stall against the Hall of Trials' south wall:
# step up to its counter to buy boosters or sell cards (`cards.toml`
# dealer `tower`).
[[triggers]]
id = "card_dealer"
rect = [23, 10, 23, 10]
event = { kind = "card_dealer", dealer = "tower" }

# The foot of the dais, square in front of the Warden's Stone: stepping up
# to it is talking to the guide, every time. One tile, so crossing the
# dais's front edge does not open a conversation.
[[triggers]]
id = "warden_stone"
rect = [7, 8, 7, 8]
event = { kind = "talk", npc = "tower_guide" }
press = true

# The bell in the Hall of Trials' niche offers the training gauntlet, as
# often as wanted: the tile under it, at the top of the niche, is a dead
# end the party only walks into to ring it.
[[triggers]]
id = "gauntlet_bell"
rect = [23, 1, 23, 1]
event = { kind = "dialog", line = "gauntlet_offer" }
press = true

# The trial obelisk in the middle of the Hall of Trials arms the Bare
# Hands challenge once the Warden's Trial is done: step up to its south
# face.
[[triggers]]
id = "trial_stone"
rect = [23, 7, 23, 7]
event = { kind = "dialog", line = "challenge_board" }
press = true
requires = { quests = ["tower_trial"] }

# The landing by the stair down is a rest point: the party recovers, and
# may write a save.
[[triggers]]
id = "rest_landing"
rect = [9, 11, 11, 11]
event = { kind = "rest", save = true }

# The far ring past the dais rolls the floor's encounter table
# (`battle.toml`, `scene = "tower_1f"`).
[[encounters]]
id = "outer_ring"
rect = [1, 1, 13, 3]
table = "tower_1f"

# The wings beside the dais roll the hound packs (`tower_1f_wings`).
[[encounters]]
id = "west_wing"
rect = [1, 4, 3, 8]
table = "tower_1f_wings"

[[encounters]]
id = "east_wing"
rect = [11, 4, 13, 8]
table = "tower_1f_wings"

# The Warden's Stone: the base pack's altar block (mesh 37).
[[props]]
id = "warden_stone"
mesh = { object = 37 }
tile = [7, 6]
solid = true

# ---------------------------------------------------------------------------
# Detail: what makes the Atrium read as a room rather than a floor plan.
# Everything below draws only - none of it closes a tile - so the Tower Green
# hole on the dais and the Sol Ring round it run as before.
# ---------------------------------------------------------------------------

# Four ember crystals float at the dais corners, turning slowly and bobbing
# out of step, each carrying a warm light. The model is the pack's own
# (`assets/models/ember_crystal.glb`, made by
# `scripts/models/generate_ember_crystal.py`), not a disc mesh.
[[props]]
id = "crystal_nw"
mesh = { asset = "models/ember_crystal.glb" }
tile = [3, 4]
offset = [0, 72, 0]
scale = 1.4
animate = [{ kind = "spin", period = 300 }, { kind = "bob", amplitude = 10, period = 150 }]
light = { color = [255, 150, 70], radius = 560, height = 0, flicker = 0.25, period = 18 }

[[props]]
id = "crystal_ne"
mesh = { asset = "models/ember_crystal.glb" }
tile = [11, 4]
offset = [0, 72, 0]
scale = 1.4
animate = [{ kind = "spin", period = -300 }, { kind = "bob", amplitude = 10, period = 150, phase = 0.25 }]
light = { color = [255, 150, 70], radius = 560, height = 0, flicker = 0.25, period = 18 }

[[props]]
id = "crystal_sw"
mesh = { asset = "models/ember_crystal.glb" }
tile = [3, 8]
offset = [0, 72, 0]
scale = 1.4
animate = [{ kind = "spin", period = -300 }, { kind = "bob", amplitude = 10, period = 150, phase = 0.5 }]
light = { color = [255, 150, 70], radius = 560, height = 0, flicker = 0.25, period = 18 }

[[props]]
id = "crystal_se"
mesh = { asset = "models/ember_crystal.glb" }
