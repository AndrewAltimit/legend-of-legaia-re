# Tower of Rebirth, fourth floor: the Verdant Vault. The overgrown palace
# court of present-day Conkram (`concnow`), kept whole on the base
# scene's own floor ladder: a high terrace ring (tier 8), the broken
# colonnade inside it (tier 7) and the sunken court at the centre (tier
# 1), with the retail stairs between them re-traced. The Verdant Colossus
# sleeps in the sunken court.

name = "Tower of Rebirth 4F - Verdant Vault"
base = { scene = { kind = "scene", name = "concnow" }, geometry = "keep" }
# Sound-test track 8, "Call of the Ruins".
bgm = { kind = "bgm", id = 8 }
camera = "default"

