# Tower of Rebirth, eighth floor: the Hollow Throne. The pillared throne
# hall of the retail Zora's Floating Castle (`taiku2`), kept whole. No
# encounters: the long walk up the carpet is the floor's only fight's
# build-up. The superboss fights in two waves (battle.toml,
# `hollow_throne`).

name = "Tower of Rebirth 8F - Hollow Throne"
base = { scene = { kind = "scene", name = "taiku2" }, geometry = "keep", scenery = true }
# Sound-test track 52, "Ominous Presence".
bgm = { kind = "bgm", id = 52 }
camera = "default"

[tiles]
origin = [46, 3]
rows = [
  "    ###...###",
  "  #cd.......ef#",
  " #c...........f#",
  "#c.............fi",
  "#...............#",
  "#j.#.........#.h#",
