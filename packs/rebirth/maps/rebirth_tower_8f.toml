  "       #a#",
]

[tiles.legend]
"#" = { label = "wall", walls = "all" }
"." = { label = "floor" }
"a" = { label = "wall edge", walls = ["bl", "br"] }
"b" = { label = "wall nook", walls = ["tr", "bl", "br"] }
"c" = { label = "wall nook", walls = ["tl", "tr", "bl"] }
"d" = { label = "wall corner", walls = ["tl"] }
"e" = { label = "wall corner", walls = ["tr"] }
"f" = { label = "wall nook", walls = ["tl", "tr", "br"] }
"g" = { label = "wall corner", walls = ["bl"] }
"h" = { label = "wall edge", walls = ["tr", "br"] }
"i" = { label = "wall nook", walls = ["tl", "bl", "br"] }
"j" = { label = "wall edge", walls = ["tl", "bl"] }
"k" = { label = "wall corner", walls = ["br"] }
"l" = { label = "wall edge", walls = ["tl", "tr"] }

[[spawns]]
id = "from_below"
tile = [8, 23]
facing = 4

[[exits]]
id = "stair_down"
rect = [8, 25, 8, 25]
to = { kind = "map", map = "rebirth_tower_7f", spawn = "from_above" }

[[triggers]]
id = "arrival"
rect = [5, 20, 11, 22]
event = { kind = "dialog", line = "floor_8f_intro" }
once = true

# The approach to the throne, once the Sanctum is silent and while the
# Sovereign stands: it rises and speaks (`cutscenes.toml`
# `sovereign_rises`), and the Hollow Throne quest's offer follows.
[[triggers]]
id = "throne_approach"
rect = [4, 6, 12, 6]
event = { kind = "cutscene", cutscene = "sovereign_rises" }
once = true
requires = { quests = ["sanctum_echoes"], bosses_unbeaten = ["hollow_sovereign"], min_level = 90 }

[[triggers]]
id = "throne"
rect = [5, 1, 11, 2]
event = { kind = "talk", npc = "hollow_throne" }

