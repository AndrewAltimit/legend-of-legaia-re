[tiles.legend]
# A wall takes the tier of the floor on its north or west side: tiers are
# corner heights, so a wall on another tier would tilt that floor's last
# row into it. Its box reaches on down to the lower floor beside it.
# Full-height castle stone on the side and far walls; a low parapet of the
# same stone on every camera-side edge, so the camera sees over it.
"#" = { label = "wall", walls = "all", wall = { kind = "box", height = 320, tpage = 24, clut = 31168, tile = 0 } }
"a" = { label = "wall (chapel)", height = 1, walls = "all", wall = { kind = "box", height = 320, tpage = 24, clut = 31168, tile = 0 } }
"%" = { label = "wall (throne)", height = 2, walls = "all", wall = { kind = "box", height = 320, tpage = 24, clut = 31168, tile = 0 } }
"d" = { label = "wall (throne, dais side)", height = 1, walls = "all", wall = { kind = "box", height = 320, tpage = 24, clut = 31168, tile = 0 } }
"c" = { label = "wall (throne, floor side)", walls = "all", wall = { kind = "box", height = 320, tpage = 24, clut = 31168, tile = 0 } }
"_" = { label = "parapet", walls = "all", wall = { kind = "box", height = 64, tpage = 24, clut = 31168, tile = 1 } }
"b" = { label = "parapet (chapel)", height = 1, walls = "all", wall = { kind = "box", height = 64, tpage = 24, clut = 31168, tile = 1 } }
"." = { label = "flagstones", ground = { kind = "texture", tpage = 24, clut = 31170, tile = 3 } }
"=" = { label = "carpet", ground = { kind = "texture", tpage = 25, clut = 31235, tile = 28 } }
":" = { label = "chapel floor", height = 1, ground = { kind = "texture", tpage = 25, clut = 31234, tile = 4 } }
"^" = { label = "dais", height = 1, ground = { kind = "texture", tpage = 10, clut = 31105, tile = 20 } }
"A" = { label = "throne step", height = 2, ground = { kind = "texture", tpage = 25, clut = 31244, tile = 45 } }
# Square stone piers down the nave and either side of its door: solid.
"o" = { label = "pier", walls = "all", wall = { kind = "box", height = 288, tpage = 24, clut = 31168, tile = 2 } }
"O" = { label = "door pier", walls = "all", wall = { kind = "box", height = 288, tpage = 24, clut = 31168, tile = 2 } }
">" = { label = "stair down", ground = { kind = "texture", tpage = 25, clut = 31235, tile = 28 } }

[[spawns]]
id = "from_below"
tile = [15, 2]
facing = 4

[[exits]]
id = "stair_down"
rect = [15, 0, 15, 0]
to = { kind = "map", map = "rebirth_tower_7f", spawn = "from_above" }

[[triggers]]
id = "arrival"
rect = [10, 2, 20, 3]
event = { kind = "toast", line = "floor_8f_intro" }
once = true

# The foot of the dais, once the Sanctum is silent and while the Sovereign
# stands: it rises and speaks (`cutscenes.toml` `sovereign_rises`), and the
# Hollow Throne quest's offer follows.
[[triggers]]
id = "throne_approach"
rect = [7, 27, 23, 27]
event = { kind = "cutscene", cutscene = "sovereign_rises" }
once = true
requires = { quests = ["sanctum_echoes"], bosses_unbeaten = ["hollow_sovereign"], min_level = 88 }

# The throne's own step, in front of the seat.
[[triggers]]
id = "throne"
rect = [13, 32, 17, 33]
event = { kind = "talk", npc = "hollow_throne" }
press = true

# The nave rolls the throne's honour guard (`battle.toml`, `scene =
# "tower_8f"`): the top table for the last levels. The chapels are quiet.
[[encounters]]
id = "long_carpet"
rect = [7, 11, 23, 26]
table = "tower_8f"

