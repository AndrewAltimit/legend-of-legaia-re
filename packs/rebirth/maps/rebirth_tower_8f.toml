# Tower of Rebirth, eighth floor: the Hollow Throne. The summit is laid out
# from scratch (`geometry = "none"`) out of the retail Zora's Floating
# Castle's (`taiku2`) stone, carpet and carved throne: the stair from below
# opens on a landing, a narthex runs the width of the tower, and a pillared
# nave climbs the long red carpet to the throne on its two-step dais at the
# far end. Off the nave's middle, two chapels: the Hall of Fallen Crowns to
# the west, its obelisks dark, and the Broken Gallery to the east, its outer
# wall gone and the wind coming through. No encounters on the landing: the
# long walk up the carpet is the build-up to the floor's only fight, the
# superboss in two waves (battle.toml, `hollow_throne`).
#
# The follow camera looks south from the north side, so every room's north
# edge (the side the camera stands on) is a low parapet and its south and
# side walls stand full height; the throne sits at the south end, ahead of
# the party all the way up the nave.

name = "Tower of Rebirth 8F - Hollow Throne"
size = [31, 36]
base = { scene = { kind = "scene", name = "taiku2" }, geometry = "none" }
# Sound-test track 52, "Ominous Presence".
bgm = { kind = "bgm", id = 52 }
camera = "far"
# Tier 0 is the hall floor, tier 1 the dais and the chapels, tier 2 the
# throne's own step. Tiers are corner heights, so each raised block's edge
# cells are its steps.
floor_heights = [0, 40, 80]

# Past the summit's edge, the castle stone falling away to the flagstones
# of the floors below.
[surround]
ground = { tpage = 24, clut = 31170, tile = 3 }
side = { tpage = 24, clut = 31168, tile = 0 }
depth = 512
shade = 56
# The tower's outer wall stands round the drop on every side but the
# camera's, so the view over the far walls ends on stone, fading into the
# dark, rather than on the clear colour.
backdrop = { tpage = 24, clut = 31168, tile = 0, height = 1152, distance = 2, shade = 96 }

# The vault overhead: the narthex lanterns hang on chains from it. The follow camera
# looks down from under it, so only the chains show, rising out of the
# frame; the underside is wound to face down and drawn only from beneath.
[ceiling]
height = 2048
cell = { tpage = 24, clut = 31168, tile = 0 }
shade = 40
chain = { tpage = 24, clut = 31168, tile = 0, width = 6, shade = 72, items = ["narthex_lantern_1", "narthex_lantern_2", "narthex_lantern_3", "narthex_lantern_4"] }

