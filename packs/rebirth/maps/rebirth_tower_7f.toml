# Tower of Rebirth, seventh floor: the Sanctum of Echoes. Laid out from
# scratch (`geometry = "none"`) out of the retail Sol Tower vault's
# (`korb3`) pale stone and blue steel: an octagonal ring corridor runs round
# a walled inner sanctum, where the Azure Seraph keeps the raised heart. The
# stair from below opens on a landing at the ring's north point, with a
# quiet rest alcove off it; four echo shrines stand in the ring's diagonal
# bays; the stair up leaves from the ring's south point.
#
# The follow camera looks south from the north side: the outer ring's north
# walls and the sanctum's north wall are low, so the camera sees into the
# rooms over them; the sanctum's south wall is half height, so the camera
# keeps the party in view walking the south arc behind it.

name = "Tower of Rebirth 7F - Sanctum of Echoes"
size = [33, 34]
base = { scene = { kind = "scene", name = "korb3" }, geometry = "none" }
# Sound-test track 11, "The Profane Realm".
bgm = { kind = "bgm", id = 11 }
camera = "far"
# Tier 0 is the ring, tier 1 the sanctum, tier 2 the heart.
floor_heights = [0, 32, 72]

# Past the ring's edge, cold steel far below, the outer wall dropping to it.
[surround]
ground = { tpage = 8, clut = 30976, tile = 39 }
side = { tpage = 8, clut = 30976, tile = 30 }
depth = 448
shade = 56
# The tower's outer wall stands round the drop on every side but the
# camera's, so the view over the far walls ends on stone, fading into the
# dark, rather than on the clear colour.
backdrop = { tpage = 8, clut = 30976, tile = 30, height = 1152, distance = 2, shade = 96 }

[tiles]
origin = [20, 20]
rows = [
