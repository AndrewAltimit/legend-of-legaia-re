"r" = { label = "rest alcove", ground = { kind = "texture", tpage = 8, clut = 30850, tile = 4 } }
# Echo shrines and the sanctum's obelisk bases: solid.
"s" = { label = "echo shrine", walls = "all", wall = { kind = "box", height = 40, tpage = 8, clut = 30849, tile = 42 } }
"o" = { label = "obelisk base", height = 1, walls = "all", ground = { kind = "texture", tpage = 8, clut = 30976, tile = 2 } }
