[tiles.legend]
# A wall takes the tier of the floor on its north or west side: tiers are
# corner heights, so a wall on another tier would tilt that floor's last
# row into it. Its box reaches on down to the lower floor beside it.
"#" = { label = "outer wall", walls = "all", wall = { kind = "box", height = 320, tpage = 8, clut = 30976, tile = 30 } }
"_" = { label = "outer parapet", walls = "all", wall = { kind = "box", height = 64, tpage = 8, clut = 30976, tile = 38 } }
"%" = { label = "outer wall (stair)", walls = "all", wall = { kind = "box", height = 320, tpage = 8, clut = 30976, tile = 30 } }
"i" = { label = "sanctum parapet", height = 1, walls = "all", wall = { kind = "box", height = 48, tpage = 8, clut = 30849, tile = 42 } }
