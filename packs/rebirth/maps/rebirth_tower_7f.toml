":" = { label = "sanctum floor", height = 1, ground = { kind = "texture", tpage = 8, clut = 30976, tile = 2 } }
"A" = { label = "the heart", height = 2, ground = { kind = "texture", tpage = 8, clut = 30849, tile = 18 } }
