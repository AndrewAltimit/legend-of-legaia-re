# Rebirth Isles: the arrival beach. Laid out from scratch over Rim Elm's
# (`town01`) grass, sand and water textures: dune grass under a cliff line
# to the north, a long white beach, the surf, and a ruined jetty running out
# into the sea. The sea stair from the tower's west wall lands on the stone
# platform at the west end; the dune path climbs north-east to the village.
# Palms and ferns are the West Voz Forest's (`vell`), the wreck, crates and
# driftwood Rim Elm's.

name = "Rebirth Isles - Saltwind Beach"
size = [64, 36]
base = { scene = { kind = "scene", name = "town01" }, geometry = "none" }
# Sound-test track 6, "Rim Elm" - the sea wind over the old village tune.
bgm = { kind = "bgm", id = 6 }
camera = "far"
# Tiers: sand, the dune shelf, the cliff top, the seabed, the outcrops.
# The terrain below smooths them into slopes and sculpts the rest.
floor_heights = [0, 24, 300, -70, 34]

[tiles]
