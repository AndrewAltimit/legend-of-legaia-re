# Rebirth Isles: the Thornwood. Laid out from scratch over the West Voz
# Forest (`vell`): a winding path east through a forest thick enough to wall
# it, past three clearings, to the island's old ruins - a walled court of
# fallen pillars (Rim Elm's stones) round the hive the Thornwood Queen has
# grown into the north gate. Past the gate a stair runs down to the grotto.

name = "Rebirth Isles - The Thornwood"
size = [88, 34]
base = { scene = { kind = "scene", name = "vell" }, geometry = "none" }
# Sound-test track 8, "Call of the Ruins".
bgm = { kind = "bgm", id = 8 }
camera = "far"
floor_heights = [0, 16, 32]

