# Rebirth Isles: the Thornwood. Laid out over the West Voz Forest (`vell`)
# as a walk with a shape: the lane leaves the village's fields at the wood's
# edge and winds east under clumped old growth - through Mushroom Hollow, a
# sunken glade ringed with toadstools; across a brook at a ford of
# stepping stones; up to the old shrine, a broken ring of standing stones
# round an inscribed tablet, with a spur climbing to a lookout; down to the
# hermit's camp, pitched round the log he sits on; and on to the island's
# ruined court, where the Thornwood Queen has grown her hive inside the
# north gate. Past the gate a stair runs down to the grotto. A side trail
# off the first bend drops to a fern dell with a spring.

name = "Rebirth Isles - The Thornwood"
size = [112, 56]
base = { scene = { kind = "scene", name = "vell" }, geometry = "none" }
# Sound-test track 8, "Call of the Ruins".
bgm = { kind = "bgm", id = 8 }
camera = "far"
floor_heights = [0, 16, 32]

