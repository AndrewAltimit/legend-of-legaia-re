[monsters.hollow_sovereign]
base = { kind = "monster", id = 138 }
name = "Hollow Sovereign"
hp = 44000
mp = 3000
attack = 780
defence = 260
speed = { mul = 1.4 }
intelligence = { mul = 1.6 }
exp = 65000
gold = 60000
drop = { item = { kind = "item", id = 237 }, chance_pct = 100 }

# The superboss's first form: three phases. At two thirds the shell calls
# a herald back; at one third it is unmade and telegraphs Grand Beam, its
# ultimate. It survives the first killing blow once. Dohati has three
# swings; 0x6A Astral Wave, 0x58 Cross Beam, 0x53 Curse All, 0x63 Grand Beam.
[monsters.hollow_sovereign.script]
immune = ["sleep", "confuse", "numb", "stone", "curse"]
last_stand = { line = "sovereign_last" }
enrage = { when = { round = 20 }, line = "sovereign_end", attack = { mul = 1.5 } }

[[monsters.hollow_sovereign.script.phases]]
moves = [
    { attack = 0, weight = 2 },
    { attack = 1, weight = 2 },
    { spell = 0x6A, weight = 1 },
]

[[monsters.hollow_sovereign.script.phases]]
when = { hp_below_pct = 66 }
line = "sovereign_hollow"
# The shell cracks and the music turns: "Apocalypse" (61).
music = { kind = "bgm", id = 61 }
attack = { mul = 1.2 }
summon = ["throne_herald"]
moves = [
    { attack = 2, hits = 2, weight = 2 },
    { spell = 0x58, weight = 2, target = "healer" },
    { spell = 0x53, weight = 1, cooldown = 3 },
]

[[monsters.hollow_sovereign.script.phases]]
when = { hp_below_pct = 33 }
line = "sovereign_unmade"
speed = { mul = 1.2 }
# The pack's own chime (assets/audio/chime.wav) rings as it is unmade, and
# again on every Grand Beam telegraph.
sound = { kind = "sound", id = "chime" }
moves = [
    { spell = 0x63, weight = 2, charge = true, ignore_mp = true, charge_line = "sovereign_ultimate", cooldown = 3, charge_sound = { kind = "sound", id = "chime" } },
    { attack = 0, hits = 3, weight = 2, target = "lowest_hp" },
    { spell = 0x58, weight = 1 },
]

[monsters.sovereign_unbound]
base = { kind = "monster", id = 179 }
name = "Sovereign Unbound"
hp = 44000
mp = 4000
attack = 850
defence = 280
speed = { mul = 1.3 }
intelligence = { mul = 1.5 }
exp = 65000
gold = 60000
drop = { item = { kind = "item", id = 236 }, chance_pct = 100 }

# What the Sovereign hid: Chaos Flare from the start, then below half a
# telegraphed Thunder Burst; a last stand of its own. Songi has five
# swings; 0x36 Chaos Flare, 0x74 Thunder Burst.
[monsters.sovereign_unbound.script]
immune = ["sleep", "confuse", "numb", "stone", "curse"]
last_stand = { line = "unbound_last" }

[[monsters.sovereign_unbound.script.phases]]
# The unbound form arrives to the Wild Arms battle theme (73).
music = { kind = "bgm", id = 73 }
moves = [
    { attack = 0, weight = 2 },
    { attack = 3, weight = 2 },
    { spell = 0x36, weight = 1, cooldown = 1 },
]

[[monsters.sovereign_unbound.script.phases]]
when = { hp_below_pct = 50 }
line = "unbound_break"
attack = { mul = 1.2 }
moves = [
    { spell = 0x74, weight = 2, charge = true, ignore_mp = true, charge_line = "unbound_charge", cooldown = 3 },
    { spell = 0x36, weight = 2, cooldown = 1 },
    { attack = 2, hits = 2, weight = 2 },
]

