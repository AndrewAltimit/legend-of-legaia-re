monsters = ["hollow_sovereign", "throne_herald", "throne_herald"]

[[formations.hollow_throne.waves]]
monsters = ["sovereign_unbound"]

# The throne's echo: a repeatable rematch of the second phase alone, with
# heralds feeding back in while it stands.
[formations.throne_echo]
label = "Echo of the Throne"
monsters = ["sovereign_unbound", "throne_herald"]

[[formations.throne_echo.waves]]
monsters = ["throne_herald"]
arrival = "refill"
count = 4
max_standing = 3

# --- Encounter overrides -----------------------------------------------------

# Jette's Fortress keeps its own fights and mixes the pack's in, so a party
# still finishing the story meets the tower's first breed there.
[[encounters]]
scene = "chitei2"
retail_weight = 3
formations = [
    { formation = "ogre_pack", weight = 2 },
    { formation = "forge_guard", weight = 1 },
]

# Each tower floor's encounter zones name one of these tables
# (`maps/rebirth_tower_<n>f.toml`, `[[encounters]] table = ...`).
[[encounters]]
scene = "tower_1f"
steps = [12, 24]
formations = [
    { formation = "ogre_pack", weight = 2 },
    { formation = "forge_guard", weight = 1 },
]

[[encounters]]
scene = "tower_1f_wings"
steps = [12, 24]
formations = [
    { formation = "hound_pack", weight = 3 },
    { formation = "ogre_pack", weight = 1 },
]

[[encounters]]
scene = "tower_2f"
steps = [14, 26]
formations = [
    { formation = "ember_court", weight = 3 },
    { formation = "hearth_guard", weight = 2 },
]

[[encounters]]
scene = "tower_3f"
steps = [14, 26]
formations = [
    { formation = "thorn_thicket", weight = 3 },
    { formation = "mire_bloom", weight = 3 },
    { formation = "gilded_herd", weight = 1 },
]

[[encounters]]
scene = "tower_4f"
steps = [14, 28]
formations = [
    { formation = "vault_wardens", weight = 3 },
    { formation = "fountain_court", weight = 2 },
]

[[encounters]]
