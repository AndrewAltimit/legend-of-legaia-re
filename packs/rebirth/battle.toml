# Legend of Legaia: Rebirth - battles.
#
# Every monster here is a retail monster with new numbers: `base` names the
# retail record (its 1-based monster-archive id), and the engine reads that
# monster's mesh, animation and attacks off the player's own disc. Stats are
# record values; a bare number sets one, `{ mul = x }` scales the base's.
# Format: docs/formats/expansion-pack-battle.md.
#
# Element ids: 0 earth, 1 water, 2 fire, 3 wind, 4 thunder, 5 light,
# 6 dark, 7 neutral.
#
# Stats are tuned for the floor's party level *before* the pack's enemy
# scaling (progression.toml: +1% per party level past 50, at most x1.5),
# and before the battle loader's own boost (a random encounter installs
# both defences x7/4, a boss formation ATK x5/4 and both defences x2).
# The README works the numbers through.

