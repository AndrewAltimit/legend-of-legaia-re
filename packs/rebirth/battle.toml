# --- Bosses ------------------------------------------------------------------

# Sound-test cues: 28 "Attack!" (boss theme 1), 32 "Apostles of the Mist"
# (boss theme 2), 31 "Cort's War", 29 "The Cold Koru", 61 "Apocalypse",
# 73 the Wild Arms battle theme. The Hollow Sovereign opens on 32 and its
# script's phases change the music as it falls (audio.toml, the format page
# docs/formats/expansion-pack-audio.md).

