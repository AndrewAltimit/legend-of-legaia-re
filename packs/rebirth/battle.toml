# The Thornwood's mini-boss: the hive queen grown into the ruins' gate.
# Queen Bee keeps her own swings; 0x13 is the base's sting spell row.
[monsters.isles_hive_queen]
base = { kind = "monster", id = 63 }
name = "Thornwood Queen"
hp = 18000
mp = 900
attack = 400
defence = 210
speed = { mul = 1.2 }
exp = 22000
gold = 15000
element = 3

[monsters.isles_hive_queen.script]
immune = ["sleep", "confuse"]

[[monsters.isles_hive_queen.script.phases]]
moves = [
    { attack = 0, weight = 3 },
    { attack = 1, weight = 2 },
]

[[monsters.isles_hive_queen.script.phases]]
when = { hp_below_pct = 50 }
line = "isles_queen_rage"
attack = { mul = 1.2 }
speed = { mul = 1.2 }
moves = [
    { attack = 1, hits = 2, weight = 3, target = "lowest_hp" },
    { attack = 0, weight = 1 },
]

[formations.isles_shore]
label = "Shoreline"
monsters = ["isles_spikefish", "isles_gel_frog", "isles_spikefish"]

[formations.isles_squall]
label = "Squall Gulls"
monsters = ["isles_gull", "isles_gull", "isles_gel_frog"]

[formations.isles_thicket]
label = "Thornwood Thicket"
monsters = ["isles_mushrin", "isles_mantis", "isles_mushrin"]

[formations.isles_pack]
label = "Thornwood Pack"
monsters = ["isles_wolf", "isles_wolf", "isles_bee"]

[formations.isles_ruin_swarm]
label = "Ruin Swarm"
monsters = ["isles_bee", "isles_bee", "isles_mantis", "isles_bee"]

[formations.isles_grotto]
label = "Grotto Ooze"
monsters = ["isles_slime", "isles_nighto", "isles_slime"]

[formations.isles_pearl]
label = "Pearl Wisps"
monsters = ["isles_nighto", "isles_nighto", "isles_nighto"]

[formations.isles_queen]
label = "Thornwood Queen"
monsters = ["isles_hive_queen", "isles_bee", "isles_bee"]

[[encounters]]
scene = "isles_beach"
steps = [16, 30]
