# --- Formations: gauntlets (waves) -------------------------------------------

# The first floor's training gauntlet: two ogres, then three lizards
# together, then six more arriving one at a time, three at most at once.
[formations.tower_gauntlet]
label = "Tower Gauntlet"
monsters = ["ironhide_ogre", "ironhide_ogre"]

[[formations.tower_gauntlet.waves]]
monsters = ["ember_lizard", "ember_lizard", "ember_lizard"]

[[formations.tower_gauntlet.waves]]
monsters = ["runed_golem", "ironhide_ogre"]
arrival = "refill"
count = 6
max_standing = 3

# 3F: four full waves of the garden, the last one the gilded herd.
[formations.garden_gauntlet]
label = "Garden Gauntlet"
monsters = ["thorn_mantis", "thorn_mantis", "thorn_mantis"]

[[formations.garden_gauntlet.waves]]
monsters = ["mire_slime", "mire_slime", "bloom_mushura", "bloom_mushura"]

[[formations.garden_gauntlet.waves]]
monsters = ["thorn_mantis", "bloom_mushura", "mire_slime", "thorn_mantis"]

[[formations.garden_gauntlet.waves]]
monsters = ["gilded_bison", "gilded_bison", "gilded_bison"]

# 6F: the engine never stops. One opening line, then twelve arrivals
# feeding every free seat, four standing at once.
[formations.engine_gauntlet]
label = "Engine Gauntlet"
monsters = ["brass_sentinel", "brass_sentinel", "brass_sentinel"]

[[formations.engine_gauntlet.waves]]
monsters = ["furnace_mask", "storm_barra", "echo_lamia", "brass_sentinel"]
arrival = "refill"
count = 12
max_standing = 4

