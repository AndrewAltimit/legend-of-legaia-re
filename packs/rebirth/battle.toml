# --- The Rebirth Isles (party level 35-45) -----------------------------------
#
# An outdoor region past the tower's sea gate (maps/isles_*.toml): a beach,
# a fishing village, the Thornwood and its ruins, and a grotto under the
# cliffs. Beach and grotto beasts are water-aligned, the Thornwood's are
# earth and wind. The Thornwood's mini-boss guards the ruins' gate.

[monsters.isles_spikefish]
base = { kind = "monster", id = 70 }
name = "Tide Spikefish"
hp = 3200
attack = 300
defence = 150
speed = { mul = 1.2 }
exp = 3900
gold = 2400
element = 1

