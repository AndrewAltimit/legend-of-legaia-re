# Legend of Legaia: Rebirth - quests and challenges.
#
# The main chain climbs the Tower of Rebirth floor by floor; side quests
# hang off the floors' NPCs. Dialogue is kept for what the player asks for
# and for story beats: a quest that starts or completes on its own (an
# auto-started quest, a count or a floor reached in the field) says nothing,
# and its quest toast and Journal entry carry it. A side quest an NPC hands
# out starts on its toast too, so one talk is never a queue of boxes. Every
# NPC here is a talk zone on a pack map
# (`[[triggers]] event = { kind = "talk", npc = ... }`), so "talking to"
# the Warden's Stone or the 2F brazier is stepping up to it. Pack flags
# and counters are the pack's own and never touch a retail story flag.
# Format: docs/formats/expansion-pack-quests.md.
#
# NPC ids and where they stand:
#   tower_guide    1F  the Warden's Stone, at the foot of the dais
#   ember_brazier  2F  the brazier between the middle pillars
#   vault_heart    4F  the sunken court
#   rest_keeper    5F  the keeper's counter
#   regent_seat    6F  the upper alcove
#   sanctum_echo   7F  the inner hall
#   hollow_throne  8F  the throne

# --- The main chain ----------------------------------------------------------

[[quests]]
id = "tower_rumour"
title = "A Tower Wakes"
description = "Since the Mist lifted, travellers speak of a tower that was never there before. Something inside it is waiting to be heard."
auto_start = true
prerequisites = { min_level = 30 }
objectives = [
    { kind = "talk", npc = "tower_guide", text = "Find the voice in the tower's first hall" },
]
complete_dialog = "guide_intro"
rewards = { set_flags = ["tower_heard"] }

[[quests]]
id = "tower_trial"
title = "The Warden's Trial"
description = "Warden Ysolde will lift the tower's seal for a party that proves itself in battle and grows strong enough to survive the climb. The sea gate in the Atrium's west wall leads to the Rebirth Isles, a gentler place to grow."
giver = "tower_guide"
prerequisites = { quests = ["tower_rumour"] }
start_dialog = "guide_trial"
active_dialog = "guide_trial_active"
objectives = [
    { kind = "win_battles", count = 3, text = "Win three battles" },
    { kind = "reach_level", level = 40, text = "Reach level 40" },
    { kind = "talk", npc = "tower_guide", text = "Return to the Warden's Stone" },
]
complete_dialog = "guide_done"
rewards = { gold = 10000, items = [{ item = 121, count = 5 }], set_flags = ["tower_open"] }

[[quests]]
id = "ember_stair"
title = "The Ember Stair"
description = "On the second floor a shape of ash tends a fire that has burned since the Mist came. Put it out."
giver = "ember_brazier"
prerequisites = { quests = ["tower_trial"], min_level = 50 }
start_dialog = "ember_offer"
active_dialog = "ember_offer"
objectives = [
    { kind = "win_boss", boss = "cinder_warden", text = "Defeat the Cinder Warden" },
]
rewards = { xp = 20000, cards = ["ember-scale"], counters = [{ counter = "bosses_felled" }] }

[[quests]]
id = "hanging_garden"
title = "The Hanging Garden"
description = "The third floor's sundial counts out a trial of four waves. Outlast the garden."
auto_start = true
prerequisites = { quests = ["ember_stair"] }
objectives = [
    { kind = "defeat_formation", formation = "garden_gauntlet", text = "Clear the Garden Gauntlet" },
]
rewards = { gold = 25000, items = [{ item = 252, count = 1 }] }

[[quests]]
id = "verdant_vault"
title = "The Verdant Vault"
description = "Something vast is asleep in the fourth floor's sunken court, and the moss over it is breathing."
giver = "vault_heart"
prerequisites = { quests = ["hanging_garden"], min_level = 60 }
start_dialog = "vault_offer"
active_dialog = "vault_offer"
objectives = [
    { kind = "win_boss", boss = "verdant_colossus", text = "Defeat the Verdant Colossus" },
]
rewards = { xp = 30000, cards = ["ironhide-brute"], counters = [{ counter = "bosses_felled" }] }

[[quests]]
id = "gamblers_rest"
title = "The Gambler's Rest"
description = "Halfway up the tower, a hall where nothing hunts. Its keeper still runs the tables."
auto_start = true
prerequisites = { quests = ["verdant_vault"] }
objectives = [
    { kind = "enter_scene", scene = "rebirth_tower_5f", text = "Reach the fifth floor" },
    { kind = "talk", npc = "rest_keeper", text = "Talk to the keeper" },
]
complete_dialog = "keeper_welcome"
rewards = { set_flags = ["rest_open"] }

[[quests]]
id = "engine_deep"
title = "The Engine Deep"
description = "The sixth floor's machines still run for their master. Stop the engine and the one who drives it."
giver = "regent_seat"
prerequisites = { quests = ["gamblers_rest"], min_level = 70 }
# The offer is the alcove's own trigger (maps/rebirth_tower_6f.toml), gated
# on the Regent still standing, so a won fight is not offered again while
# the gauntlet remains.
ordered = false
objectives = [
    { kind = "defeat_formation", formation = "engine_gauntlet", text = "Outlast the Engine Gauntlet" },
    { kind = "win_boss", boss = "iron_regent", text = "Defeat the Iron Regent" },
]
rewards = { xp = 40000, cards = ["rune-sentinel"], counters = [{ counter = "bosses_felled" }] }

[[quests]]
id = "sanctum_echoes"
title = "The Sanctum of Echoes"
description = "Every prayer the Mist drowned is still whispering on the seventh floor. One voice speaks over all of them."
giver = "sanctum_echo"
prerequisites = { quests = ["engine_deep"], min_level = 80 }
start_dialog = "seraph_offer"
active_dialog = "seraph_offer"
objectives = [
    { kind = "win_boss", boss = "azure_seraph", text = "Silence the Azure Seraph" },
]
rewards = { xp = 50000, cards = ["radiant-warden"], counters = [{ counter = "bosses_felled" }] }

[[quests]]
id = "tower_sovereign"
title = "The Hollow Throne"
description = "Something hollow sits on the throne at the top of the tower, made of everything the Mist took."
giver = "hollow_throne"
prerequisites = { quests = ["sanctum_echoes"], min_level = 88 }
start_dialog = "guide_sovereign"
active_dialog = "guide_sovereign"
objectives = [
    { kind = "win_boss", boss = "hollow_sovereign", text = "Defeat the Hollow Sovereign" },
]
# The ending plays as a cutscene once the party is back on the floor
# (`cutscenes.toml` `sovereign_falls`); Ysolde's closing words are in it.
complete_cutscene = "sovereign_falls"
rewards = { cards = ["hollow-sovereign"], set_flags = ["sovereign_fallen"], counters = [{ counter = "bosses_felled" }] }

[[quests]]
id = "rebirth"
title = "Rebirth"
description = "The throne is empty. Warden Ysolde asks one last thing: reach the peak of your own strength."
auto_start = true
# After the ending cutscene, not under it.
prerequisites = { quests = ["tower_sovereign"], flags = ["throne_broken"] }
objectives = [
    { kind = "reach_level", level = 99, text = "Reach level 99" },
    { kind = "counter", counter = "bosses_felled", at_least = 5, text = "Fell the tower's five keepers" },
    { kind = "talk", npc = "tower_guide", text = "Return to the Warden's Stone" },
]
complete_dialog = "guide_rebirth_done"
rewards = { gold = 99999, set_flags = ["reborn"] }

[[quests]]
id = "first_breath"
title = "The First Breath"
description = "Ysolde's seal was never on the stair. Under the Warden's Stone lies the first breath the Mist ever drew, and she has held it down alone since before the Mist came."
giver = "tower_guide"
prerequisites = { quests = ["rebirth"], flags = ["reborn"] }
start_dialog = "breath_offer"
active_dialog = "breath_offer"
objectives = [
    { kind = "win_boss", boss = "first_breath", text = "Release the First Breath" },
]
complete_dialog = "breath_done"
rewards = { cards = ["heart-of-the-mist"], set_flags = ["breath_released"], counters = [{ counter = "bosses_felled" }] }

