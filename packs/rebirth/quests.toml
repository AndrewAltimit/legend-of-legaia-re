formation = "throne_echo"
rules = { turn_limit = 15, enemy_scale_permille = 1500 }
score = { base = 10000, turn_bonus = 500 }
rewards = { gold = 100000, items = [{ item = 235, count = 1 }], counters = [{ counter = "challenges_cleared" }] }
