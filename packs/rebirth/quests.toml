giver = "tower_guide"
prerequisites = { quests = ["tower_trial"] }
start_dialog = "remedy_start"
objectives = [
    { kind = "collect_item", item = 123, count = 5, hand_in = true, text = "Gather five Healing Fruit" },
    { kind = "talk", npc = "tower_guide", text = "Bring them to the Warden's Stone" },
]
complete_dialog = "remedy_done"
rewards = { items = [{ item = 248, count = 1 }, { item = 249, count = 1 }] }

[[quests]]
id = "gilded_hunt"
title = "The Gilded Herd"
description = "The Hanging Garden's golden bison are worth a fortune each. Bring down three herds."
auto_start = true
prerequisites = { quests = ["ember_stair"] }
objectives = [
    { kind = "defeat_formation", formation = "gilded_herd", count = 3, text = "Defeat three Gilded Herds" },
]
rewards = { gold = 30000, items = [{ item = 156, count = 1 }] }

[[quests]]
id = "sentinel_hunt"
title = "Bounty: Brass Sentinels"
description = "Break the Brass Sentinels marching out of the Engine Deep."
giver = "regent_seat"
prerequisites = { quests = ["engine_deep"] }
start_dialog = "sentinel_hunt_start"
objectives = [
    { kind = "defeat_monster", monster = 129, count = 12, text = "Scrap twelve Brass Sentinels" },
]
complete_dialog = "sentinel_hunt_done"
rewards = { gold = 40000, items = [{ item = 131, count = 2 }], counters = [{ counter = "bounties" }] }
repeat = { repeatable = true, cooldown_seconds = 3600 }

[[quests]]
id = "throne_echo_hunt"
title = "Echo of the Throne"
description = "An echo of the Sovereign keeps re-forming on the empty throne. Break it again, as often as it returns."
giver = "hollow_throne"
prerequisites = { quests = ["tower_sovereign"] }
start_dialog = "echo_offer"
active_dialog = "echo_offer"
objectives = [
    { kind = "win_boss", boss = "throne_echo", text = "Break the Echo of the Throne" },
]
rewards = { xp = 30000, counters = [{ counter = "echoes_broken" }] }
