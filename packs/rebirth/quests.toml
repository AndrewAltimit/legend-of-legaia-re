objectives = [
    { kind = "win_mode", mode = "tower-high-table", text = "Win at the Tower High Table" },
    { kind = "win_mode", mode = "wardens-duel", text = "Win the Warden's Duel" },
    { kind = "win_mode", mode = "rebirth-links", text = "Win the Rebirth Links" },
    { kind = "win_mode", mode = "spiral-circuit", text = "Win the Spiral Circuit" },
    { kind = "win_mode", mode = "old-vault", text = "Win hide and seek in the Old Vault" },
]
complete_dialog = "keeper_done"
rewards = { gold = 30000, cards = ["thunder-roc", "frost-maw"], set_flags = ["tables_beaten"] }

[[quests]]
id = "high_roller"
title = "High Roller"
description = "Win the Tower High Table three times."
auto_start = true
prerequisites = { quests = ["gamblers_rest"] }
objectives = [
    { kind = "win_mode", mode = "tower-high-table", count = 3, text = "Win the High Table three times" },
]
rewards = { cards = ["veil-phantom"] }

[[quests]]
id = "trial_master"
title = "Trial Master"
description = "Clear three of the tower's challenges."
auto_start = true
prerequisites = { flags = ["tower_open"] }
objectives = [
    { kind = "counter", counter = "challenges_cleared", at_least = 3, text = "Clear three challenges" },
]
rewards = { gold = 50000, cards = ["ruin-titan"] }

# --- Challenges --------------------------------------------------------------

[[challenges]]
id = "bare_hands"
title = "Bare Hands"
description = "Win your next battle in ten rounds or fewer, with no items and no Ra-Seru magic."
rules = { turn_limit = 10, no_items = true, no_magic = true }
score = { base = 1000, turn_bonus = 100 }
rewards = { gold = 2000, counters = [{ counter = "challenges_cleared" }] }

[[challenges]]
id = "garden_sprint"
title = "Garden Sprint"
description = "Clear the Garden Gauntlet - all four waves - in twelve rounds or fewer."
formation = "garden_gauntlet"
rules = { turn_limit = 12 }
score = { base = 3000, turn_bonus = 250 }
rewards = { gold = 20000, counters = [{ counter = "challenges_cleared" }] }

[[challenges]]
id = "lone_fist"
title = "Lone Fist"
description = "Vahn alone against the Engine Gauntlet. No items."
formation = "engine_gauntlet"
rules = { solo = 0, no_items = true }
score = { base = 5000 }
rewards = { gold = 40000, items = [{ item = 232, count = 1 }], counters = [{ counter = "challenges_cleared" }] }

[[challenges]]
id = "humble_seraph"
title = "Humble Before the Seraph"
description = "Silence the Azure Seraph with nobody above level 85."
formation = "sanctum_seraph"
rules = { level_cap = 85 }
score = { base = 8000, level_bonus = 500 }
rewards = { gold = 60000, counters = [{ counter = "challenges_cleared" }] }

[[challenges]]
id = "echo_storm"
title = "Echo Storm"
description = "Break the Echo of the Throne at one and a half times its strength, within fifteen rounds."
formation = "throne_echo"
rules = { turn_limit = 15, enemy_scale_permille = 1500 }
score = { base = 10000, turn_bonus = 500 }
rewards = { gold = 100000, items = [{ item = 235, count = 1 }], counters = [{ counter = "challenges_cleared" }] }

# --- The Rebirth Isles -------------------------------------------------------
#
# Past the tower's sea gate (1F west wall) lies the region the Mist hid
# longest. It opens as soon as the party has heard Ysolde (`tower_rumour`),
# and it is where a level-30 party grows into the Warden's Trial. NPC ids and where they stand:
#   isles_ferrywoman  isles_beach    by the sea gate's landing
#   isles_elder       isles_village  the elder's porch
#   isles_fisher      isles_village  the jetty
#   isles_hermit      isles_thornwood  the ruins at the path's end
#   isles_pearl       isles_grotto   the pool at the grotto's heart

[[quests]]
id = "isles_landfall"
title = "Landfall"
description = "A ferry nobody remembers rowing has left the party on an island beach. The ferrywoman says the village up the dunes has not seen a stranger in an age."
giver = "isles_ferrywoman"
prerequisites = { quests = ["tower_rumour"] }
start_dialog = "isles_ferry_hello"
active_dialog = "isles_ferry_active"
objectives = [
    { kind = "enter_scene", scene = "isles_village", text = "Climb the dunes to the village" },
    { kind = "talk", npc = "isles_elder", text = "Speak with the village elder" },
]
complete_dialog = "isles_elder_hello"
rewards = { gold = 5000, set_flags = ["isles_welcome"] }

[[quests]]
id = "isles_nets"
title = "Torn Nets"
description = "Something in the shallows shreds the fishers' nets every night. Clear the shore of the beasts that wade in from the reef."
giver = "isles_fisher"
prerequisites = { flags = ["isles_welcome"] }
start_dialog = "isles_fisher_offer"
active_dialog = "isles_fisher_active"
objectives = [
    { kind = "defeat_formation", formation = "isles_shore", count = 3, text = "Rout the shoreline beasts three times" },
    { kind = "talk", npc = "isles_fisher", text = "Tell the fisher on the jetty" },
]
complete_dialog = "isles_fisher_done"
rewards = { gold = 8000, items = [{ item = 121, count = 3 }] }

[[quests]]
id = "isles_thornwood"
title = "The Thornwood Queen"
description = "The path inland is choked with thorn and wasps. The hermit camped below the ruins says the hive's queen has grown into the old gate itself."
giver = "isles_elder"
prerequisites = { quests = ["isles_landfall"], min_level = 35 }
start_dialog = "isles_elder_thorns"
active_dialog = "isles_elder_thorns_active"
objectives = [
    { kind = "enter_scene", scene = "isles_thornwood", text = "Follow the Thornwood path to the ruins" },
    { kind = "win_boss", boss = "isles_hive_queen", text = "Defeat the Thornwood Queen" },
    { kind = "talk", npc = "isles_hermit", text = "Tell the hermit at his camp by the fire" },
]
complete_dialog = "isles_hermit_done"
rewards = { gold = 15000, set_flags = ["isles_gate_open"] }

[[quests]]
id = "isles_pearl"
title = "The Pearl Below"
description = "Under the ruins a stair runs down to a grotto where the sea still sings. Something there remembers the islands before the Mist."
giver = "isles_hermit"
prerequisites = { flags = ["isles_gate_open"] }
# The Thornwood's closing words lead straight on; the stair's directions
# wait for a second talk.
active_dialog = "isles_hermit_grotto"
objectives = [
    { kind = "enter_scene", scene = "isles_grotto", text = "Descend into the grotto" },
    { kind = "talk", npc = "isles_pearl", text = "Find what sings in the grotto" },
]
complete_dialog = "isles_pearl_done"
rewards = { gold = 20000, items = [{ item = 125, count = 2 }], set_flags = ["isles_pearl_heard"] }
