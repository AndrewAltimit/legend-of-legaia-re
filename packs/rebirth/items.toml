# Legend of Legaia: Rebirth - the tower's gear.
#
# Retail's best gear is the Ra-Seru set the story hands out near the end,
# and nothing past it is worth chasing between level 60 and 99. These items
# sit one step above it. Every number below is set against the retail
# equipment stat table (`DAT_80074F68`, docs/formats/equipment-table.md):
#
#   Weapons   Ra-Seru Blade 98 (Vahn), Ra-Seru Fangs 96 (Noa),
#             Ra-Seru Club 100 (Gala); shop best Chaos Breaker 72,
#             Golden Claw 86, Great Axe 88.
#   Armour    Ra-Seru Armor 83/82, Ra-Seru Robe 84/78, Ra-Seru Plate 75/84
#             (UDF/LDF); shop best Triumph Armor 70/69 (50,000 G).
#   Head      Ra-Seru Seal / Plume / Helmet: UDF 62-64, INT 60-64.
#   Feet      Ra-Seru Boots / Shoes / Thongs: ATK 86-90, LDF 60-64, SPD 28-32.
#
# The Warden tier (sold from the start of the climb) lands between the shop
# best and the Ra-Seru set; the Rebirth set beats Ra-Seru by about 12-15%
# a piece and adds set bonuses for wearing it together. A weapon swings at
# half its ATK per hit (the retail per-slot fold), so +14 weapon ATK is +7
# damage before defence - meaningful, not a one-shot.
#
# Accessories combine two retail passives each (the 64-slot passive index
# space, docs/formats/accessory-passive-table.md) at the price of the pair.

# --- Consumables -------------------------------------------------------------

[items.tower_draught]
name = "Tower Draught"
description = "Recover 2500 HP. Ally."
kind = "consumable"
icon = { kind = "item", id = 0x78 }
# Healing Flower: 800 HP for 400 G. Healing Berry: full HP for 3000 G.
price = 1200
effect = { kind = "heal_hp", amount = 2500 }

[items.mist_tonic]
name = "Mist Tonic"
description = "Recover 300 MP. Ally."
kind = "consumable"
icon = { kind = "item", id = 0x7D }
# Magic Fruit: 200 MP for 5000 G.
price = 7000
effect = { kind = "heal_mp", amount = 300 }

[items.phoenix_plume]
name = "Phoenix Plume"
description = "Revive every fallen|ally at half HP."
kind = "consumable"
icon = { kind = "item", id = 0x80 }
# Phoenix revives one ally for 1600 G.
price = 12000
effect = { kind = "revive", percent = 50 }
all_party = true

[items.sovereign_nectar]
name = "Sovereign Nectar"
description = "Recover max HP.|All allies."
kind = "consumable"
icon = { kind = "item", id = 0x7B }
# Healing Fruit: 800 HP to every ally for 2400 G.
price = 15000
effect = { kind = "heal_hp", full = true }
all_party = true

