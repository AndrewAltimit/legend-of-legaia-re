[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"

[workspace.dependencies]
# Every member takes its dependencies from this table (`foo.workspace = true`),
# so one version and one feature set is pinned per crate.
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
cpal = "0.18"
dirs = "7"
# The desktop GUI toolkit for legaia-explorer. Glow (OpenGL) backend only:
# Explorer draws nothing but egui's own meshes (its model view is a CPU
# rasteriser), so it links no wgpu at all. eframe 0.36's wgpu backend would
# be the workspace's wgpu 30, but glow keeps wgpu out of Explorer's build.
# Its winit is the workspace's 0.30.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
encoding_rs = "0.8"
env_logger = "0.11"
flate2 = "1"
gilrs = "0.11"
glam = { version = "0.34", features = ["bytemuck"] }
js-sys = "0.3"
libc = "0.2"
log = "0.4"
png = "0.18"
pollster = "0.4"
rayon = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The maintained fork of serde_yaml 0.9 (same libyaml parser, same API):
# serde_yaml itself is archived and its unsafe-libyaml backend is
# unmaintained (RUSTSEC-2024-0449).
serde_norway = "0.9"
sha2 = "0.11"
tempfile = "3"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
# The naga version wgpu 30 resolves to; named directly only by the
# shading-law parity test, which also needs its GLSL front end.
naga = { version = "30.0.1", default-features = false }
wgpu = "30"
winit = "0.30"

# Workspace crates. Those carrying a command-line binary are listed with
# default features off: their default `cli` feature exists only for their own
# binary, and a library dependent never needs it.
legaia-bytes = { path = "crates/bytes" }
legaia-app-theme = { path = "crates/app-theme" }
legaia-anm = { path = "crates/anm", default-features = false }
legaia-art = { path = "crates/art", default-features = false }
