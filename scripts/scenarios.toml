slot = 1
label = "party_battle_gobu_gobu"
backup_fingerprint = "a0c56d29eeeffd96aa809040bb807606545da792209b421274b9bea27c35e7f2"
description = "Mid-battle with Vahn/Noa/Gala active party vs one Gobu Gobu (game_mode 0x15 BattleMode, command menu open); all three battle-form character TMDs resident in DAT_8007C018[0..=2]"
