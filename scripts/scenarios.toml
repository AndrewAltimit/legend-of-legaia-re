#
# Vahn standing in Rim Elm (`town01`) in front of his house, free
# movement, BEFORE talking to Tetsu and before the tutorial training
# battle. Game mode 0x03 - this empirically confirms that 0x03 is the
# field/town gameplay mode (corroborating the runtime pin on `map03`
# mode 0x03 in docs/subsystems/field-locomotion.md), NOT the "options
