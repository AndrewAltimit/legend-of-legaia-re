reason = "Steps the page's play_frame_ticks export runs inside its tick order (BootSession::claim_tick hands each tick to the pause menu, a shop, the name entry, the prologue skip or the game-over hold); the standalone exports are the oracles' single-step handles."
names = [
    "game_over_input",
    "name_entry_input",
    "play_menu_open_row",
    "play_menu_settle",
    "play_menu_take_load_scene",
    "play_shop_after_tick",
    "play_shop_input",
    "play_take_prologue_handoff",
    "play_tick_overlay_sfx",
    "play_fishing_stop",
]

