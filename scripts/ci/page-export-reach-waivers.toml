# Waivers for scripts/ci/check-page-export-reach.py: LegaiaRuntime exports
# no site source names, each with the kind of reason it has. A row may name
# exports by glob. A row that matches nothing, or matches an export the page
# now names, fails the gate - delete it.
#
# Kinds: probe, tick-internal, driver, superseded, both-absent (meanings in
# the script's KINDS table and docs/tooling/host-drift.md#page-export-reach).

