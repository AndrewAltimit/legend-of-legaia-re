[[arm]]
entry = "0x8004AD80"
range = "0x8004B118..0x8004B118"
verdict = "unreachable"
reason = "The death arm's Jette count loop skip: it runs with the victim's +0x14C at zero (0x8004B0BC), so the bound is `0 < ctx[+1]`, and ctx[+1] counts the formation's monsters, the dying one among them; a death with ctx[+1] == 0 is never reached."

