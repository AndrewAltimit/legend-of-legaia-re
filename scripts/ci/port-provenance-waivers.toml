# Reviewed findings from scripts/ci/check-port-provenance.py.
#
# A waiver says "I read this one against the disassembly and it is not a
# provenance defect". It is not a snooze button: `reason` has to say what was
# read and what it showed, because the next reader's only alternative is to
# re-derive it.
#
# Keys are the finding keys the checker prints with `--emit-waivers`.
#
# What a waiver may NOT say: "probably fine", "pre-existing", or anything that
# would be equally true of a real defect. Those are unreviewed rows, and an
# unreviewed row belongs in the report where it can still be seen.
#
# One whole class used to live here and no longer does: a row citing its
# routine's CALLER - the `jal` site, the `beq` ladder above a join label, the
# switch table an arm hangs off. Nineteen of those had a waiver each, all saying
# the same thing, because a callee's dump structurally cannot carry an address
# in its caller's body. The checker now reads the extracted images and decodes
# the word at the cited address instead (`site_relation`), so those rows pass on
# the bytes. Do not re-add a waiver of that shape: if it is really a caller site
# the test will say so, and if the test does not say so, the citation is worth
# looking at.
#
# A waiver that matches no current finding is reported by every run. Delete it
# rather than carry it - it excuses something that no longer exists.

