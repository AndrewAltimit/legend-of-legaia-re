# Waivers for scripts/ci/check-ui-host-drift.py.
#
# Each entry records a shared `engine-ui` draw builder that one host reaches
# and the other does not, plus WHY that is acceptable today. "Reaches" is
# transitive: a host that draws a builder draws whatever that builder composes,
# so "no host names this function" is not by itself a reason to waive - check
# whether a drawn builder folds it in first. The checker validates every waiver
# against the real source, in both directions:
#
#   * a builder that no longer exists          -> stale waiver, CI fails
#   * a builder now wired on both hosts        -> stale waiver, CI fails
#   * a `web_missing` waiver whose builder is
#     no longer native-only                    -> wrong bucket, CI fails
#   * an empty `reason`                        -> CI fails
#
# So this file cannot quietly become fiction: it only passes while it
# describes the actual state of the two hosts. Closing a gap means deleting
# the waiver, and CI tells you when you forgot.
#
# `kind` is one of:
#   "web_missing" - native calls it, the browser play page does not
#   "orphan"      - neither host calls it

# `battle_hud_draws_for` / `encounter_banner_draws_for` were waived here as
# "undone work" - the browser page had no battle host to draw into. The
# battle host is done: `web-viewer/src/play_battle.rs` arms the live gameplay
# loop on `enter_field` (`arm_live_battles`, the browser twin of
# `BootSession::enter_field_live`), `tick_battle_presentation` folds battle
# events + refreshes the HUD through the shared
# `engine_core::battle_hud::sync_battle_hud_rows`, and
# `play_overlay_draws_json` composites the HUD rows, the ENCOUNTER! banner
# and the player-driven command menus over the running scene. Both builders
# now paint on both hosts.

# `dialog_box_draws_for` / `dialog_panel_draws_for` were waived here as
# orphans whose "honest resolution is deletion". They are deleted: no host
# rendered dialog through them (both hosts draw the `DialogSnapshot` path at
# the byte-pinned retail geometry), and their only references were unit tests
# in `engine-render/src/tests/`. The `DialogBoxLayout` / `DialogGlyphView` /
# `dialog_clut_color` support types went with them.

# `game_over_draws_for` was waived here as unreachable on both hosts,
# because retail's party-wipe destination is unpinned and this panel's
# Continue / Retry / Quit rows are an engine invention. The waiver is
# removed: both hosts now construct the panel off `World::game_over`
# (native `BootUiState::GameOver` from the redraw loop, the browser from
# `post_battle_overlay_draws`), which is a presentation the port owns. The
# retail question the waiver raised is still open and still recorded in
# `docs/subsystems/battle.md` - what changed is that a wiped party is no
# longer a silent no-op that hands the player back a full-HP field.

[[waiver]]
builder = "key_rebind_draws_for"
kind = "orphan"
reason = """
Unreached on BOTH hosts. This waiver used to open by calling the browser
"web-exempt by design", on the premise that "the browser page's bindings are
JS keycode tables owned by the page, not the engine - `PAD` in
`site/js/play-app.js` ... and `BOOT_PAD` in `site/_content/play.html`". That
premise is gone, and its being true was itself the bug: three hand-maintained
tables drifted key-for-key (`X` was Square natively and Circle in both page
tables, `S` was Circle natively and Down on the page, and Select / L1 / R1 /
L2 / R2 were bound on neither page). Both pages now READ the engine's own
table through `legaia_web_viewer::pad_bindings::pad_bindings_json`, so the
bindings are engine-owned on every host and there is no page-side layout left
to exempt.

What still blocks the screen is the half that was always true: a **menu
route**. The options screen both hosts draw (`options_draws_for`) has no row
that opens a sub-screen, and `engine-core`'s `OptionsSession` carries no
binding-edit state for one to drive. `engine-core::key_rebind::KeyRebindSession`
is complete - rows in canonical order, await-key state, eviction so two keys
cannot report one button - and its only caller is
`engine-core/tests/menu_suite_e2e.rs`. Native rebinding today happens through
`legaia-input.toml` and `legaia-engine config set --binding`; the browser has
no equivalent yet, but persistence is no longer the obstacle it was claimed to
be (the page already persists saves).

Closing it means growing that options row and that session state on both
hosts, plus a wasm binding for `KeyRebindSession` - not adding a draw call.
"""

# `sprite_draws_for` used to be waived here as "a generic anchor-translate
# helper ... not a screen". That prose was the right reading and the wrong
# instrument: a waiver says "this gap is acceptable", and there was no gap -
# the function was never a screen to begin with. The checker now classifies on
# the whole signature rather than the return type alone (draw records IN means
# a transform over a draw list, not a projection of a model), so the surface
# no longer contains it and there is nothing left to waive.

# `records_screen_draws_for` / `dev_menu_list_draws_for` were waived here as
# `web_missing`, blocked on a "process-scoped opt-in" - the native window
# mounts the developer-menu surface behind `LEGAIA_DEV_MENU`, an environment
# variable "set by whoever launches the binary", and the waiver held that a
# public web page has no such person. That premise mistook who runs a
# client-side page: the visitor IS the person running the program - the game
# is single-player, the disc never leaves the tab, and everything the menu
# edits is the visitor's own session (the same site already ships a
# client-side ROM patcher). What the env var actually provides is "an
# explicit, deliberate act by the person at the keyboard that a link cannot
# carry", and the browser twin of that exists: the play page's Dev-menu
# checkbox, which starts unchecked on every load, is never persisted and is
# never read from the URL (`crates/web-viewer/src/play_dev_menu.rs`). Both
# hosts now drive the same `DevMenuSession` off the same packed pad words
# (shared `engine-core::dev_menu::retail_packed`), commit the EQUIP row
# through the same `WorldEquipHost`, and draw both pages at the paired pens -
# the tick and records-model injection sites are `SIM_PAIRS` rows and the
# pens + heading strings are `CONSTANT_PAIRS` rows, so the two hosts cannot
# quietly diverge on the model that made this pair worth wiring.


# The shop's four retail descriptor windows - 33 (vendor plate), 32 (purse),
# 34 (item info), 37 (sell quantity) - were each waived here on the premise
# that "the browser play page has no shop host: nothing in
# `crates/web-viewer/src` opens a `ShopSession` or drains
# `take_pending_field_shop`". That premise was false against the tree it
# claimed to describe: `web-viewer/src/play_shop.rs` drains
# `take_pending_field_shop` in `poll_field_shop`, `runtime.rs` calls it every
# `tick_frame`, and `site/js/play-app.js` drives the session through
# `play_shop_is_open` / `play_shop_input` / `play_overlay_draws_json`. The
# waivers were undone work wearing the language of an exemption, which is the
# one failure mode this file exists to prevent - the checker validates a
# waiver's BUCKET against the source but cannot read its prose, so a false
# reason survives every re-derivation. All four now paint on the web host off
# the same `painter_at` dispatch and the same disc-parsed rects.

# `char_prompt_draws_for` (window 7, the spell level-up notice) was waived
# here as an orphan whose closing work was the **menu-cast leveling arm**,
# not a draw call. That arm exists now: `apply_spell_outcome` accrues the
# `FUN_800402F4` heal grants into the caster record's per-spell XP array
# (the `+0x5D0` accumulator off the `0x80084140` save-context window IS the
# record-`+0x8` array the battle summon path trains - one counter, not two,
# since `0x80084140 + 0x5C8` is the `0x80084708` record base), levels
# through the shared `magic_xp::accrue_and_level` kernel, and returns the
# `FUN_80035C00` pair. `MenuRuntime` holds the beat and both hosts paint
# window 7 off the disc-parsed rect - `window/menu_draws.rs` and
# `web-viewer/src/play_menu.rs` - holding the pad for a confirm / cancel
# press exactly like the window-31 toast below.

# `amount_prompt_draws_for` (window 31, the Point Card toast) and
# `item_points_panel_draws` (the item-info panel's `0xFE` arm) were waived here
# as `web_missing`, each with its closing call spelled out. Both calls are made
# and both waivers are gone. `World` carries the `point_card` bank (retail
# `_DAT_800845B4`), `MenuRuntime` accrues on the `ShopConfirm` buy commit and
# holds `point_card_toast` until a press, and each host resolves id 31 off the
# same disc-parsed window table - `window/shop_windows.rs` and
# `web-viewer/src/play_shop.rs`, with the Items-screen arm in
# `window/menu_draws.rs` and `web-viewer/src/play_menu.rs`.
#
# Which window the beat opens was disc-sourced rather than inferred: both retail
# buy commits hand the widget VM a script whose entire body is `01 1F` plus the
# terminator - "open window `0x1F`" - `0x801E4EDC` from the quantity commit
# (`FUN_801DB7F4` case 2) and `0x801E4EA8` from the recipient picker
# (`FUN_801DB380`). The heading and unit label live beside the builder in
# `engine-ui` rather than once per host, so the two cannot drift on the content
# without the shared builder changing under both at once.

[[waiver]]
builder = "count_panel_draws_for"
kind = "orphan"
reason = """
Window id 24 (`FUN_801DCC20`): a two-digit count in the accent pen over a
reserved sub-rect, guarded on the staged item id. This was waived on "window
24's rect is byte-identical to window 17's, so which screen opens 24 rather
than 17 is unknown". The geometry could not answer it; the open scripts can.
Exactly one command in the menu overlay opens window `0x18` - script
`0x801E4DC8`, run by sub-screen `0x14` (`FUN_801D9C14`) - and the same script
opens windows `2` and `0x19` beside it, the **Equip** title tab and the
active-character stat compare. Window 24 is the Equip screen's item panel.
(The sub-screen id read `0x13` here until it was checked against the pointer
table: the script is loaded at `0x801d9d00`, inside the routine the table
lists at index `0x14`; index `0x13` is `0x801D99F0`.)

What still blocks it is the other half of the old reason, which stands: the
painter is only the **delta**. The renderer's gated body opens with
`jal 0x801D0F1C`, the shared item-info panel window 17 also draws, so a host
adopting window 24 draws that panel into the same rect and adds this count on
top. The engine's equip screen is a slot list with no item-info panel at all,
so there is no rect to add a count to yet.
"""

# `two_line_choice_panel_draws_for` (window 5) and `label_list_draws_for`
# (window 6) were waived here as orphans blocked on "the entry-context kind
# reaching `0x0D`", because the port tagged each op-`0x49` park by its owning
# context instead of recording the armed sub-op. Both waivers said in as many
# words: close it by making the arm record its sub-op, not by adding a draw
# call. That is what happened. `FieldHost::op49_arm` now carries the sub-op -
# which is what retail's park holds, since `_DAT_8007B450` is the *operand
# pointer* (`sw s6,-0x4bb0(s0)` at `0x801e09a8`) and every consumer reads its
# first byte (`lbu v0,0x0(s6)` at `0x801e0984`) - so
# `World::menu_entry_context_kind` answers with any of the fourteen sub-ops
# rather than with the two the port could previously infer.
#
# Both screens then followed, on both hosts. `FieldMenuSession` grew the two
# phases retail's own dispatcher selects for this kind - `Notice` (sub-screen
# `4`, `FUN_801DD1B8`) as the *entry* screen and `ReadyConfirm` (sub-screen
# `3`, `FUN_801D6D38`) as the cancel destination - and each host draws them
# off the disc-parsed rect through `painter_at`
# (`window/menu_draws.rs::context_locked_screen_draws` and
# `web-viewer/src/play_menu.rs::build_context_locked`). The labels are read
# out of the caller's own PROT 0899 image at the VAs the two renderers load
# (`pause_screens::ContextLockedLabels`), installed by the one
# `install_menu_overlay_tables` call both hosts already made - so neither host
# can ship the panels text-less while the other draws them, and no string is
# committed.
#
# Two things the old prose had wrong, both now corrected where they were
# written down:
#
#   * Window 5 is **not** a "really leave?" gate. `FUN_801D61B0`'s own string
#     pointers are `0x801CEC78` / `0x801CEC94`, a battle-start ready check;
#     its Yes exits the menu *into the fight*.
#   * Window 6's six labels are **not** "content that record owns". They are
#     six static VAs in the menu overlay's own pool, loaded by
#     `lui a0,0x801d` + `addiu` pairs at `0x801d636c..0x801d6448` - a
#     multi-line battle briefing plus a one-byte control string. So the text
#     was never the obstacle; only the trigger was.
#
# Reachability was measured rather than assumed, because a screen that hangs
# off a kind byte no script ever arms is not worth a host:
# `crates/engine-core/tests/op49_sub_op_census.rs` walks every scene MAN's
# field-VM script and tallies the op-`0x49` sub-op operands. Kind `0x0D` is
# armed on the real disc; so is kind `7` below.
#
# One half of this is still short of retail, and it is disclosed on
# `FieldMenuSession::open_entry_screen` rather than hidden by the deletion.
# Retail's op-`0x49` arm spawns a driver actor that **opens the menu itself**
# and keeps the park armed until that screen hands back; the port has no path
# from a parked field script to opening a host-owned pause menu, so the close
# tick retires the park within a few frames. The decode runs on both hosts and
# the screens draw - but a player reaches them only if the menu opens while
# the park is still armed. Closing that is the inline gold shop's shape (a
# `take_pending_field_menu` channel plus a host-called finish), not a draw
# call, and it is a different gap from the one these waivers described.


# `equip_target_list_draws_for` (window 36) and `compare_panel_draws_for`
# (windows 25 / 41) were waived here as orphans blocked on "the flow that
# opens them" - the shop's equipment-buy recipient picker (`FUN_801DB380`) -
# and then read as web-ahead once the browser page grew that surface and the
# native window had not. Both gaps are closed: `engine-ui`'s
# `recipient_picker_draws_for` is now the whole sub-screen as one shared
# composition, and each host only resolves the three rects off the disc
# window table and builds the model - `web-viewer/src/play_shop.rs` and
# `window/shop_windows.rs`, both named `recipient_window_draws`. The native
# window arms the flow in `window/run.rs` off `BootSession::equip_restrictions`,
# the twin of the page's `load_disc` arming. Nothing to waive, and a future
# divergence would have to be written into the shared builder, where it would
# show up on both hosts at once.

# --- Widened surface: engine-ui's intermediate draw records ------------------
#
# The checker's builder surface used to stop at `TextDraw` / `SpriteDraw`. It
# now also counts the crate's intermediate records - `HudDraw`, `HudQuad`,
# `DigitCell`, `BarFrame`, `ComparePanelField` - because a screen that stops at
# one of those is still a screen, and leaving them off made two whole chains
# (the fishing HUD, window 25's compare panel) invisible while every other
# pause screen was covered. Thirteen builders arrived with the widening. Ten
# were already reached on both hosts through methods the call graph now walks.
# Of the remaining three gaps, the PROT 0977 arena-hub quad emitters
# (`hud_quad_centred` / `hud_quad_corner` / `decimal_quads`) are now wired on
# BOTH hosts - `minigames_muscle::muscle_hub_quads_json` runs them over the
# draw lists recovered from that entry's own call sites for the dome page,
# and the native play-window draws the same screens through the same
# builders (`window/minigames.rs::muscle_hub_sprite_draws`: intro card +
# ROUND banner over an open leg, INTERVAL + score tally between legs, the
# tally fed the same DomeContest rows/tally + coin-bank model) - so only the
# one below is left.

[[waiver]]
builder = "equip_compare_panel_fields"
kind = "orphan"
reason = """
`FUN_801D1290`, window 25 - the Equip screen's active-character stat-compare
panel. It orphaned when the shop's equipment-buy recipient picker stopped
drawing window 25: retail's picker script opens only window 36, so that draw
was a panel retail does not show, and removing it was correct. What it left
behind is this painter plus its category chain (`active_compare_category`,
`CompareRows::from_category`), which nothing else reaches. The gate was blind
to that for as long as its surface stopped at `TextDraw`.

The covering path exists and is drawn on both hosts: the port's Equip screen
prints its stat compare from `FUN_801D21C0`, window 22's own Best-Equipment
pass, through `equip_screen_draws_for`'s `stat_compare` rows. So this is not a
screen the player is missing - it is a second, descriptor-driven renderer of
the same readout.

The blocking capability is the **equip window set**, the same one that blocks
window 24 (`count_panel_draws_for` above). Retail opens windows 2 / 24 / 25
from one script (`0x801E4DC8`, sub-screen `0x13` / `FUN_801D9C14`); the port's
equip flow (`legaia_engine_core::equip_session`) is built on the
capture-pinned set 2 / 21 / 22 / 23, and window 25's rect `(14, 40, 144, 52)`
overlaps the party window 21 it would have to replace. Closing it means
moving the whole screen onto the descriptor-table layout - which is also what
would give window 24 the item-info rect it needs - not adding a draw call to
the screen as it stands.
"""
