# --- page: the browser's OTHER frame path, in JavaScript --------------------

[[frame_arm]]
host = "page"
arm = "advance && !menuOpen && !shopOpen && !namingOpen"
reason = """
`site/js/play-app.js::_frame` calls `rt.tick_frame()` inside this guard and
`this._drawOverlay()` outside it, so on a guarded frame the page draws with
NO kernel having run - all twenty at once, from whatever answer they last
held. Three of the four terms are panels that suspend the field on the engine
side as well (the pause menu, a field merchant's op-`0x49`, the naming
prompt); the fourth is the page's own pause / step-one-frame control.

This is disclosed rather than closed because the guard is the page's field
freeze and moving the tick outside it would advance the world under a menu.
What is closed instead is the consequence: the two kernels whose answers a
guarded frame still DRAWS - the field party readout and the passive-ability
badge column - now ask the suppress gate on the draw path as well as on the
tick, so a stale decision cannot reach the screen. Any kernel added to
`tick_frame` whose output the page draws on a guarded frame needs the same
treatment, and this row is where that is recorded.
"""
