[[waiver]]
builder = "choice_panel_draws_for"
kind = "orphan"
reason = """
Window id 46 (`FUN_801D603C`). This was waived as needing "a two-row choice
screen whose state is the `DAT_801E46D0` flags word", with the options screen
named as the screen it would have to replace. Both halves were wrong.

It is the **casino prize counter's Yes/No confirm**. Script `0x801E4F2C` is the
only command in the overlay that opens window `0x2E`, and it runs from
sub-screen `0x20` (`FUN_801DC1CC`, the prize exchange) at the point where a
chosen prize clears the coin and held-cap gates; `0x801E4F34` closes it again
on No or cancel, and the cursor is seeded to row 1 - retail's "No is the
default". And the flags word is not unmodelled state: it is the shared cursor
word `FUN_801D688C` maintains, whose four-way decode is already ported and
**live** as `engine-core::shop::shop_cursor_mode` - the same three bits and the
same arms as this crate's `ChoiceFlags::marker_variant`.

The blocking capability is a **host that mounts the prize exchange**. The
session is ported and complete (`engine-core::prize_exchange`, whose state 2 is
this confirm); nothing opens it, so nothing reaches the beat.
"""

[[waiver]]
builder = "two_line_choice_panel_draws_for"
kind = "orphan"
reason = """
Window id 5 (`FUN_801D61B0`). It shares window 46's marker branch chain, which
is why it was waived for the same reason - but it belongs to a different
screen. Script `0x801E4BD4` is its only opener, from sub-screen `3`
(`FUN_801D6D38`): a two-row confirm seeded to No whose Yes routes to
sub-screen `0` (leave the menu) and whose No returns to the pause root. The
root reaches it from **cancel**, under one condition only - the entry-context
pointer `_DAT_8007B450` non-null with first byte `0x0D`
(`0x801d6cf8..0x801d6d18`). It is the "really leave?" gate on a scripted menu.

The blocking capability is the **entry-context kind**. Retail keeps one global
whose first byte says which flow opened the menu; the port replaced it with a
per-context tagged park, so no byte exists to compare against `0x0D` and no
condition selects this screen. Same gap as the pause root's entry-context row -
see docs/tooling/live-audit-triage.md.
"""

[[waiver]]
builder = "label_list_draws_for"
kind = "orphan"
reason = """
Window id 6 (`FUN_801D6360`): six stacked labels with the only cursor in this
