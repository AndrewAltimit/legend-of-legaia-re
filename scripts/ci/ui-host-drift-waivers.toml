# Waivers for scripts/ci/check-ui-host-drift.py.
#
# Each entry records a shared `engine-ui` draw builder that one host reaches
# and the other does not, plus WHY that is acceptable today. "Reaches" is
# transitive: a host that draws a builder draws whatever that builder composes,
# so "no host names this function" is not by itself a reason to waive - check
# whether a drawn builder folds it in first. The checker validates every waiver
# against the real source, in both directions:
#
#   * a builder that no longer exists          -> stale waiver, CI fails
#   * a builder now wired on both hosts        -> stale waiver, CI fails
#   * a `web_missing` waiver whose builder is
#     no longer native-only                    -> wrong bucket, CI fails
#   * an empty `reason`                        -> CI fails
#
# So this file cannot quietly become fiction: it only passes while it
# describes the actual state of the two hosts. Closing a gap means deleting
# the waiver, and CI tells you when you forgot.
#
# `kind` is one of:
#   "web_missing" - native calls it, the browser play page does not
#   "orphan"      - neither host calls it

# `battle_hud_draws_for` / `encounter_banner_draws_for` were waived here as
# "undone work" - the browser page had no battle host to draw into. The
# battle host is done: `web-viewer/src/play_battle.rs` arms the live gameplay
# loop on `enter_field` (`arm_live_battles`, the browser twin of
# `BootSession::enter_field_live`), `tick_battle_presentation` folds battle
# events + refreshes the HUD through the shared
# `engine_core::battle_hud::sync_battle_hud_rows`, and
# `play_overlay_draws_json` composites the HUD rows, the ENCOUNTER! banner
# and the player-driven command menus over the running scene. Both builders
# now paint on both hosts.

# `dialog_box_draws_for` / `dialog_panel_draws_for` were waived here as
# orphans whose "honest resolution is deletion". They are deleted: no host
# rendered dialog through them (both hosts draw the `DialogSnapshot` path at
# the byte-pinned retail geometry), and their only references were unit tests
# in `engine-render/src/tests/`. The `DialogBoxLayout` / `DialogGlyphView` /
# `dialog_clut_color` support types went with them.

# `game_over_draws_for` was waived here as unreachable on both hosts,
# because retail's party-wipe destination is unpinned and this panel's
# Continue / Retry / Quit rows are an engine invention. The waiver is
# removed: both hosts now construct the panel off `World::game_over`
# (native `BootUiState::GameOver` from the redraw loop, the browser from
# `post_battle_overlay_draws`), which is a presentation the port owns. The
# retail question the waiver raised is still open and still recorded in
# `docs/subsystems/battle.md` - what changed is that a wiped party is no
# longer a silent no-op that hands the player back a full-HP field.

# `key_rebind_draws_for` was waived here as unreached on BOTH hosts. The
# waiver named its blocking capability precisely - "a **menu route**": the
# options screen had no row that opened a sub-screen, `OptionsSession` carried
# no binding-edit state for one to drive, and the only caller of
# `engine-core::key_rebind::KeyRebindSession` was a test. All three exist now.
# `OPTIONS_KEY_CONFIG_ROW` is an engine-only eleventh display row carrying an
# `OptionsRowAction` rather than a config word (so the retail ten stay the
# default set, and a headless host that arms no binding table never sees it);
# `OptionsSession::with_key_rebind` / `arm_key_rebind` own the sub-session and
# publish the edited table through `take_bindings_dirty`; and the shared
# composition draws the builder for both hosts off one `KeyRebindView`.
#
# Each host supplies only the store and the key events. Native arms the row
# off the live `legaia-input.toml` table and writes the same file back - the
# one `legaia-engine config set --binding` edits, not a second store - and
# latches one key name per physical press in `handle_key` (winit repeats a
# held key, and consuming that stream would bind the confirm key to whatever
# row was highlighted). The browser page arms it off
# `web-viewer::pad_bindings::live_mapping`, persists through `store_mapping`
# into `localStorage`, and feeds `KeyboardEvent.code` through
# `play_menu_key` - which has to be a second entry point, because the screen
# exists to bind keys that carry no pad bit yet and the page's pad path drops
# exactly those.
#
# One thing both hosts bound the same way, deliberately: the bindable key set
# is `input::KEY_NAME_DOM_CODES`, the vocabulary the table is keyed by. The
# native `keycode_to_name` filter and the browser `key_name_for_dom_code`
# lookup are the two ends of it, so neither host can bind a key the other
# cannot spell.

# `sprite_draws_for` used to be waived here as "a generic anchor-translate
# helper ... not a screen". That prose was the right reading and the wrong
# instrument: a waiver says "this gap is acceptable", and there was no gap -
# the function was never a screen to begin with. The checker now classifies on
# the whole signature rather than the return type alone (draw records IN means
# a transform over a draw list, not a projection of a model), so the surface
# no longer contains it and there is nothing left to waive.

# `records_screen_draws_for` / `dev_menu_list_draws_for` were waived here as
# `web_missing`, blocked on a "process-scoped opt-in" - the native window
# mounts the developer-menu surface behind `LEGAIA_DEV_MENU`, an environment
# variable "set by whoever launches the binary", and the waiver held that a
# public web page has no such person. That premise mistook who runs a
# client-side page: the visitor IS the person running the program - the game
# is single-player, the disc never leaves the tab, and everything the menu
# edits is the visitor's own session (the same site already ships a
# client-side ROM patcher). What the env var actually provides is "an
# explicit, deliberate act by the person at the keyboard that a link cannot
# carry", and the browser twin of that exists: the play page's Dev-menu
# checkbox, which starts unchecked on every load, is never persisted and is
# never read from the URL (`crates/web-viewer/src/play_dev_menu.rs`). Both
# hosts now drive the same `DevMenuSession` off the same packed pad words
# (shared `engine-core::dev_menu::retail_packed`), commit the EQUIP row
# through the same `WorldEquipHost`, and draw both pages at the paired pens -
# the tick and records-model injection sites are `SIM_PAIRS` rows and the
# pens + heading strings are `CONSTANT_PAIRS` rows, so the two hosts cannot
# quietly diverge on the model that made this pair worth wiring.


# The shop's four retail descriptor windows - 33 (vendor plate), 32 (purse),
# 34 (item info), 37 (sell quantity) - were each waived here on the premise
# that "the browser play page has no shop host: nothing in
# `crates/web-viewer/src` opens a `ShopSession` or drains
# `take_pending_field_shop`". That premise was false against the tree it
# claimed to describe: `web-viewer/src/play_shop.rs` drains
# `take_pending_field_shop` in `poll_field_shop`, `runtime.rs` calls it every
# `tick_frame`, and `site/js/play-app.js` drives the session through
# `play_shop_is_open` / `play_shop_input` / `play_overlay_draws_json`. The
# waivers were undone work wearing the language of an exemption, which is the
# one failure mode this file exists to prevent - the checker validates a
# waiver's BUCKET against the source but cannot read its prose, so a false
# reason survives every re-derivation. All four now paint on the web host off
# the same `painter_at` dispatch and the same disc-parsed rects.

# `char_prompt_draws_for` (window 7, the spell level-up notice) was waived
# here as an orphan whose closing work was the **menu-cast leveling arm**,
# not a draw call. That arm exists now: `apply_spell_outcome` accrues the
# `FUN_800402F4` heal grants into the caster record's per-spell XP array
# (the `+0x5D0` accumulator off the `0x80084140` save-context window IS the
# record-`+0x8` array the battle summon path trains - one counter, not two,
# since `0x80084140 + 0x5C8` is the `0x80084708` record base), levels
# through the shared `magic_xp::accrue_and_level` kernel, and returns the
# `FUN_80035C00` pair. `MenuRuntime` holds the beat and both hosts paint
# window 7 off the disc-parsed rect - `window/menu_draws.rs` and
# `web-viewer/src/play_menu.rs` - holding the pad for a confirm / cancel
# press exactly like the window-31 toast below.

# `amount_prompt_draws_for` (window 31, the Point Card toast) and
# `item_points_panel_draws` (the item-info panel's `0xFE` arm) were waived here
# as `web_missing`, each with its closing call spelled out. Both calls are made
# and both waivers are gone. `World` carries the `point_card` bank (retail
# `_DAT_800845B4`), `MenuRuntime` accrues on the `ShopConfirm` buy commit and
# holds `point_card_toast` until a press, and each host resolves id 31 off the
# same disc-parsed window table - `window/shop_windows.rs` and
# `web-viewer/src/play_shop.rs`, with the Items-screen arm in
# `window/menu_draws.rs` and `web-viewer/src/play_menu.rs`.
#
# Which window the beat opens was disc-sourced rather than inferred: both retail
# buy commits hand the widget VM a script whose entire body is `01 1F` plus the
# terminator - "open window `0x1F`" - `0x801E4EDC` from the quantity commit
# (`FUN_801DB7F4` case 2) and `0x801E4EA8` from the recipient picker
# (`FUN_801DB380`). The heading and unit label live beside the builder in
# `engine-ui` rather than once per host, so the two cannot drift on the content
# without the shared builder changing under both at once.

# `count_panel_draws_for` (window 24) was waived here as an orphan blocked on
# "the engine's equip screen is a slot list with no item-info panel at all, so
# there is no rect to add a count to". Both halves of that are now false, and
# the doc the waiver leaned on had already settled the second: the Equip
# screen's candidate step is sub-screen `0x14`, whose open script `0x801E4DC8`
# opens windows 24 and 25 **on top of** the browse step's four - so window 24
# is an addition to the port's screen, not a different layout for it. Window
# 24's renderer calls the shared item-info panel `FUN_801D0F1C`, which window
# 17 also calls, which is why the two descriptors carry byte-identical rects.
#
# So the panel was extracted from the one screen that had it
# (`items_screen_draws_for` -> `item_info_panel_draws_for`), the Equip model
# grew the hovered candidate's info row, and the compose draws window 24's
# frame, that panel, and this painter's count delta over it whenever the
# candidate step is up. Both hosts reach it through the shared
# `equip_screen_compose`.
#
# The same change fixed what the waiver's own closing note called out as *not*
# the gap: the screen had been spelling every candidate `Item 3A`, because the
# item name / description resolver lived inside the Items screen's session
# builder. It is `field_menu_dispatch::item_display_text` now, and both hosts
# pass it.

[[waiver]]
builder = "equip_compare_panel_fields"
kind = "orphan"
reason = """
`FUN_801D1290`, window 25 - the Equip screen's active-character stat-compare
panel. It orphaned when the shop's equipment-buy recipient picker stopped
drawing window 25: retail's picker script opens only window 36, so that draw
was a panel retail does not show, and removing it was correct. What it left
behind is this painter plus its category chain (`active_compare_category`,
`CompareRows::from_category`), which nothing else reaches. The gate was blind
to that for as long as its surface stopped at `TextDraw`.

The covering path exists and is drawn on both hosts: the port's Equip screen
prints its stat compare from `FUN_801D21C0`, window 22's own Best-Equipment
pass, through `equip_screen_draws_for`'s `stat_compare` rows. So this is not a
screen the player is missing - it is a second, descriptor-driven renderer of
the same readout.

The blocking capability this waiver used to name was **wrong**, and its twin
proved it. It read: "retail opens windows 2 / 24 / 25 from one script, the
port's equip flow is built on 2 / 21 / 22 / 23, and window 25's rect overlaps
the party window 21 it would have to replace - closing it means moving the
whole screen onto the descriptor-table layout". Script `0x801E4DC8` belongs to
sub-screen `0x14`, the **candidate step**, which runs after `0x12` has picked
the character and `0x13` has browsed the slots; it opens 24 and 25 *on top of*
the four windows already up. Overlapping window 21 is what it is for. Window
24 has since been adopted on exactly those terms, on both hosts, and nothing
about the screen's layout had to move.

What actually blocks this one is narrower and is a real missing input:
`EquipComparePanelView` wants the live and trial-equip **stat blocks**
(`0x801EF080` / `0x801EF0A0` - eight words each, plus the record's own HP/MP
maxima and the compare **category** that picks which three rows print), and
the equip model publishes three `(label, current, preview)` triples instead,
which is all window 22's own Best-Equipment pass needs. Closing it means
`equip_session` publishing the two blocks and the category, not a draw call:
the field list already materialises through `compare_panel_draws_for`, which
the shop's window 41 reaches.
"""

[[waiver]]
builder = "guarded_box_rect"
kind = "orphan"
reason = """
`FUN_801E4140`, the bottom-clip guard the menu overlay wraps every box emit
in: `y <= 0xF0` passes the rect through, otherwise nothing is drawn. Unreached
on BOTH hosts, and it was not merely unwired - until the rect return shape was
added to the gate's `DRAW_RET_RE` it was not even a *builder* here, so the gate
neither counted it nor would have accepted this waiver. That silence is the
reason the entry exists: the port's disclosure and the gate now agree on the
same set.

Two things block a call site, and neither is a missing draw call. First,
nothing can produce an out-of-range `y`: `0xF0` is the 320x240 stage's own
height, every rect in the disc window table passes, and the one rect retail
stamps per open - the options value popup, window 47 - is already flipped up by
its own rule when its bottom would pass `0xB0`
(`engine-core::options::options_popup_content_rect`). Gating a host on this
adds a branch nothing can take. Second, the guard is only half of a pair: the
fill it gates is `FUN_80034B6C`'s mode selector plus packed RGB word, which has
no port, so the engine's boxes are UI-atlas sprites whose colour comes from the
atlas rather than from a caller's word. Wiring the guard alone would claim a
guard over a fill the port does not perform.
"""
