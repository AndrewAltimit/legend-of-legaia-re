# --- kernel pairing: the same step under two names -------------------------

[[frame_kernel]]
native = "apply_world_clut_fx"
web = "step_field_vram_fx"
reason = "Both drain the world's banked CLUT-cell effects and ambient palette cyclers against the host's CPU VRAM through the same four engine calls (`step_ambient_fx`, `step_clut_fx`, `apply_script_vram_moves`, `apply_vram_rect_copies`)."

[[frame_kernel]]
native = "drain_and_route_field_events"
web = "drain_and_route_field_events_web"
reason = "The same drain of `World::pending_field_events`; the `_web` suffix is the browser's copy, not a different step."

[[frame_kernel]]
native = "drain_and_log_battle_events"
web = "tick_battle_presentation"
reason = "Both fold the battle SM's events into world state and refresh the HUD rows through `sync_battle_hud_rows`. They are not equal - the native side also drains the shout / XA / effect-spawn cue lanes - but they are one step in each host's frame path, and the cue-lane difference is tier 3's question, not this tier's."

[[frame_kernel]]
native = "tick_minigame_extras"
web = "tick_minigame_ui"
reason = "Each host's one per-frame minigame step. Their contents differ in exactly three sub-steps - the dance sequence-clear spawns, the Baka round chrome and the effect-pool ageing they all feed - because only the native window owns a minigame effect pool. Sub-step table + the two contents this row used to misname as gaps (the dance count-in banner and the cast lure, both engine-side and on every host) are in host-drift.md's `Known gaps`."

[[frame_kernel]]
host = "web"
kernel = "drive_npc_clips"
host_only = true
reason = "The page's one named step for the op-`0x4B` ANIMATE cue drain, the per-tick NPC clip advance and the player move-cue drain. The native window does all three inline in its own tick loop (`window/event_handler/redraw.rs`, the `SceneMode::Field` block), so it has no named kernel for them. This row replaces an alias to `tick_field_prop_anims`, which was an EMPTY host shim - a `{}` body pairs by name with anything."

# --- kernel pairing: one host's frame path only ----------------------------

[[frame_kernel]]
host = "native"
kernel = "advance_ocean_animation"
host_only = true
reason = "The world map's 13-frame ocean CLUT cycle. The page reaches the same cycle through `step_field_vram_fx`'s `step_ambient_fx` leg against its own VRAM copy, so it needs no separate step."

[[frame_kernel]]
host = "native"
kernel = "check_battle_vram_residency"
host_only = true
reason = "A native-only repair: the window uploads battle textures into a wgpu-resident VRAM image, and any path that re-uploads over them has to be caught and undone. The page re-reads `field_vram_bytes` whenever `field_vram_take_dirty` reports a change, so its equivalent is a pull, not a per-frame check."

[[frame_kernel]]
host = "native"
kernel = "drain_baka_sfx_cues"
host_only = true
reason = "The Baka Fighter exchange-hit cues. The page drains every minigame cue lane in one place (`drain_minigame_sfx_cues_web`, inside `tick_sfx`) rather than one lane per kernel."

[[frame_kernel]]
host = "native"
kernel = "maybe_install_demo_tile_board"
host_only = true
reason = "The window's `LEGAIA_TILE_BOARD_DEMO=1` env trigger, which a browser cannot set. The page reaches the same `World::try_install_tile_board` bytecode from its own explicit control (`play_tile_board.rs`), so the capability is on both hosts and only the trigger is native."

[[frame_kernel]]
host = "native"
