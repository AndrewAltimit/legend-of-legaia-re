# --- page: the browser's OTHER frame path, in JavaScript --------------------

[[frame_arm]]
host = "page"
arm = "if (advance)"
reason = """
`site/js/play-view-frame.js::_frame` runs the frame's ticks
(`this._frameTicks`, over the engine's `play_frame_ticks`) inside this guard
and `this._drawOverlay()` outside it, so on a frame the guard holds back the
page draws with NO kernel having run - the whole `skips` list at once, from
whatever answer each last held. `advance` is the page's own pause /
step-one-frame control, the only term left: every screen (the pause menu,
the naming prompt, a shop, the prize exchange, an inn) takes its ticks one at
a time inside `play_frame_ticks`, through the order both hosts share
(`BootSession::claim_tick`). The frame-level freezes a cached bundle without
those exports needed are gone with the copy of the order they guarded.

The pause control has no native twin, and what it holds back is the whole
simulation, which is its point. The two kernels whose answers a held frame
still DRAWS - the field party readout and the passive-ability badge column -
ask the suppress gate on the draw path as well as on the tick, so a stale
decision cannot reach the screen. Any kernel added to `tick_frame` whose
output the page draws on a held frame needs the same treatment, and this row
is where that is recorded.
"""
skips = [
    "audio_director",
    "drain_and_route_field_events",
    "drive_npc_clips",
    "poll_field_shop",
    "poll_game_over",
    "run_pending_bgm_handoff",
    "service_cutscene_fmv",
