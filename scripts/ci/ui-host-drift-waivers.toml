host_only = true
reason = "The page's title -> load score hand-off is armed by the card-Load poll and run by the scene entry that follows it; this per-tick call only catches an entry the page declined, and is a no-op on every other frame. The native window has no gap to catch: `apply_save_commit` enters, loads and hands the score over in one call."

