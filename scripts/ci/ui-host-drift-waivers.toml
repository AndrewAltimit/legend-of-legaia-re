# --- kernel pairing: two paired kernels, two engine call sets (tier 12) ---
# `[[frame_content]]` rows declare a PAIRED frame kernel whose two bodies
# reach different engine functions. The two lists are the ratchet: when the
# difference moves, the row goes stale and fails, which is what stops a
# waiver from outliving the thing it described. A row is not a licence for
# the difference - it is a statement of where the other host does the work.

[[frame_content]]
native = "drain_and_log_battle_events"
web = "tick_battle_presentation"
native_only = []
web_only = ["action_id", "apply_battle_vram_moves", "armed", "battle_monster_slots", "battle_party_forms", "battle_stage_entry", "battle_stage_object_indices", "build_targeted_with_options", "clear_popups", "contains_prot_index", "current_frame", "drain_battle_clut_stages", "ensure_battle_party_forms", "entry_bytes_extended", "far_colour_for_prot_index", "install_monster_battle_form", "monster_tex_slots_used", "party_roster_slot", "play_xa_shout", "read_span_sectors", "release_summon_seat", "replay", "reset", "shout", "stage_effect_clut", "stage_luminance", "system_ui_bundle", "tmd_bytes", "upload_battle_stage_tims_into_vram", "upload_flame_atlas_into_vram"]
reason = "The page folds its whole battle presentation frame into this one named step: stage and atlas upload (with the ground-fog stage brightness `fog_volume::stage_luminance`, which the window takes in its own `enter_battle_render`, pinned by a SIM_PAIRS row), the monster battle-form install and the party forms' read-back, the CLUT stage drain, the shout XA request, and the popup retire. The native window does that same work, but spread across its draw section and window/battle.rs rather than inside the kernel its frame path names, so the difference is where the code sits and not whether the host does it. Checked name by name: every presentation call has a call site in the native sources (most of them in window/battle.rs; the arena object list and the Cort hand-back ground blank are the engine's own `SceneHost::battle_stage_object_indices` / `World::apply_battle_vram_moves`, which the window reaches from its stage-rebuild path outside this kernel; the monster battle-form install is the one engine kernel `engine-core::battle_party_form` both hosts call, and the party forms are the engine's own - `SceneHost::ensure_battle_party_forms` builds and installs them from `SceneHost::tick` for every session, and both hosts call it again before their render build and read `battle_party_forms`, replaying its VRAM writes with `replay`). The page-only packet_color::hybrid now sits inside the page's stage-shell builder, below this kernel: it is the CPU-side per-vertex colour stream the page hands WebGL, and the wgpu renderer resolves the same packet colour in its fragment shader instead. The empty native-only side is the other half of the check: nothing the window reaches here is missing from the page. The audio half - the duck target, the strike / cast cues and the reward bank - is the shared director's on both hosts (`AudioBgmDirector::set_duck_pct` / `enqueue_battle_cues`, engine-session), so it lists on neither side. `entry_bytes_extended` is the page reading the battle stage and effect entries off PROT inside this step; the window reads them from its stage-rebuild path outside its kernel."

[[frame_content]]
native = "tick_fishing_banners"
web = "tick_fishing_banners"
native_only = []
web_only = ["start"]
reason = "A name collision, not a difference: both hosts start the splash banner with the same `fishing_banners.splash.start()`. The walk drops a call whose name is also one of the host's own fns, and engine-shell defines `BgmDirector::start` on its audio-trace and retail-compare directors while the page no longer defines a `start` of its own."

[[frame_content]]
native = "drain_anim_cues"
web = "drive_npc_clips"
native_only = []
web_only = ["advance", "field_npc_clips_advance", "sync_npc_clip", "take_npc_morph_dirty"]
reason = "The cue drain is one engine kernel on both hosts; `sync_npc_clip` / `advance` are the page posing its NPC clip players for this tick inside the same step, under the engine's `World::field_npc_clips_advance` gate: from the world-owned cursor `World::tick_npc_clips` steps under each actor's `+0x62` word, or free-running for a slot the world binds no cursor to. The native window does the same `sync_npc_clip`-else-`advance` in its draw pass, behind the same gate, because the pose key it yields keys the pose cache that pass reads - so the step and its gate sit outside this kernel natively, and both hosts hold the clips still off the field. `take_npc_morph_dirty` (op-`0x4B` NPC morphs) is drained here on the page into a per-slot generation, and natively in `take_npc_morph_rebuilds` ahead of the redraw's renderer borrow, where it evicts that same pose cache; both stage through `World::npc_morphed_tmd`."

[[frame_content]]
native = "tick_dev_menu"
web = "tick_dev_menu"
native_only = ["records_screen_draws_for"]
web_only = []
reason = "The dev menu Records page, built on opposite sides of the frame. Both hosts ship it - the page has `dev_records_draws` / `dev_records_model` behind the same Square toggle, pinned to the native model by a SIM_PAIRS row - and both resolve its rows through `records_screen_draws_for`. The native window caches its whole dev-menu draw list at tick time, so the builder sits inside this kernel; the page builds its list in the draw pass (`play_dev_menu_draws_json`), where it holds the surface size the stage transform needs. Same shape as the `tick_field_party_hud` row: one screen, one builder, two sides of the wasm boundary."

[[frame_content]]
native = "tick_field_party_hud"
web = "tick_field_party_hud"
native_only = ["battle_cam_pose", "cap_countdown", "frame_vp", "hud_countdown_cap", "hud_idle_frames", "hud_phase_hold", "is_open", "resolve_field_camera", "scale"]
web_only = []
reason = "One kernel with the projection on opposite sides of the wasm boundary. `hud_idle_frames` / `hud_phase_hold` / `hud_countdown_cap` / `cap_countdown` are the native screenshot harness only: the retail-compare image channel phase-aligns the idle countdown to a retail state (`LEGAIA_HUD_COUNTDOWN`), a capture aid the page has no harness for. The native window projects the lead through resolve_field_camera + frame_vp inside the step; the page draw pass holds no camera and no mutable self, so the projection is its own export, play_camera::play_field_hud_project, which the page calls before the tick - same resolver, same frame_vp, same 0x80 torso offset, and with the CUTSCENE arm suppressed the way the native step suppresses it. It used to be JS math over this frame draw VP, so a scripted shot decided where the readout sat. Both hosts read the suppress pad off World::input."

[[frame_content]]
native = "tick_minigame_extras"
web = "tick_minigame_ui"
native_only = ["build", "build_filtered_vram_mesh_lit", "entry_bytes", "frame", "frame0_bone_offsets", "from_venue", "glyph_u", "has_assets", "hud_vram_rects", "parse_sprite_table", "placement_rotation", "set_assets", "stage_dance_hud_vram", "still_sheet_rgba", "walk_heightfield"]
web_only = ["apply", "course", "drain_minigame_sfx_cues", "exit_dance", "last_result", "opponent_roster", "phase", "play_xa_shout", "prot_dat_raw_bytes", "read_span_sectors", "round", "settle_muscle_contest", "sync_dance_venue", "take_cues", "tick_time_meter", "with_system_ui"]
reason = "Native-only `frame` is `DanceCastSurface::frame`, which both hosts pose the dance cast through; it lists native-only because the page defines a host fn of the same name, which the walk excludes by name. The sub-step table in docs/tooling/host-drift.md is this row in long form. The fishing VENUE actors are no longer a difference: both hosts' `tick_fishing_actors` is the one engine kernel `fishing_venue::tick_fishing_venue_on_host` plus `VenueCameraWrites::apply` onto that host's camera - `apply` lists as web-only only because the native window has a host fn of its own named `apply` (window/field_render.rs), which the walk excludes by name. Native-only `glyph_u`: the window resolves each Baka chrome glyph draw's stamped cell rect against its parsed widget table and carries it beside the draw; both browser hosts consume the same chrome frame (the play page prints it through the shared label kernel and plays its announcer line in `tick_baka_ui`; the minigames page stamps `glyph_u` in its `baka_chrome_json` export and samples the strip there, outside this kernel). The dance venue: both hosts step the one engine kernel `dance_venue::sync_dance_venue` onto their own camera - it lists as web-only only because the native window's wrapper method carries the same name, which the walk excludes by name (as with `apply`). `build` / `build_filtered_vram_mesh_lit` / `frame0_bone_offsets` / `placement_rotation` / `walk_heightfield` are the window uploading that venue (`DanceVenue::build`) to wgpu on the staging edge; the pages bake the same `DanceVenue::build` once at disc load in their minigame art (`load_dance_bodies`), outside this kernel. `entry_bytes` / `from_venue` / `has_assets` / `set_assets` are the same staging edge handing the floor's bodies (`dance_cast_scene::DanceCastAssets::from_venue`, kind 0's mesh read off PROT 0874) to the engine cast surface; the play page builds the same assets once in `load_dance_bodies` and installs them in its `play_mg_dance_scene_frame` export, and both hosts then pose through the one `DanceCastSurface::frame`, outside this kernel. `hud_vram_rects` / `stage_dance_hud_vram` are the window's dance HUD page residency; the page stages the same rects through `sync_dance_hud_residency` and its `play_dance_art` exports. `parse_sprite_table` and `still_sheet_rgba` are the Muscle Dome hub assets and ringside still, which the page loads and bakes in its own `play_mg_muscle_hub_*` exports. The hub's screen timers are one engine kernel on both hosts (`muscle_ringside::HubTimers::tick`), so their leg-edge reads list on neither side; `course` / `round` are the page's staged-opponent read for its dome mesh (`enter_muscle_ui`). `play_xa_shout` / `read_span_sectors` are the page's CD-XA clip path under the Baka chrome's and the dome hub's announcer lines - the window plays the same lines through `AudioBgmDirector::play_xa_clip`, an output this kernel does not name. `phase` / `last_result` are the page's slot payout-edge detector (`tick_slot_ui`) feeding its JavaScript marquee's credit caption. The machine's dot buffer is composed on both hosts from the same `SlotMachine::marquee` through `ui_slot_cabinet::SlotMarqueeClock::frame` (`tick_slot_marquee` here, `tick_slot_ui` on the page), so it lists on neither side. Web-only: the page drain and settle spellings plus the dome time meter, each of which the window steps as its own named kernel. The dome tally voice keys through the shared director on both hosts (`AudioBgmDirector::key_on_voice_attr`), so it lists on neither side. `prot_dat_raw_bytes` / `with_system_ui` are the page's minigame bundle (built on first use from a compact PROT image with no pre-TOC head) taking the slot machine's resident system-UI sheet off the real PROT.DAT; the window uploads the same sheet through `SlotCabinetAssets::with_system_ui` when it first decodes the machine (`refresh_slot_cabinet_gpu`), outside this kernel."

# --- boot installs: a World table the native boot installs (tier 13) ---
# `[[boot_install]]` rows name a `world.install_*` / `world.set_*` call in
# crates/engine-session/src/boot.rs that no shipped crates/web-viewer source
# makes. A row goes stale (and fails) when the page starts calling it or the
# native boot stops.

[[boot_install]]
method = "set_active_scene_label"
reason = "Not a table install: the native `--world-map` launcher's failure arm (`BootSession::enter_world_map_live` when `enter_world_map_scene` errors) labels the world by hand so the window still has a camera. The page has no such launcher arm - its scene entries go through `SceneHost::enter_field_scene` / `enter_world_map_scene`, which set the label themselves."

[[frame_kernel]]
host = "native"
kernel = "capture_phase_met"
host_only = true
reason = "The screenshot harness's phase gate (`LEGAIA_CAPTURE_GATE`), which the retail comparison corpus sets on the `play-window` child it captures an engine frame from. A capture-harness trigger a browser has no counterpart for, not a player surface."
