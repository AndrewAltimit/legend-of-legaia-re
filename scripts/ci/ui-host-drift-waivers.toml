# Waivers for scripts/ci/check-ui-host-drift.py.
#
# Each entry records a shared `engine-ui` draw builder that one host reaches
# and the other does not, plus WHY that is acceptable today. "Reaches" is
# transitive: a host that draws a builder draws whatever that builder composes,
# so "no host names this function" is not by itself a reason to waive - check
# whether a drawn builder folds it in first. The checker validates every waiver
# against the real source, in both directions:
#
#   * a builder that no longer exists          -> stale waiver, CI fails
#   * a builder now wired on both hosts        -> stale waiver, CI fails
#   * a `web_missing` waiver whose builder is
#     no longer native-only                    -> wrong bucket, CI fails
#   * an empty `reason`                        -> CI fails
#
# So this file cannot quietly become fiction: it only passes while it
# describes the actual state of the two hosts. Closing a gap means deleting
# the waiver, and CI tells you when you forgot.
#
# `kind` is one of:
#   "web_missing" - native calls it, the browser play page does not
#   "orphan"      - neither host calls it

# `battle_hud_draws_for` / `encounter_banner_draws_for` were waived here as
# "undone work" - the browser page had no battle host to draw into. The
# battle host is done: `web-viewer/src/play_battle.rs` arms the live gameplay
# loop on `enter_field` (`arm_live_battles`, the browser twin of
# `BootSession::enter_field_live`), `tick_battle_presentation` folds battle
# events + refreshes the HUD through the shared
# `engine_core::battle_hud::sync_battle_hud_rows`, and
# `play_overlay_draws_json` composites the HUD rows, the ENCOUNTER! banner
# and the player-driven command menus over the running scene. Both builders
# now paint on both hosts.

# `dialog_box_draws_for` / `dialog_panel_draws_for` were waived here as
# orphans whose "honest resolution is deletion". They are deleted: no host
# rendered dialog through them (both hosts draw the `DialogSnapshot` path at
# the byte-pinned retail geometry), and their only references were unit tests
# in `engine-render/src/tests/`. The `DialogBoxLayout` / `DialogGlyphView` /
# `dialog_clut_color` support types went with them.

[[waiver]]
builder = "game_over_draws_for"
kind = "web_missing"
reason = """
Unreachable on BOTH hosts, and deliberately so - so read the `web_missing`
bucket as an artifact of the instrument, not a claim: the checker classifies on
whether a host's source *names* the builder, and the native window names it in
a `match` arm over a variant nothing constructs. Referenced is not reached, and
no textual gate can tell them apart.

The native window declares `BootUiState::GameOver` but never constructs it
(`window/boot_cutscene.rs` matches it at two sites; no `BootUiState::GameOver(`
constructor exists outside tests), because retail's trigger is
not pinned: the action-SM `0x5A` gate detects the wipe, but the battle-exit
selector never reads the wipe cause, and no static mode-0x12 writer exists on
the disc (see docs/subsystems/battle.md § party wipe). Worse, retail's game
over is not a menu at all - PROT 0902 carries one string and one unconditional
exit - so this builder's Continue/Retry/Quit rows are an engine invention.
Wiring either host would commit the port to behaviour nobody has observed.
Close it with a runtime probe, not by picking a trigger.

Both hosts now run live battles (the browser via `play_battle.rs`), so the
wipe path is exercised on both: `World::finish_battle` raises the
`World::game_over` flag on `BattleEndCause::PartyWipe` and returns to the
field, and both hosts leave that flag unconsumed - deliberately, and
symmetrically, for the reason above. The gap is host-identical, not drift.
"""

[[waiver]]
builder = "key_rebind_draws_for"
kind = "orphan"
reason = """
Web-exempt by design, but unreached on native too. The browser page's bindings
are JS keycode tables owned by the page, not the engine - `PAD` in
`site/js/play-app.js` for the in-scene pad and `BOOT_PAD` in
`site/_content/play.html` for the title / save rack - and a shared rebind
screen would have to write a config the browser has no place to persist. On
native, rebinding today happens through the `legaia-input.toml` config file and
the `legaia-engine config set --binding` subcommand; the in-engine screen this
builder draws is not mounted in the window's menu tree.

What must exist first is a **menu route**, on either host: the options screen
both hosts draw (`options_draws_for`) has no row that opens a sub-screen, and
`engine-core`'s `OptionsSession` carries no binding-edit state for one to
drive. Closing it means growing that row and that state, not adding a draw
call.
"""

# `sprite_draws_for` used to be waived here as "a generic anchor-translate
# helper ... not a screen". That prose was the right reading and the wrong
# instrument: a waiver says "this gap is acceptable", and there was no gap -
# the function was never a screen to begin with. The checker now classifies on
# the whole signature rather than the return type alone (draw records IN means
# a transform over a draw list, not a projection of a model), so the surface
# no longer contains it and there is nothing left to waive.

[[waiver]]
builder = "records_screen_draws_for"
kind = "web_missing"
reason = """
The retail world-map Records screen renderer (`FUN_801ED710`). The state
behind it is host-agnostic - the dev-menu model is `engine-core`'s
`dev_menu_host` and the save-block-to-record rebase is this crate's
`RecordCounters` - so the missing piece is not a model. It is the **gate**.

The blocking capability, named precisely: a **process-scoped opt-in**. The
records page is a row of the retail developer menu, and the native window
mounts that whole surface behind `std::env::var_os("LEGAIA_DEV_MENU")`
(`window/dev_menu.rs`), which is set by whoever launches the binary and
reaches nobody else. A public web page has no such person. Every browser-side
equivalent is either link-shareable (a query parameter, a hash, a stored flag)
or discoverable in the shipped bundle (a key chord), so mounting the surface
there ships a state-editing debug console to every visitor - a different
security posture, not the same screen ported.

The play page does host the overworld walk (`enter_world_map_scene`); what it
deliberately does not host is the dev-menu surface this page is a row of. The
only close that does not move the gate is a **player-facing** records screen,
which is new design rather than a port: retail reaches these counters through
the developer menu and nowhere else this project has pinned.
"""

[[waiver]]
builder = "dev_menu_list_draws_for"
kind = "web_missing"
reason = """
The world-map dev-menu list renderer (`FUN_801EAD98` row-loop geometry), the
list sibling of `records_screen_draws_for` above and behind the same
process-scoped `LEGAIA_DEV_MENU` gate in `window/dev_menu.rs`. Same blocking
capability, and sharper for this one: the records page only *reads*, while
this list's rows **edit** live state (map id, encounter rate, character
parameters, event flags - `engine-core::dev_menu_host`). A browser mount
therefore hands every visitor a cheat console, not just a stats page. The
engine model compiles on both targets; what does not exist in a browser tab
is an opt-in only the person running the program can take.
"""


# The shop's four retail descriptor windows - 33 (vendor plate), 32 (purse),
# 34 (item info), 37 (sell quantity) - were each waived here on the premise
# that "the browser play page has no shop host: nothing in
# `crates/web-viewer/src` opens a `ShopSession` or drains
# `take_pending_field_shop`". That premise was false against the tree it
# claimed to describe: `web-viewer/src/play_shop.rs` drains
# `take_pending_field_shop` in `poll_field_shop`, `runtime.rs` calls it every
# `tick_frame`, and `site/js/play-app.js` drives the session through
# `play_shop_is_open` / `play_shop_input` / `play_overlay_draws_json`. The
# waivers were undone work wearing the language of an exemption, which is the
# one failure mode this file exists to prevent - the checker validates a
# waiver's BUCKET against the source but cannot read its prose, so a false
# reason survives every re-derivation. All four now paint on the web host off
# the same `painter_at` dispatch and the same disc-parsed rects.

[[waiver]]
builder = "char_prompt_draws_for"
kind = "orphan"
reason = """
Window id 7 (`FUN_801DCCB4`). The `renderer_va` dispatch resolves it, so that
is no longer the blocker; the blocker is content plus a screen. The prompt is
a scratch string at `0x801E46E4` whose byte `+1` retail overwrites with
`record[0x13D + DAT_8007BB78]` - the disassembly scales `DAT_8007BB70` by the
`0x414` character-record stride and adds `DAT_8007BB78` as a plain byte
offset off the `0x80084708` record base. No host knows what that field holds
(it is not the name, whose field is `+0x2A7`), and which flow opens window 7
is unknown: the save/load confirm both hosts draw is `ui_title_save`, a
different window family.
"""

[[waiver]]
builder = "amount_prompt_draws_for"
kind = "web_missing"
reason = """
Window id 31 (`FUN_801DCE20`), the **Point Card toast**. This was waived as an
orphan blocked on "a shop-flow re-plumb": no live counter on `World`, and no
toast beat in the hosts' quantity flow. Both halves are built. `World` carries
the `point_card` bank (retail `_DAT_800845B4`) with `point_card_held` /
`credit_point_card` beside it, `MenuRuntime` runs the accrual on its
`ShopConfirm` buy commit and holds `point_card_toast` until a confirm / cancel
press, and the native shop host paints this window off the disc-parsed rect
while the toast is up (`window/shop_windows.rs`).

Which window the beat opens is disc-sourced, not inferred: both retail buy
commits hand the widget VM a script whose entire body is `01 1F` plus the
terminator - "open window `0x1F`" - `0x801E4EDC` from the quantity commit
(`FUN_801DB7F4` case 2) and `0x801E4EA8` from the recipient picker
(`FUN_801DB380`).

What is left is one call on the browser play page: `play_shop.rs` already
resolves the shop's other four descriptor windows through `ui::painter_at`, so
the addition is the same shape - resolve id 31 as `AmountPrompt` while
`MenuRuntime::point_card_toast()` is `Some`, and feed the painter the heading,
`World::point_card`, and the unit label. Delete this waiver with that call.
"""

[[waiver]]
builder = "item_points_panel_draws"
kind = "web_missing"
reason = """
The shared item-info panel's **Point Card arm** (`FUN_801D0F1C` at
`0x801d0fd0`): when the staged item id is `0xFE`, retail replaces the panel's
accessory-passive block with a "Points Left" label and the 8-digit
`_DAT_800845B4` bank, then jumps to the routine's tail. It is a separate
builder rather than a branch inside `items_screen_draws_for` because retail
reaches it by a branch that skips that routine's remaining body, and because
the bank is world state the screen model does not carry - the id-`0xFE` test
is on `engine-core`'s `ItemsInfoModel::is_point_card`, the number is
`World::point_card`.

Native draws it (`window/menu_draws.rs`, on the Items screen). The browser play
page builds the same screen in `play_menu.rs` from the same `ItemsInfoModel`,
so the addition is the mirror of the native one: when `info.is_point_card`,
append `ui::item_points_panel_draws(font, info_pen, world.point_card)` after
`items_screen_draws_for`. Delete this waiver with that call.
"""

[[waiver]]
builder = "count_panel_draws_for"
kind = "orphan"
reason = """
Window id 24 (`FUN_801DCC20`): a two-digit count in the accent pen over a
reserved sub-rect, guarded on the staged item id. Dispatch-resolved. Two
things still block it. The painter is only the **delta**: the renderer's
gated body opens with `jal 0x801D0F1C`, the shared item-info panel window
17's `FUN_801DCB60` also calls, so a host adopting window 24 draws the info
panel into the same rect first. And window 24's rect `(14, 108, 144, 40)` is
byte-identical to window 17's, so the two are the same box in different
screens - which screen opens 24 rather than 17 is unknown.
"""

[[waiver]]
builder = "choice_panel_draws_for"
kind = "orphan"
reason = """
Window id 46 (`FUN_801D603C`): one heading over a two-row choice group whose
markers come from the `DAT_801E46D0` branch chain. Dispatch-resolved, so what
remains is not a mechanism.

What must exist first is a **two-row choice screen whose state is the
`DAT_801E46D0` flags word**. The engine has neither half. The options screen
both hosts draw is `options_draws_for` - a multi-row label/value list fed from
the config sub-session's own rows, not a two-choice group - so adopting this
window replaces that screen's layout wholesale rather than filling a hole in
it. And no engine state models the flags word: `confirm_prompt_draws` takes no
selection at all, `confirm_dialog_text_draws_for` takes a plain 0/1 cursor, so
nothing stages the `0x4000` suppress or `0x2000` mid-change arms and a host
wiring this today would exercise one of the three marker arms and leave the
other two unreachable. The branch chain itself is unit-tested here.
"""

[[waiver]]
builder = "two_line_choice_panel_draws_for"
