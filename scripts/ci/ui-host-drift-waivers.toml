open script does not list window 36. The mask rule (`equip_row_enabled`) is
unit-tested independently.
"""

[[waiver]]
builder = "compare_panel_draws_for"
kind = "orphan"
reason = """
The two stat-compare window painters (menu-overlay window descriptors 25 /
`FUN_801D1290` and 41 / `FUN_801D4C28`), rendered from a shared field list.
The `renderer_va` dispatch resolves both, so the mechanism is no longer the
gap - the gap is a host screen that opens those windows. The engine's equip
flow (`engine-core::equip_session`) draws the capture-pinned pause equip
window set (ids 2 / 21 / 22 / 23), which contains neither: window 25's rect
`(14, 40, 144, 52)` overlaps the party window 21 it would have to displace,
and `EquipSession` produces no party-wide preview at all (single-character by
construction), which is exactly what window 41 prints. Both renderers sit in
the shop-family VA band and read the same staged-id word `DAT_801E46B0` the
shop panels use, so the screen that opens them is most likely the
equipment-purchase path - which is not ported. Wiring needs that flow plus a
party-wide preview in `engine-core`, not a draw call.
"""
