# --- kernel pairing: the same step under two names -------------------------

[[frame_kernel]]
native = "apply_world_clut_fx"
web = "step_field_vram_fx"
reason = "Both drain the world's banked CLUT-cell effects and ambient palette cyclers against the host's CPU VRAM through the same four engine calls (`step_ambient_fx`, `step_clut_fx`, `apply_script_vram_moves`, `apply_vram_rect_copies`)."

[[frame_kernel]]
native = "drain_and_route_field_events"
web = "drain_and_route_field_events_web"
reason = "The same drain of `World::pending_field_events`; the `_web` suffix is the browser's copy, not a different step."

[[frame_kernel]]
native = "drain_and_log_battle_events"
web = "tick_battle_presentation"
reason = "Both fold the battle SM's events into world state and refresh the HUD rows through `sync_battle_hud_rows`. They are not equal - the native side also drains the shout / XA / effect-spawn cue lanes - but they are one step in each host's frame path, and the cue-lane difference is tier 3's question, not this tier's."

[[frame_kernel]]
native = "tick_minigame_extras"
web = "tick_minigame_ui"
reason = "Each host's one per-frame minigame step. What each reaches inside it is measured by the `[[frame_content]]` row for this pair; the sub-step table is host-drift.md's `The minigame side-channel step is paired; its contents are not`."

[[frame_kernel]]
native = "drain_anim_cues"
web = "drive_npc_clips"
reason = "Each host's per-tick ANIMATE cue step, both a wrapper over the one engine kernel `World::drain_field_anim_cues` (op-`0x4B` NPC re-targets resolved against the slot's bundle, `A2 F8` player gestures pushed onto the world's clip player). The page's step also advances its NPC clip players one tick; the native window advances its own in the draw pass by the ticks the redraw ran, because its players key the pose cache the draw reads. The native drain used to run inside that draw pass and only in `SceneMode::Field`."

# --- kernel pairing: one host's frame path only ----------------------------

[[frame_kernel]]
host = "native"
kernel = "advance_ocean_animation"
host_only = true
reason = "The CLUT-walk shimmer (the overworld ocean and the field water / waterfall scenes), stepped through the one engine kernel `legaia_engine_core::clut_walk_anim::ClutWalkAnim::game_tick`. The page steps the same kernel inside `step_field_vram_fx` (its `FieldSceneAnim::tick`) against its own VRAM copy, so it needs no separately named step."

[[frame_kernel]]
host = "native"
