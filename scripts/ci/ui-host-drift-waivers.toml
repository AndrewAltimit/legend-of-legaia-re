[[waiver]]
builder = "title_tab_draws_for"
kind = "web_missing"
reason = """
Native draws it. The `renderer_va` dispatch
(`engine-ui::ui_menu_window_dispatch`) resolves all six plain-title-tab
renderers - the five pause tabs `FUN_801DCA0C` / `CA50` / `CA94` / `CAD8` /
`CB1C` and window 43's `FUN_801DCFE4`, which are the same 17 instructions
with a different string pointer - to this one painter, and
`window/menu_draws.rs::menu_tab_title_draws` asks the descriptor which
renderer it names instead of trusting the id. So every pause-screen tab the
native window draws now goes through this painter at its disc-parsed rect.

The browser play page draws its tabs through `tab_label_draws`, the pen-only
alias that delegates here, and has no window-table walk to dispatch from:
`crates/web-viewer/src` never parses `menu_windows`. Closing this is the web
half of the same dispatch - the page needs the parsed table plus the
descriptor lookup, not new geometry.
"""

[[waiver]]
builder = "record_title_tab_draws_for"
kind = "web_missing"
reason = """
Native draws it as the shop's **vendor-name plate** (window 33,
`FUN_801DCF14`), dispatched on `renderer_va` in `window/shop_windows.rs`.
The text resolves exactly as retail's does: `_DAT_8007B450` points at the
armed op-`0x49` opcode's sub-op byte, the renderer starts the string at
`record + record[2] + 3`, and for a shop record (`[count][count x id][name]`)
that lands one past the last item id - the trailing ASCII name
`legaia_asset::shop_stock` decodes. The host recovers it by matching the live
session's stock against `World::scene_shops`.

The browser play page has no shop host: nothing in `crates/web-viewer/src`
opens a `ShopSession` or drains `take_pending_field_shop`, so there is no
vendor for a plate to name.
"""

[[waiver]]
builder = "counter_panel_draws_for"
kind = "web_missing"
reason = """
Native draws it as the shop's **purse** (window 32, `FUN_801DCF84`), at the
disc-parsed rect, in `window/shop_windows.rs`. Both the pictogram id and
which live total the digits print come out of the dispatch
(`CounterSource`), because retail's two counter renderers are one routine
with two literals changed: window 32 reads party gold `_DAT_8008459C`
(engine `World::money`), window 45 the casino coin bank `_DAT_800845A4`
(engine `World::casino_coins`). The engine shop panel drops its own gold
footer whenever this window paints, so the readout is not doubled.

Window 45 stays unopened on both hosts - its content is pinned but the screen
that opens it is not.

The browser play page has no shop host to hang the purse off (see
`record_title_tab_draws_for`).
"""

[[waiver]]
builder = "char_prompt_draws_for"
kind = "orphan"
reason = """
Window id 7 (`FUN_801DCCB4`). The `renderer_va` dispatch resolves it, so that
is no longer the blocker; the blocker is content plus a screen. The prompt is
a scratch string at `0x801E46E4` whose byte `+1` retail overwrites with
`record[0x13D + DAT_8007BB78]` - the disassembly scales `DAT_8007BB70` by the
`0x414` character-record stride and adds `DAT_8007BB78` as a plain byte
offset off the `0x80084708` record base. No host knows what that field holds
(it is not the name, whose field is `+0x2A7`), and which flow opens window 7
is unknown: the save/load confirm both hosts draw is `ui_title_save`, a
different window family.
"""

