# --- kernel pairing: the same step under two names -------------------------

[[frame_kernel]]
native = "apply_world_clut_fx"
web = "step_field_vram_fx"
reason = "Both drain the world's banked CLUT-cell effects and ambient palette cyclers against the host's CPU VRAM through the one frame-tail kernel `World::step_field_vram_effects`."

[[frame_kernel]]
native = "drain_and_log_battle_events"
web = "tick_battle_presentation"
reason = "Each host's battle-event step: both drain the tick's battle events (observation only - `World::live_battle_tick` owns the gameplay fold), route the tick's battle audio through the one session step `BootSession::route_battle_audio`, route the effect-script spawns through `World::route_battle_effect_spawns` and refresh the HUD rows through `sync_battle_hud_rows`. What each reaches beyond that is the `[[frame_content]]` row for this pair."

[[frame_kernel]]
native = "tick_minigame_extras"
web = "tick_minigame_ui"
reason = "Each host's one per-frame minigame step. What each reaches inside it is measured by the `[[frame_content]]` row for this pair; the sub-step table is host-drift.md's `The minigame side-channel step is paired; its contents are not`."

[[frame_kernel]]
native = "drain_anim_cues"
web = "drive_npc_clips"
reason = "Each host's per-tick ANIMATE cue step, both a wrapper over the one engine kernel `World::drain_field_anim_cues` (op-`0x4B` NPC re-targets resolved against the slot's bundle, `A2 F8` player gestures pushed onto the world's clip player). Both then step their NPC clip players one tick through `engine-session`'s `step_npc_clip_players`; the window's draw pass only reads the playheads."

# --- kernel pairing: one host's frame path only ----------------------------

[[frame_kernel]]
host = "native"
kernel = "advance_ocean_animation"
host_only = true
reason = "The CLUT-walk shimmer (the overworld ocean and the field water / waterfall scenes), stepped through the one engine kernel `legaia_engine_scene::clut_walk_anim::ClutWalkAnim::game_tick`. The page steps the same kernel inside `step_field_vram_fx` (its `FieldSceneAnim::tick`) against its own VRAM copy, so it needs no separately named step."

[[frame_kernel]]
host = "native"
kernel = "check_battle_vram_residency"
host_only = true
reason = "A native-only repair: the window uploads battle textures into a wgpu-resident VRAM image, and any path that re-uploads over them has to be caught and undone. The page re-reads `field_vram_bytes` whenever `field_vram_take_dirty` reports a change, so its equivalent is a pull, not a per-frame check."

[[frame_kernel]]
host = "native"
kernel = "maybe_install_demo_tile_board"
host_only = true
reason = "The window's `LEGAIA_TILE_BOARD_DEMO=1` env trigger, which a browser cannot set. The page reaches the same `World::try_install_tile_board` bytecode from its own explicit control (`play_tile_board.rs`), so the capability is on both hosts and only the trigger is native."

[[frame_kernel]]
host = "native"
kernel = "rebind_live_npc_models"
host_only = true
reason = "The window has to upload a re-bound mesh before it can draw it, so the swap is a per-frame step. The page resolves the same `World::field_npc_live_model` at read time, from JS, when it asks for the mesh."

[[frame_kernel]]
host = "native"
kernel = "sync_battle_render"
host_only = true
reason = "The Field <-> Battle mode-edge latch (battle load / teardown: meshes and VRAM; the party's clips, art banks and art records are installed by the engine's own `SceneHost::tick`). The page latches the same edge as the first step of its `tick_battle_presentation` (play_battle.rs), per sim tick, so it has no separately named step; the window names it because the load also rebuilds wgpu buffers. It is called inside the tick loop right after the scene tick - the display-frame-only call left up to three battle ticks of a catch-up frame without party clips - and once more after the loop, where it is a no-op unless no tick ran."

[[frame_kernel]]
host = "native"
kernel = "sync_dialog_panel"
host_only = true
reason = "The window's own typed-out dialog panel, used only while `World::toggles.use_vm_dialogue` is off - the pre-field-VM fallback. The page sets `use_vm_dialogue` on at scene setup and has no such fallback; both hosts draw the production path from a per-frame snapshot of the world's dialog state, which needs no per-frame host step."

[[frame_kernel]]
host = "native"
kernel = "sync_text_balloon"
host_only = true
reason = "Commits the `4C E1` balloon's measured width while `self` is still mutable, because the window's draw passes take `&self`. Both hosts commit through the one kernel `legaia_engine_screens::field_messages::commit_text_balloon_measure`: the window here, the page at the head of its draw export (`play_dialog_draws_json`), which has no such split. Both then draw the balloon through the shared `field_message_frame`."

[[frame_kernel]]
host = "web"
kernel = "run_pending_bgm_handoff"
host_only = true
reason = "The page's title -> load score hand-off is armed by the card-Load poll and run by the scene entry that follows it; this per-tick call only catches an entry the page declined, and is a no-op on every other frame. The native window has no gap to catch: its save-commit path enters, loads and hands the score over within one call chain."

[[frame_kernel]]
host = "web"
kernel = "service_cutscene_fmv"
host_only = true
reason = "The page's FMV beat service. The native window runs the same beat outside its per-tick body, in a step of `handle_redraw` (`service_windowed_cutscene`: `try_start_windowed_cutscene` + `apply_pending_fmv_handoff`), where it can hold the whole frame for the video."

[[frame_kernel]]
host = "web"
kernel = "tick_battle_intro"
host_only = true
reason = "Caches the frame's screen-prim layers (the field-to-battle transition and the rest) for the page's pass; the native window builds the same prims in its draw section, where it already holds the frame's geometry. One step inside it is simulation, not geometry: the fog pool's render step (`BootSession::step_field_fog`), which ages the pool the next tick's spawner reads. That runs once per sim tick on both hosts - here, and natively in `tick_frame_tail_effects` - and the native draw only wraps the quads it left."

[[frame_kernel]]
host = "web"
kernel = "tick_passive_hud"
host_only = true
reason = "The passive-ability badge column's projection, one kernel on both hosts (`legaia_engine_screens::field_screens::passive_hud_icons`, drawn through `passive_hud_text_draws`). The page's draw pass has no camera and no `&mut self`, so the page runs it on the tick and caches the icons; the native window runs it inside `passive_hud_draws`, which is handed the frame's camera matrix."

[[frame_kernel]]
host = "web"
kernel = "audio_director"
host_only = true
reason = "Builds the page's audio director on first use (off wasm; on wasm once the user has enabled sound) and stages its resident banks, so the session's tick has a director to route into. The native session opens its output and stages the same banks once, at boot (`BootSession::from_host`)."

# --- kernel pairing: two paired kernels, two engine call sets (tier 12) ---
# `[[frame_content]]` rows declare a PAIRED frame kernel whose two bodies
# reach different engine functions. The two lists are the ratchet: when the
# difference moves, the row goes stale and fails, which is what stops a
# waiver from outliving the thing it described. A row is not a licence for
# the difference - it is a statement of where the other host does the work.

[[frame_content]]
native = "drain_and_log_battle_events"
web = "tick_battle_presentation"
native_only = ["battle_stage_layers"]
web_only = ["armed", "battle_monster_slots", "battle_party_forms", "ensure_battle_party_forms", "entry_bytes_extended", "monster_tex_slots_used", "release_summon_seat", "replay", "reset", "stage_battle_world", "tmd_bytes", "upload_flame_atlas_into_vram"]
reason = """
The presentation itself is one session step on both hosts
(`BootSession::step_battle_presentation`: the battle audio, the strike
popups, the per-hit drain, the effect-script spawn routing, the HUD row and
status fold, the popup and banner ages), and the battle VRAM re-stamps after
it (`battle_vram::stamp_battle_faces` / `step_battle_vram_edits`, after the
fold that arms the status CLUT latch). Both are pinned by SIM_PAIRS rows, so
they list on neither side.

Native-only `battle_stage_layers` is the window's mid-fight stage-shell
rebuild (`tick_battle_stage_shell`, run after the re-stamps): the page's
twin (`tick_battle_stage_shell_web`) re-reads the same
`SceneHost::battle_stage_object_indices` and rebuilds through its own mesh
path.

The web-only list is where the code sits, not whether the host does it. The
page folds its whole battle presentation frame into this one named step: the
battle edge (`battle_presentation::battle_mode_edge` and its two edge steps,
then `battle_stage::stage_battle_world`, pinned by SIM_PAIRS rows), the atlas
upload, the party forms' read-back, and the status CLUT reset its VRAM
channel runs on any tick outside a built battle (`armed` / `reset`, a
superset of the shared exit-edge reset). The native window runs its edge in
`sync_battle_render` rather than inside the kernel its frame path names.
Checked name by name: every presentation call has a call site in the native
sources. The party forms are built by `SceneHost::ensure_battle_party_forms`
from `SceneHost::tick` for every session, and both hosts call it again before
their render build and replay its VRAM writes with `replay`.
`entry_bytes_extended` is the page reading the monster archive off PROT
inside this step; the window reads it from its cached copy.
"""

[[frame_content]]
native = "drain_anim_cues"
web = "drive_npc_clips"
native_only = []
web_only = ["take_npc_morph_dirty"]
reason = "The cue drain is one engine kernel on both hosts, and so is the tick's step of the NPC clip players that follows it (`engine-session`'s `step_npc_clip_players`: the per-tick `World::field_npc_clips_advance` gate, then each slot posed off the world-owned cursor or free-run one frame), so neither lists on either side. `take_npc_morph_dirty` (op-`0x4B` NPC morphs) is drained here on the page into a per-slot generation, and natively in `take_npc_morph_rebuilds` ahead of the redraw's renderer borrow, where it evicts that same pose cache; both stage through `World::npc_morphed_tmd`."

[[frame_content]]
native = "tick_field_party_hud"
web = "tick_field_party_hud"
native_only = ["battle_cam_pose", "cap_countdown", "field_hud_view_mode", "frame", "frame_vp", "hud_countdown_cap", "hud_idle_frames", "hud_phase_hold", "is_open", "rearm", "scale"]
web_only = []
reason = "The step itself is one pair of shared calls on both hosts (`legaia_engine_screens::field_screens::field_party_hud_rearm` then `field_party_hud_tick`), so neither lists. `field_hud_view_mode` / `hud_idle_frames` / `hud_phase_hold` / `rearm` / `hud_countdown_cap` / `cap_countdown` are the native screenshot harness only: the retail-compare image channel phase-aligns the idle countdown to a retail state (`LEGAIA_HUD_COUNTDOWN`), a capture aid the page has no harness for. The native window projects the lead through the host seam's frame (`HostView::frame`, the resolver) + frame_vp inside the step; the page draw pass holds no camera and no mutable self, so the projection is its own export, play_camera::play_field_hud_project (`HostView::follow_frame`), which the page calls from its draw section each display frame (so a tick reads the previous frame's answer) - same resolver, same frame_vp, same 0x80 torso offset, and with the CUTSCENE arm suppressed the way the native step suppresses it. It used to be JS math over this frame draw VP, so a scripted shot decided where the readout sat. A lead that does not project reaches the kernel as `None` on both hosts. Both hosts read the suppress pad off World::input."

[[frame_content]]
native = "tick_minigame_extras"
web = "tick_minigame_ui"
native_only = ["build", "build_filtered_vram_mesh_lit", "chrome_frame", "entry_bytes", "frame", "frame0_bone_offsets", "from_venue", "glyph_u", "has_assets", "hud_vram_rects", "parse_sprite_table", "place_point", "rotate", "set_assets", "stage_dance_hud_vram", "still_sheet_rgba", "walk_heightfield"]
web_only = ["apply", "course", "last_result", "of_mode", "opponent_roster", "phase", "prot_dat_raw_bytes", "round", "with_system_ui"]
reason = """
Everything the step does to the world or the audio director is a session step
both hosts call, so it lists on neither side: the minigame and Baka duel cue
queues (`enqueue_minigame_sfx_cues`, `enqueue_baka_sfx_cues`), the dance
auto-end and venue globals (`step_dance_tail`), the dome hub's announcer line
and tally voices (`sound_muscle_hub`) and the Baka chrome's announcer line
(`sound_baka_announcer`). The fishing venue actors are one engine kernel too
(`fishing_venue::tick_fishing_venue_on_host` plus `VenueCameraWrites::apply`).
What remains is each host's own presentation, and two name collisions.

Name collisions: `apply` lists web-only because the native window has host
fns of that name, and `frame` (`DanceCastSurface::frame`, which both hosts
pose the dance cast through) lists native-only because the page exports a host
fn of that name; the walk excludes both by name.

Native-only, the window uploading to wgpu inside this step what the page bakes
elsewhere. `build` / `build_filtered_vram_mesh_lit` / `frame0_bone_offsets` /
`place_point` / `rotate` / `walk_heightfield` upload the dance venue
(`DanceVenue::build`) on the staging edge; the pages bake the same build,
placed through the same `EnvDraw::place_point` (a SIM_PAIRS row), once at disc
load (`load_dance_bodies`). `entry_bytes` / `from_venue` / `has_assets` /
`set_assets` hand the floor's bodies to the engine cast surface on that edge;
the page installs the same assets in its `play_mg_dance_scene_frame` export.
`hud_vram_rects` / `stage_dance_hud_vram` are the window's dance HUD page
residency; the page stages the same rects through `sync_dance_hud_residency`.
`parse_sprite_table` / `still_sheet_rgba` are the Muscle Dome hub assets and
ringside still, which the page loads in its `play_mg_muscle_hub_*` exports.
`chrome_frame` / `glyph_u`: the window resolves each Baka chrome glyph draw's
stamped cell rect here and carries it beside the draw; the browser hosts
consume the same chrome frame in their draw exports.

Web-only, the page's own read-outs. `course` / `round` are its staged-opponent
read for the dome mesh (`enter_muscle_ui`), `opponent_roster` the Baka one,
and `phase` / `last_result` the slot payout-edge detector feeding its
JavaScript marquee caption. `of_mode` is `StatusGame::of_mode`
(engine-minigame-scenes), which the page reads to pick its minigame screen;
the window's minigame dispatch keys on the world's mode directly. `prot_dat_raw_bytes` / `with_system_ui` are the
page's minigame bundle taking the slot machine's resident system-UI sheet off
the real PROT.DAT; the window uploads the same sheet through
`SlotCabinetAssets::with_system_ui` when it first decodes the machine
(`refresh_slot_cabinet_gpu`).
"""

# --- boot installs: a World table the native boot installs (tier 13) ---
# `[[boot_install]]` rows name a `world.install_*` / `world.set_*` call in
# the native boot (crates/engine-session/src/session/) that no shipped crates/web-viewer source
# makes. A row goes stale (and fails) when the page starts calling it or the
# native boot stops.

[[boot_install]]
method = "set_active_scene_label"
reason = "Not a table install: the native `--world-map` launcher's failure arm (`BootSession::enter_world_map_live` when `enter_world_map_scene` errors) labels the world by hand so the window still has a camera. The page has no such launcher arm - its scene entries go through `SceneHost::enter_field_scene` / `enter_world_map_scene`, which set the label themselves."

