# --- Widened surface: engine-ui's intermediate draw records ------------------
#
# The checker's builder surface used to stop at `TextDraw` / `SpriteDraw`. It
# now also counts the crate's intermediate records - `HudDraw`, `HudQuad`,
# `DigitCell`, `BarFrame`, `ComparePanelField` - because a screen that stops at
# one of those is still a screen, and leaving them off made two whole chains
# (the fishing HUD, window 25's compare panel) invisible while every other
# pause screen was covered. Thirteen builders arrived with the widening. Ten
# were already reached on both hosts through methods the call graph now walks.
# Of the remaining three gaps, the PROT 0977 arena-hub quad emitters
# (`hud_quad_centred` / `hud_quad_corner` / `decimal_quads`) are now wired on
# BOTH hosts - `minigames_muscle::muscle_hub_quads_json` runs them over the
