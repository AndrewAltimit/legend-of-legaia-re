builder = "label_list_draws_for"
kind = "orphan"
reason = """
Window id 6 (`FUN_801D6360`): six stacked labels with the only cursor in this
block anchored to the window *extent*. Waived as "no host opens window 6 and
which flow does is unknown" - the flow is now known. Script `0x801E4BE0` is its
only opener, from sub-screen `4` (`FUN_801DD1B8`), which opens the window,
waits for a confirm / cancel press and returns to the pause root. That makes it
a **notice panel**, which is what the corner advance hand is for.
`FUN_801DC6B4` selects sub-screen `4` as the menu's entry screen when the
entry-context byte is `0x0D` (`0x801dc8d0..0x801dc8e4`) - the same kind whose
exit confirm is window 5 above.

Same blocking capability as window 5, then: the entry-context kind is modeled
(`World::menu_entry_context_kind`, compared against `0x0D` at the pause root
on both hosts) but no producer can yield `0x0D` - the op-`0x49` park never
records its armed sub-op. The six labels are content that record owns, so a
host has neither the trigger nor the text.
"""

