# Waivers for scripts/ci/check-ui-host-drift.py.
#
# Each entry records a shared `engine-ui` draw builder that one host reaches
# and the other does not, plus WHY that is acceptable today. "Reaches" is
# transitive: a host that draws a builder draws whatever that builder composes,
# so "no host names this function" is not by itself a reason to waive - check
# whether a drawn builder folds it in first. The checker validates every waiver
# against the real source, in both directions:
#
#   * a builder that no longer exists          -> stale waiver, CI fails
#   * a builder now wired on both hosts        -> stale waiver, CI fails
#   * a `web_missing` waiver whose builder is
#     no longer native-only                    -> wrong bucket, CI fails
#   * an empty `reason`                        -> CI fails
#
# So this file cannot quietly become fiction: it only passes while it
# describes the actual state of the two hosts. Closing a gap means deleting
# the waiver, and CI tells you when you forgot.
#
# `kind` is one of:
#   "web_missing" - native calls it, the browser play page does not
#   "orphan"      - neither host calls it

[[waiver]]
builder = "battle_hud_draws_for"
kind = "web_missing"
reason = """
Native draws it: `engine-shell/.../window/hud.rs` calls this for every
`SceneMode::Battle` frame, fed by `window/battle.rs::sync_battle_hud_rows`,
which folds the live actor table into the `BattleHud` model each tick. The
window's own hand-rolled HP rows are gone, so this is the only battle HUD the
native host has - and the retail HP / MP colour law (`hp_bar_color_index` /
`mp_bar_color_index`, FUN_800349EC / FUN_80035EA8) reaches a surface.

The browser play page has no battle host to draw into. It never arms
encounters - none of `tick_encounter`, `arm_scripted_encounter`,
`install_encounter_*` or `drain_encounter_formation` is referenced anywhere in
`crates/web-viewer/src`, and no code path there sets `SceneMode::Battle` - and
it exports no battle render, camera or command-menu path. There is also no
battle HUD in the page's JS: `site/js/play-app.js` mentions battle only in a
comment about Start being inert. Wiring the HUD would draw a readout of state
the page never produces.

Stated plainly, because the honest label matters when the rest of this file
does describe capability gaps: this one is **undone work**, not something the
browser cannot do. Nothing about a battle host needs a process, a filesystem
or a native window - `engine-core` drives the whole encounter path on both
targets. The waiver stands because closing it is a battle-host port, an order
of magnitude past a draw call, and drawing an HP readout over a mode the page
never enters would be worse than the gap.
"""

[[waiver]]
builder = "encounter_banner_draws_for"
kind = "web_missing"
reason = """
Same root cause as the battle HUD: the browser page does not step encounters,
so no formation is ever drawn - an ENCOUNTER! banner with no battle behind it
would report a transition the page cannot perform. The native window draws it:
`sync_battle_render` arms the banner on every `Field -> Battle` mode edge with
the formation's catalog names, and `build_hud` renders it centred for the
battle's opening frames. Closing the web side is the same battle-host port the
`battle_hud_draws_for` waiver describes.
"""

# `dialog_box_draws_for` / `dialog_panel_draws_for` were waived here as
# orphans whose "honest resolution is deletion". They are deleted: no host
# rendered dialog through them (both hosts draw the `DialogSnapshot` path at
# the byte-pinned retail geometry), and their only references were unit tests
# in `engine-render/src/tests/`. The `DialogBoxLayout` / `DialogGlyphView` /
# `dialog_clut_color` support types went with them.

[[waiver]]
builder = "game_over_draws_for"
kind = "web_missing"
reason = """
Unreachable on BOTH hosts, and deliberately so - so read the `web_missing`
bucket as an artifact of the instrument, not a claim: the checker classifies on
whether a host's source *names* the builder, and the native window names it in
a `match` arm over a variant nothing constructs. Referenced is not reached, and
no textual gate can tell them apart.

The native window declares `BootUiState::GameOver` but never constructs it
(`window/boot_cutscene.rs` matches it at two sites; no `BootUiState::GameOver(`
constructor exists outside tests), because retail's trigger is
not pinned: the action-SM `0x5A` gate detects the wipe, but the battle-exit
selector never reads the wipe cause, and no static mode-0x12 writer exists on
the disc (see docs/subsystems/battle.md § party wipe). Worse, retail's game
over is not a menu at all - PROT 0902 carries one string and one unconditional
exit - so this builder's Continue/Retry/Quit rows are an engine invention.
Wiring either host would commit the port to behaviour nobody has observed.
Close it with a runtime probe, not by picking a trigger.
"""

[[waiver]]
builder = "key_rebind_draws_for"
kind = "orphan"
reason = """
Web-exempt by design, but unreached on native too. The browser page's bindings
are a JS keycode table (`site/js/play-app.js` PAD/BOOT_PAD) owned by the page,
not the engine, and a shared rebind screen would have to write a config the
browser has no place to persist. On native, rebinding today happens through the
`legaia-input.toml` config file and the `legaia-engine config set --binding`
subcommand; the in-engine screen this builder draws is not mounted in the
window's menu tree. Closing it is a native-only job: give the options menu a
rebind entry that opens this screen.
"""

# `sprite_draws_for` used to be waived here as "a generic anchor-translate
# helper ... not a screen". That prose was the right reading and the wrong
# instrument: a waiver says "this gap is acceptable", and there was no gap -
# the function was never a screen to begin with. The checker now classifies on
# the whole signature rather than the return type alone (draw records IN means
# a transform over a draw list, not a projection of a model), so the surface
# no longer contains it and there is nothing left to waive.

[[waiver]]
builder = "records_screen_draws_for"
kind = "web_missing"
reason = """
The retail world-map Records screen renderer (`FUN_801ED710`). The native
window draws it from the developer-menu host (`window/dev_menu.rs`), gated on
the `LEGAIA_DEV_MENU` **process environment variable** - the capability the web
host lacks. A browser tab has no process environment, so the gate that keeps
this surface off a player's screen has no equivalent there; a URL parameter or
a build flag would put a debug menu one shared link away from every visitor,
which is a different security posture, not the same screen ported. The engine
also reaches it through the world-map controller, which the play page does not
host at all.
"""

[[waiver]]
builder = "dev_menu_list_draws_for"
kind = "web_missing"
reason = """
The world-map dev-menu list renderer (`FUN_801EAD98` row-loop geometry), the
list sibling of `records_screen_draws_for` above and behind the same
`LEGAIA_DEV_MENU` process-environment gate in `window/dev_menu.rs`. Same
capability gap, same reasoning: the web host has no process environment to
gate a debug surface on, so shipping the screen there means shipping it to
every visitor.
"""


# The shop's four retail descriptor windows - 33 (vendor plate), 32 (purse),
# 34 (item info), 37 (sell quantity) - were each waived here on the premise
# that "the browser play page has no shop host: nothing in
# `crates/web-viewer/src` opens a `ShopSession` or drains
# `take_pending_field_shop`". That premise was false against the tree it
# claimed to describe: `web-viewer/src/play_shop.rs` drains
# `take_pending_field_shop` in `poll_field_shop`, `runtime.rs` calls it every
# `tick_frame`, and `site/js/play-app.js` drives the session through
# `play_shop_is_open` / `play_shop_input` / `play_overlay_draws_json`. The
# waivers were undone work wearing the language of an exemption, which is the
# one failure mode this file exists to prevent - the checker validates a
# waiver's BUCKET against the source but cannot read its prose, so a false
# reason survives every re-derivation. All four now paint on the web host off
# the same `painter_at` dispatch and the same disc-parsed rects.

[[waiver]]
builder = "char_prompt_draws_for"
kind = "orphan"
reason = """
Window id 7 (`FUN_801DCCB4`). The `renderer_va` dispatch resolves it, so that
is no longer the blocker; the blocker is content plus a screen. The prompt is
a scratch string at `0x801E46E4` whose byte `+1` retail overwrites with
`record[0x13D + DAT_8007BB78]` - the disassembly scales `DAT_8007BB70` by the
`0x414` character-record stride and adds `DAT_8007BB78` as a plain byte
offset off the `0x80084708` record base. No host knows what that field holds
(it is not the name, whose field is `+0x2A7`), and which flow opens window 7
is unknown: the save/load confirm both hosts draw is `ui_title_save`, a
different window family.
"""

[[waiver]]
builder = "amount_prompt_draws_for"
kind = "orphan"
reason = """
Window id 31 (`FUN_801DCE20`): heading, wide number field in the accent pen,
trailing unit label, corner cursor. Dispatch-resolved; what is missing is the
number. The renderer prints `_DAT_800845B4`, the **Point Card** counter the
retail buy handler credits before the gold debit (see
`docs/subsystems/shop.md`), and the engine models no Point Card at all -
`World` has `money` and `casino_coins` and nothing else this window could be
printing. Wiring it first means adding that counter to the shop session, an
`engine-core` change.
"""

[[waiver]]
builder = "count_panel_draws_for"
kind = "orphan"
reason = """
Window id 24 (`FUN_801DCC20`): a two-digit count in the accent pen over a
reserved sub-rect, guarded on the staged item id. Dispatch-resolved. Two
things still block it. The painter is only the **delta**: the renderer's
gated body opens with `jal 0x801D0F1C`, the shared item-info panel window
