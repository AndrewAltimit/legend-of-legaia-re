# --- kernel pairing: two paired kernels, two engine call sets (tier 12) ---
# `[[frame_content]]` rows declare a PAIRED frame kernel whose two bodies
# reach different engine functions. The two lists are the ratchet: when the
# difference moves, the row goes stale and fails, which is what stops a
# waiver from outliving the thing it described. A row is not a licence for
# the difference - it is a statement of where the other host does the work.

[[frame_content]]
native = "drain_and_log_battle_events"
web = "tick_battle_presentation"
native_only = []
web_only = ["action_id", "armed", "battle_monster_slots", "battle_stage_entry_for_scene", "build_targeted_with_options", "clear_popups", "current_frame", "drain_battle_clut_stages", "drive", "enqueue", "equipment", "far_colour_for_prot_index", "hybrid", "install_art_bank_records", "party_roster_slot", "play_xa_shout", "read_span_sectors", "reset", "scale", "set_actor_battle_action_clips", "set_actor_battle_animation", "set_actor_battle_art_bank", "shout", "slot", "stage_effect_clut", "system_ui_bundle", "tmd_bytes", "upload", "upload_battle_stage_tims_into_vram", "upload_flame_atlas_into_vram", "with_actors", "with_spu"]
reason = "The page folds its whole battle presentation frame into this one named step: stage and atlas upload, per-actor clip and art-bank staging, the CLUT stage drain, the shout XA request, and the popup retire. The native window does that same work, but spread across its draw section and window/battle.rs rather than inside the kernel its frame path names, so the difference is where the code sits and not whether the host does it. Checked name by name: thirty-one of the thirty-two have a call site in the native sources (most of them in window/battle.rs). The exception is packet_color::hybrid, which is not presentation work the window skips - it is the CPU-side per-vertex colour stream the page has to hand WebGL, and the wgpu renderer resolves the same packet colour in its fragment shader instead. The empty native-only side is the other half of the check: nothing the window reaches here is missing from the page."

[[frame_content]]
native = "tick_dev_menu"
web = "tick_dev_menu"
native_only = ["records_screen_draws_for"]
web_only = []
reason = "The dev menu Records page, built on opposite sides of the frame. Both hosts ship it - the page has `dev_records_draws` / `dev_records_model` behind the same Square toggle, pinned to the native model by a SIM_PAIRS row - and both resolve its rows through `records_screen_draws_for`. The native window caches its whole dev-menu draw list at tick time, so the builder sits inside this kernel; the page builds its list in the draw pass (`play_dev_menu_draws_json`), where it holds the surface size the stage transform needs. Same shape as the `tick_field_party_hud` row: one screen, one builder, two sides of the wasm boundary."

[[frame_content]]
native = "tick_field_party_hud"
web = "tick_field_party_hud"
native_only = ["frame_vp", "is_open", "pose", "resolve_field_camera", "scale"]
web_only = ["pad"]
reason = "One kernel with the projection on opposite sides of the wasm boundary. The native window projects the lead through resolve_field_camera + frame_vp inside the step; the page draw pass holds no camera and no mutable self, so the projection is its own export, play_camera::play_field_hud_project, which the page calls before the tick - same resolver, same frame_vp, same 0x80 torso offset, and with the CUTSCENE arm suppressed the way the native step suppresses it. It used to be JS math over this frame draw VP, so a scripted shot decided where the readout sat. `pad` sits on the page side only because the window reads the pad word off its own field instead of off World::input."

[[frame_content]]
native = "tick_minigame_extras"
web = "tick_minigame_ui"
native_only = ["camera", "field_map_index", "float_actor_tick", "glyph_u", "height_ramp", "hooked", "hud_vram_rects", "land", "lure_actor", "parse_sprite_table", "ripple_spawn", "spawn_burst", "spawn_ripple", "stage", "stage_dance_hud_vram", "still_sheet_rgba", "sway_vector", "venue_camera_reset", "x"]
web_only = ["course", "drain_minigame_sfx_cues", "enqueue", "exit_dance", "last_result", "opponent_roster", "play_xa_shout", "read_span_sectors", "settle_muscle_contest", "take_cues", "tick_time_meter", "upload", "with_spu"]
reason = "The sub-step table in docs/tooling/host-drift.md is this row in long form. Native-only: the fishing VENUE actors (wander, line, lure probe, floor solve, camera publish, sway), which the browser hosts do not install - the ripple and burst spawns are those actors feeding the shared effect pool - and `glyph_u`, the window resolving the Baka chrome's glyph paging against its parsed widget table (the page reads the same chrome frame and prints it through the shared label kernel). Web-only `opponent_roster`: the page follows a rung the cabinet seats by rebuilding its Baka 3D scene; the window has no Baka scene to rebuild. `play_xa_shout` / `read_span_sectors` are the page's CD-XA clip path under the Baka chrome's and the dome hub's announcer lines - the window plays the same lines through `AudioBgmDirector::play_xa_clip`, an output this kernel does not name. Web-only: the page drain and settle spellings plus the dome time meter, each of which the window steps as its own named kernel, and the SPU pair (upload, with_spu) behind the dome tally voice - the native window reaches the identical key-on through its own AudioBgmDirector, which is an output this kernel does not name. `stage` and `still_sheet_rgba` are the Muscle Dome ringside still: the INTERVAL screen's stage the re-entered hub's backdrop rides, and the still's sheet bake inside the window's hub-asset load. The page runs the same stage read in its own `tick_muscle_hub` and bakes the same sheet through `still_sheet_rgba` in its `play_mg_muscle_hub_sheet_rgba` export - one kernel each, on the other side of the wasm boundary."
