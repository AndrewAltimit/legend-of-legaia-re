# Per-image verdicts for VA-aliased addresses.
#
# `port-catalog-ignore.toml` keys a verdict by bare VA, so where several
# images hold different code at one address it can only say "this VA is not
# one port site" (`[va_aliased_overlay_local]` / `[worklist_va_aliased]`) -
# true of the address, and silent about each image's routine. This file says
# what the routine is in ONE image. It is read only by the per-image port
# table (`scripts/ci/update-progress-metrics.py`, see
# docs/tooling/disc-coverage.md#per-image-port-status); the whole-project
# catalog keeps reading the ignore list.
#
# One table per image label (`crates/asset/data/static-overlays.toml`), rows
#   "<addr>" = ["<category>", "<reason>"]
# with <category> one of the ignore list's sections - which decides how the
# row counts (not a function / no behaviour / native). The reason must come
# from that image's own bytes at its own base, not from a dump printed at the
# VA by another image.

[field]
"801d32bc" = ["worklist_interior", "Not an entry in PROT 0897: the field image's own bytes at this VA open mid-body (`mflo t0` after `slt v0,v1,s0`) with no prologue. The ported routine at this VA is PROT 0898's (its tag says so); the 0897 dump here is a fragment."]
"801d3444" = ["worklist_interior", "Not an entry in PROT 0897: the field image's own bytes at this VA open mid-body (`nop; mult v0,v1` on a value loaded one instruction earlier) with no prologue. The ported routine at this VA is PROT 0898's (its tag says so); the 0897 dump here is a fragment."]
"801d9bbc" = ["worklist_interior", "Not an entry in PROT 0897: the field image's own bytes at this VA open mid-body (`bnez v0` on the parent's v0, after `lh v0,0x54(t1)`) with no prologue. The ported routine at this VA is PROT 0898's (its tag says so); the 0897 dump here is a fragment."]
"801daba4" = ["worklist_interior", "Not an entry in PROT 0897: the field image's own bytes at this VA open mid-body (`sw ra,0x4c(sp)` - the middle of a register-save run whose `addiu sp` sits above it) with no prologue. The ported routine at this VA is PROT 0898's (its tag says so); the 0897 dump here is a fragment."]
"801dd0ac" = ["worklist_interior", "Not an entry in PROT 0897: the field image's own bytes at this VA open mid-body (`div v1,a1` on a quotient the preceding `mult`/`mflo` formed) with no prologue. The ported routine at this VA is PROT 0898's (its tag says so); the 0897 dump here is a fragment."]
"801d7964" = ["worklist_interior", "Not an entry in PROT 0897: the field image's bytes here are the middle of an unaligned `lwl`/`lwr` -> `swl`/`swr` word copy. The routine at this VA is fishing's fill-primitive builder (PROT 0972)."]
"801d81e0" = ["subsumed_glue", "List relink, 44 B at 0x801D81E0..0x801D820C: FUN_800204A4(a0, a1) frees the node, then FUN_80020454(a1) pops it straight back (the free stack is LIFO) and appends it to the list head a1 - so the actor moves to the tail of that list. Its two callers are field-VM op 0x23 MOVE_TO's NPC arm (0x801DECD0, head = *(0x8007C348 + 0xC)) and 0x801E1AA4; both are ported, and the port's actor table is a slot array with no linked lists to reorder. The 0897 dump at this VA is a mis-based fragment of other code."]
"801ecd0c" = ["unreferenced", "Map-list warp picker, 1532 B at 0x801ECD0C..0x801ED308 (frame -0x40, six-case switch on actor[+0x54] through 0x801CF4E4): case 0 loads the 16-byte-record list behind 0x801F2BEC, sorts it on its 3-byte key and seeks the row whose name hash (FUN_8003CE9C(rec + 0xC)) matches the live scene word *(0x80084540). Its one reference of any form is slot 1 of the subsystem actor's 52-entry handler table 0x801F33B4 (word at 0x801F33B8), which FUN_801F159C indexes by actor[+0x50] (0x801F1618..0x801F1634); nothing on the disc stores 1 there. The actor (template 0x8007065C, spawned at 0x801D0324 / 0x801D0D20 / 0x801E09A0 with its result discarded) gets +0x50 only from its installer FUN_801F1278 (7 at 0x801F140C, else a byte of 0x801F33A4, whose fourteen rows are -1 or 0x21..0x33) and from its handlers' own exits, every one a constant: 0x02, 0x13, 0x1A, 0x29, 0x2B, 0x2C, 0x30. The image's other `sh rX,0x50(rY)` sites with a computed value write different actors: those spawned from templates 0x801F22AC / 0x801F22C4 / 0x801F26D8 / 0x801F27EC / 0x801F2828 / 0x801F2870 / 0x801F2978, the timer of the tick at 0x801DD4C4 on its own actor, and the move-VM extension FUN_801D362C's executing actor. So the routine is a real entry retail never dispatches - the 801e5338 shape, one table level up."]
"801de648" = ["subsumed_glue", "Sized store, 80 B at 0x801DE648..0x801DE698: value a0 -> *a1 as byte / half / word for a2 = 1 / 2 / 4, any other size a no-op. Its only references disc-wide are sixteen `jal`s from PROT 0900's move-VM extension handlers (FUN_801F7A9C, FUN_801F811C, FUN_801F849C - all ported), where it stores a tween result; the ports write the typed field directly."]

