[cutscene_str]
"801cfc50" = ["unreferenced", "MDEC decode-environment copy (the libpress DecDCTGetEnv shape): copies 16 + 16 + 32 words of quantisation / IDCT tables from 0x801D0D5C / 0x801D0D9C / 0x801D0DE0 into a0 and returns it. No reference of any form in this image (find-address-word-refs.py: no word, jal, j, branch or lui pair)."]
"801d0230" = ["render_pipeline_mdec", "MDEC status read: returns the word at *0x801D0E94 (the MDEC status register pointer). Its two callers (0x801CFE3C / 0x801CFE78) are the in / out idle waits around the ported FUN_801D0100 / FUN_801D0198, whose ports (engine-core mdec_dma_sync) take the status read as a closure; legaia-mdec decodes synchronously."]

