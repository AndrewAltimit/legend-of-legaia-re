# Allowed dependencies among the engine's `World`-free kernel crates.
# Read by scripts/ci/check-crate-layering.py; described in
# docs/subsystems/engine.md ("The layering gate").
#
# Each [crates.<dir>] row is one crate under crates/<dir>:
#
#   deps    - the engine-layer crates it may name in [dependencies]. The row
#             is exact: a declared edge missing here fails, and so does a row
#             entry the Cargo.toml no longer declares.
#   dev     - extra engine-layer crates allowed in [dev-dependencies] only.
#   foreign - when present, the exact set of non-engine workspace crates the
#             crate may name in [dependencies]. Only a crate whose role is
#             "takes nothing but X" carries it.
#
# "Engine-layer" means every crates/engine-*, plus render-kernels, parity,
# asset-viewer, studio, web-minigames, web-play and web-viewer. Format, tool and patcher crates are outside
# the layer: any kernel crate may depend on them, and none of them may depend
# on an engine-layer crate.
#
# An engine-layer crate with no row here (engine-core, the battle HUD reads,
# the cheats, the LGSF saves, the session, the screens, the renderer, the audio stack, the
# hosts) is above the kernels. It
# may depend on anything, and no kernel crate may depend on it.
#
# Rank is derived, not written: a crate's rank is one more than the highest
# rank among its `deps`, so the table has to be acyclic and
# `check-crate-layering.py --ranks` prints the resulting stack.

[crates.engine-system]
role = "pad input, BIOS rand, fades, FMV, sound state, RAM-cell map"
deps = []
foreign = ["cheats", "gamedata"]

[crates.engine-dialog]
role = "dialog pager and text balloon"
deps = []

[crates.engine-dev-menu]
role = "the field overlay's dev-menu bodies: row model, value steps, flag editor, equip applier"
deps = ["engine-system"]

[crates.engine-vm]
role = "window-widget, field, move and effect VMs, the actor tick"
deps = []

[crates.engine-mode]
role = "game-mode seat and the 28-mode driver"
deps = ["engine-system"]

[crates.engine-camera]
role = "the shared GTE camera: build, projection, mover, shake, camera-relative glide, distance preset"
deps = ["engine-system"]

[crates.engine-battle-vm]
role = "battle action SM, formulas, battle camera script, battle-overlay leaves"
deps = ["engine-camera", "engine-system"]

[crates.engine-cast]
role = "slot-B cast / summon module ticks, their camera and countdown, cast-arm kernels"
deps = ["engine-battle-vm", "engine-camera", "engine-system", "render-kernels"]

[crates.engine-motion-vm]
role = "the two per-actor motion VMs"
deps = ["engine-system"]

[crates.engine-battle]
role = "World-free battle kernels"
deps = ["engine-battle-vm", "engine-system", "render-kernels"]

[crates.render-kernels]
role = "GTE math, screen prims, VRAM capture, effect emitters, the battle-intro model; no wgpu"
deps = ["engine-camera", "engine-vm"]

[crates.engine-ui]
role = "renderer-agnostic draw-list builders"
deps = ["engine-battle-vm", "render-kernels"]
dev = ["engine-camera", "engine-field"]

[crates.engine-effects]
role = "World-free effect kernels"
deps = [
    "engine-battle-vm",
    "engine-system",
    "engine-vm",
    "render-kernels",
]

[crates.engine-field]
role = "World-free field kernels"
deps = [
    "engine-camera",
    "engine-dev-menu",
    "engine-dialog",
    "engine-mode",
    "engine-motion-vm",
    "engine-system",
    "engine-vm",
    "render-kernels",
]

[crates.engine-fishing]
role = "fishing rules engine"
deps = ["engine-field", "engine-system", "render-kernels"]

[crates.engine-minigames]
role = "minigame rules engines"
deps = [
    "engine-battle-vm",
    "engine-camera",
    "engine-field",
    "engine-system",
    "engine-vm",
    "render-kernels",
]

[crates.engine-title]
role = "publisher logos, the title state machine and the title overlay tick"
deps = ["engine-system"]

[crates.engine-menus]
role = "menu and memory-card front end"
deps = [
    "engine-battle",
    "engine-battle-vm",
    "engine-camera",
    "engine-dev-menu",
    "engine-dialog",
    "engine-minigames",
    "engine-system",
    "engine-vm",
]

[crates.engine-battle-menus]
role = "battle command flow and input, the open banner, the timed fight, the Muscle Dome match session"
deps = [
    "engine-battle",
    "engine-battle-vm",
    "engine-minigames",
    "engine-system",
]

[crates.engine-scene]
role = "scene resolution and loading, environment draws, virtual filesystem"
deps = [
    "engine-camera",
    "engine-dialog",
    "engine-field",
    "engine-system",
    "engine-vm",
    "render-kernels",
]
dev = ["engine-battle", "engine-menus", "engine-mode"]

[crates.engine-minigame-scenes]
role = "the minigames' 3D scene surfaces, venues and the World's minigame seat"
deps = [
    "engine-battle",
    "engine-battle-menus",
    "engine-battle-vm",
    "engine-camera",
    "engine-effects",
    "engine-field",
    "engine-fishing",
    "engine-minigames",
    "engine-mode",
    "engine-scene",
    "engine-system",
    "engine-vm",
    "render-kernels",
]

# Edges the table allows that the crates' roles alone do not explain: each is
# held by a small set of items in the lower crate, and cutting it means moving
# those items to a home below both ends. `items` is what holds the edge;
# `reason` is why it stands. The gate fails a row whose edge is gone, so a
# coupling that gets cut has to be deleted here in the same change.

[[coupling]]
from = "engine-minigames"
to = "engine-battle-vm"
items = ["panel_backread_loader::backread_texture_variant"]
reason = "the ringside still the contest hub keeps resident is picked by the battle panel back-read loader; battle_formulas is the Muscle Dome's by role"

[[coupling]]
from = "engine-battle"
to = "render-kernels"
items = ["battle_intro_styles::INTRO_DURATION_FRAMES"]
reason = "the encounter session's default transition length is the battle-intro model's, which sits with its draw half"

[[coupling]]
from = "engine-fishing"
to = "engine-field"
items = ["minigame_floor", "field_regions"]
reason = "the fishing venue stands on the shared minigame floor, a field .MAP walk grid with tile triggers read through the field's region queries"

[[coupling]]
from = "engine-minigames"
to = "engine-field"
items = ["dance_marker"]
reason = "the dance floor's step markers are tile actors the shared minigame floor spawns from the field .MAP's tile triggers"

[[coupling]]
from = "engine-ui"
to = "engine-battle-vm"
items = ["battle_party_panel", "battle_commit_log", "panel_backread_loader", "battle_value_readout", "battle_action::FlashQuad"]
reason = "the battle HUD model and the numeral readout the draw-list builders project are defined with the battle kernels that fill them: the action SM's flash ramp stamps the readout's glyph page and the commit log stages off the cursor pose, so the model cannot move below the action SM; the edge points down a rank"
