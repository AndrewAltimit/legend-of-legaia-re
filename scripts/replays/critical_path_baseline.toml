# Critical-path replay baseline.
#
# The highest rung `crates/engine-shell/tests/critical_path_replay.rs` has
# reached driving the chapter-1 spine with the PAD only - no seating, no
# teleports. The test asserts `score >= reached` so the number is a ratchet:
# it may go up in a reviewed edit, and a drop fails the run.
#
# Rungs (see the test's module docs for the full table):
#   1  town01 free-roam, input released
#   2  pad-walk town01 south gate -> map01
#   3  pad-walk map01 across the continent (>= 24 tiles, >= 1 encounter fought)
#   4  pad-walk map01 -> suimon -> map01 -> keikoku (Ravine)
#   5  pad-walk the Ravine interior out of a *different* door (>= 12 tiles)
#
# Unlike the other progression oracles, this number is denominated in what a
# player can do, not in what the disc decodes. Raise it only when the run
# actually clears the rung - never to make a red test green.
#
# The baseline is measured with a LIVING party. The run seeds the retail New
# Game roster (Vahn, the SCUS `0x80078C4C` template - `open_host`), fights its
# random encounters through the auto-resolve loop, and scores a party wipe AS
# a wipe: `drain_battle` reads the game-over hold (`World::game_over_hold`,
# the wipe arm that freezes the scene in Battle mode) and the leg reports
# `PARTY WIPED`. An earlier baseline of 5 predates both halves: the host
# seeded no roster, every party slot was a hollow actor the first hit "killed",
# and the pre-hold engine returned the wiped party to the field - which
# `drain_battle` scored as `Fight::Survived`, so rungs 3-5 were walked with a
# dead party. That 5 was an instrument artifact, not a pad-walk score.
#
# Rungs 1-3 clear. Rung 3's encounters are real fights now: the leg fights
# and survives three map01 encounters on the 36-tile crossing.
#
# Rung 4 currently ends in an honest party wipe on the map01 -> suimon leg:
# a solo L1 Vahn under neutral-pad auto-battles has no recovery between
# fights, and the leg's encounter attrition kills him before the crossing.
# That is a finding about the ladder's fighting model (no commands, no items,
# no rest), not about the route - the route knowledge below still stands.
#
# Route notes for rungs 4-5 (verified when the legs were first walked, and
# still the map's shape):
#
# - map01's wall bits split the kingdom into two walk components (the arrival
#   `(96, 25)` north, all six `keikoku` mouths south); the crossing is the
#   `suimon` scene, not a pass; which of suimon's two chambers the crossing
#   lands in is selected by story flag `0x27B`. See
#   `docs/subsystems/world-map.md`.
# - keikoku's interior: from every one of the four mouths the unhazarded
#   flood covers the whole canyon and reaches 93 of the scene's 100 gate-1
#   trigger tiles. Its 100 gate-1 tiles are three populations: four
#   scene-change records (0..3, returning to map01 (52,94) / (64,67) /
#   (77,68) / (82,83)), four single-tile arrival beats, and one 27-tile
#   shared beat record across the chambers' inner doorways - so the goal
#   picker keys by RECORD, never by radius, and `plan_path`'s hazard test
#   compares source and destination tiles (retail's dispatcher fires on a
#   tile *change*, so occupying a hazard tile is safe, entering one is not).
#   keikoku record 7 is a story cutscene with narration pages, so
#   `drain_scripted` pulses Cross rather than holding neutral.
#   `cargo run -p legaia-engine-shell --example keikoku_reach_probe`
#   re-measures the four floods per mouth.
#
# Non-vacuity of the rung-5 door clause: `LEGAIA_CPR_RUNG5_BACKOUT=1` re-aims
# the leg at the arrival record's own band and hazards nothing; under that
# flag the rung must read `[--]`. The door clause is exercised on its own by
# the disc-free `a_door_is_only_different_when_both_ends_are_known`.

reached = 3
