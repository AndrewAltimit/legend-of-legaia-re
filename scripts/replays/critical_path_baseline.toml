# Critical-path replay baseline.
#
# The highest rung `crates/engine-shell/tests/critical_path_replay.rs` has
# reached driving the chapter-1 spine with the PAD only - no seating, no
# teleports. The test asserts `score >= reached` so the number is a ratchet:
# it may go up in a reviewed edit, and a drop fails the run.
#
# Rungs (see the test's module docs for the full table):
#   1  town01 loads into free-roam Field, entry script running
#   2  pad-walk town01 south gate -> map01
#   3  pad-walk map01 across the continent (>= 24 tiles, >= 1 encounter fought)
#   4  pad-walk map01 -> suimon -> map01 -> keikoku (Ravine)
#   5  pad-walk the Ravine interior out of a *different* door (>= 12 tiles)
#
# Unlike the other progression oracles, this number is denominated in what a
# player can do, not in what the disc decodes. Raise it only when the run
# actually clears the rung - never to make a red test green.
#
# The baseline is measured with a LIVING party. The run seeds the retail New
# Game roster (Vahn, the SCUS `0x80078C4C` template - `open_host`), fights its
# random encounters, and scores a party wipe AS a wipe: `drain_battle` reads
# the game-over hold (`World::game_over_hold`, the wipe arm that freezes the
# scene in Battle mode) and the leg reports `PARTY WIPED`. An earlier baseline
# of 5 predates both halves: the host seeded no roster, every party slot was a
# hollow actor the first hit "killed", and the pre-hold engine returned the
# wiped party to the field - which `drain_battle` scored as `Fight::Survived`,
# so rungs 3-5 were walked with a dead party. That 5 was an instrument
# artifact, not a pad-walk score. This one is not the same number twice.
#
# ---------------------------------------------------------------------------
# What was behind the wipe
# ---------------------------------------------------------------------------
#
# A previous baseline of 3 ended in an honest party wipe on the
# `map01 -> suimon` leg and read that as "a finding about the ladder's fighting
# model (no commands, no items, no rest)". Two thirds of that diagnosis were
# wrong, and the run says which third was not.
#
# The fighter now drives `World::battle_command` - the same command session the
# windowed host binds its keyboard to - with pad presses only: Left on the
# round prompt (`Begin`), Left / Up on the command ring (`Attack` / `Item`),
# Left on the attack-mode prompt (`Auto`), Cross on the target cursor, and
# Cross / Down through the bag's item and target rows. Two contrast controls
# separate what that bought:
#
#   LEGAIA_CPR_NEUTRAL_FIGHT=1   neutral pad, engine auto-resolve   -> score 3
#   LEGAIA_CPR_NO_BAG=1          full command ring, empty bag       -> score 3
#   (default)                    command ring + 5 Healing Leaves    -> score 5
#
# The first two die in the *same fight* with the *same* HP trajectory
# (180 -> 108 -> 27 -> 0 across three map01 encounters). Command selection
# changes nothing, because `Attack -> Auto` seeds the same two-swing queue
# `arm_party_physical` does (`seed_basic_attack_queue`, retail
# `FUN_801EED1C`'s no-input arm). What was behind the wipe was **no recovery**,
# full stop - a solo level-1 Vahn has 180 HP and a map01 encounter costs him
# 70-80 of it.
#
# So the bag is the model's one non-pad input, and it is grounded rather than
# picked: a New Game grants 500 gold (`NEW_GAME_STARTING_GOLD`, the literal in
# retail's data-init `FUN_80034A6C`) and Rim Elm's Variety Shop sells the
# Healing Leaf at 100, so five leaves is the entire starting purse spent on
# healing before stepping out of the gate - the most a player could carry out
# of Rim Elm. The gold is deducted. Buying them by pad would mean adding an
# interact-and-shop-menu leg to a ladder that scores locomotion; the seed
# stands in for the town's beats exactly as `GATE_OPEN_FLAGS` stands in for its
# story flags. Everything else in a battle is a `set_pad` call.
#
# The margin is thin and that is the point: the crossing ends at 14/190 HP
# with an empty bag, having fought six encounters and levelled once.
#
# ---------------------------------------------------------------------------
# What the run stopped leaning on
# ---------------------------------------------------------------------------
#
# The first pad-driven run cleared all five rungs at 76/190 HP, and part of
# that margin was not the player's: every level-up restored current HP and MP
# to the new maximum. Retail's applier `FUN_801E9504` stores to eleven
# addresses and not one of them is a current-pool cell, and the single-level
# `noa_levelup_*` capture triplet agrees - Noa settles at 164/221 HP after an
# L2 -> L3 level-up, exactly where the fight left her. Removing the free heal
# cost this run 62 HP and changed no rung.
#
# ---------------------------------------------------------------------------
# Route notes for rungs 4-5
# ---------------------------------------------------------------------------
#
# Verified when the legs were first walked, and re-confirmed by the run that
# now completes them:
#
# - map01's wall bits split the kingdom into two walk components (the arrival
#   `(96, 25)` north, all six `keikoku` mouths south); the crossing is the
#   `suimon` scene, not a pass; which of suimon's two chambers the crossing
#   lands in is selected by story flag `0x27B`. See
#   `docs/subsystems/world-map.md`.
# - keikoku's interior: from every one of the four mouths the unhazarded
#   flood covers the whole canyon and reaches 93 of the scene's 100 gate-1
#   trigger tiles. Its 100 gate-1 tiles are three populations: four
#   scene-change records (0..3, returning to map01 (52,94) / (64,67) /
#   (77,68) / (82,83)), four single-tile arrival beats, and one 27-tile
#   shared beat record across the chambers' inner doorways - so the goal
#   picker keys by RECORD, never by radius, and `plan_path`'s hazard test
#   compares source and destination tiles (retail's dispatcher fires on a
#   tile *change*, so occupying a hazard tile is safe, entering one is not).
#   keikoku record 7 is a story cutscene with narration pages, so
#   `drain_scripted` pulses Cross rather than holding neutral.
#   `cargo run -p legaia-engine-shell --example keikoku_reach_probe`
#   re-measures the four floods per mouth.
#   The completing run enters at tile `(58, 24)` through record 1 and leaves
#   65 tiles later through record 0's band, landing on map01 `(52, 94)`.
#
# What rung 5 does NOT cover is the dungeon's own encounter table, and that is
# a defect rather than a gap in the rung: `keikoku`'s MAN encounter section
# decodes to exactly ONE region - the whole map, `rate 0`, a one-row formation
# range - so `any_rollable` answers false and no step ever rolls, while the
# same MAN registers 37 formation rows nothing can reach. The field side of
# the live loop is armed anyway, so the day that decode is fixed the rung
# starts fighting in the Ravine on its own. `LEGAIA_CPR_FIGHT=1` prints the
# region set at the rung's start.
#
# It is not one scene. Decoding every scene's region table over the corpus
# (`region_encounter_table_from_man` across the 99 CDNAME scenes that carry a
# MAN) gives 26 rollable and 73 not, and 67 of the 99 lead with that same
# whole-map rate-0 row. Because region lookup stops at the first *containing*
# region, that row silences everything behind it - and behind it, in 30 of
# those scenes, sits at least one region with a real rate and a real formation
# range (`deroa` has 17 regions, `chitei2` 19, `conc2` / `conc3` 10 each). The
# other 34 decode to that row and nothing else, `keikoku` among them. Three
# readings fit: the parser emits a spurious leading record, retail's walk does
# not shadow the way the port models it, or the AABB decode is wrong. All
# three are `legaia_asset::man_section::region_records`, not this ladder.
#
# ---------------------------------------------------------------------------
# What rung 1 does and does not say
# ---------------------------------------------------------------------------
#
# It used to read "town01 free-roam, input released", which sounds like the
# cold boot's opening choreography running and handing control over. It is not
# that. Under `SceneHost::enter_field_scene("town01", 0)` the opening holds
# input for **zero** frames: no cutscene-timeline frame, no `current_dialog`
# frame, no `inline_dialogue` frame, neither during the wait nor across a
# further 1200 idle ticks. Nothing runs, so "control was released" is
# trivially true - and a rung that only asks whether input is free now cannot
# tell that apart from an opening that played and finished.
#
# Zero is the RIGHT number for this door, and that is now settled rather than
# suspected. Rim Elm's opening is not a property of loading `town01`: it is the
# scene's partition-2 record 3, whose header gate is "system flag 0x225 is
# clear", and the engine installs it only on the New Game hand-off
# (`World::entering_town01_opening` / `opening_chain_active`). Retail's own
# `town01` P1[0] reads the same 0x225 and skips its first-visit arms once it is
# set. This ladder walks a route, so it enters Rim Elm the way a returning
# player does, and a returning player gets no opening. The opening's own ladder
# is the browser `play_compose` rung 2, which enters through the hand-off and
# asserts the timeline played for a positive number of frames.
#
# What the rung asserts is therefore two facts, not one: the scene loads into
# Field with a controllable player, AND its scene-entry system script (`P1[0]`,
# retail ctx 0xFB) is resident and executing. The second was added because
# "input is free" is a statement about what is NOT happening - a scene that
# loaded nothing at all satisfies it perfectly, which is how this rung came to
# be read as evidence the opening played. The system script is what raises the
# scene's story flags, cues its BGM, arms the arrival fade and drives the
# per-frame camera-zone tests; if it stopped running, every one of those would
# go with it while every rung below still passed. The held-frame count and the
# script's PC are both printed on the row.
#
# ---------------------------------------------------------------------------
# Controls
# ---------------------------------------------------------------------------
#
# Non-vacuity of the rung-5 door clause: `LEGAIA_CPR_RUNG5_BACKOUT=1` re-aims
# the leg at the arrival record's own band and hazards nothing; under that
# flag the rung must read `[--]` (it does - score 4). The door clause is
# exercised on its own by the disc-free
# `a_door_is_only_different_when_both_ends_are_known`.
#
# Non-vacuity of the fighting model: the two flags in the table above must
# still score 3. If either ever clears rung 4, the route got easier and the
# wipe diagnosis above needs re-taking.
#
# All three control flags therefore make the test FAIL its own ratchet, which
# is what a control is for - they are run by hand to read the score they
# print, never as a CI configuration.
#
# The run is deterministic: two consecutive default runs produce byte-identical
# per-encounter HP trajectories and the same rung details.

reached = 5
