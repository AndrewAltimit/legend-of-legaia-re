# Vidna (0x1CB, balden P2[9]) his Yes spawns P2[16], which raises 0x1C1
# (the Star Pearl); throwing it into the Stone Flower (stone P1[4]) raises
# 0x1E9, the gate of stone P2[4], the door to tunnela. The cheapest route
# rides ropeway2's elevator P2[21] instead, whose door P0[16] opens only
# on 0x1D5 (Xain's defeat, later).
