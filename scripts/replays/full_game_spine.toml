# Full-game story spine (schema full-game-spine-v1).
#
# The ordered main-story milestones from a cold New Game to the ending
# credits, consumed by crates/engine-shell/tests/full_game_ladder.rs. See
# docs/tooling/full-game-ladder.md for what the ladder does with it.
#
# Where the order comes from. Each milestone names a RETAIL ANCHOR - a save on
# one of the library's memory cards (by card file + save name, never by block
# number) or a catalogued save state (by scenarios.toml label + backup
# fingerprint). The anchor is read, never committed: the ladder lifts its SC
# save window (RAM 0x80084140..0x80086140, the block a memory card stores) and
# checks the anchor's own scene label against `scene` below. The sequence is
# the one the anchors themselves put in order:
#
#   - the two playthrough cards (`playthrough-ladder-pro00-14.mcr`,
#     `playthrough-endgame-7saves.mcr`) are one run: their play-time counters
#     (SC +0x430) and system-flag populations rise together across all 22
#     saves, so they order themselves;
#   - chapter 1 before Mt. Rikuroa has no card save, so its milestones are
#     save states from several sessions, ordered by system-flag inclusion
#     (a state whose set flags are, save a handful, a subset of another's
#     precedes it) - the same test the ladder's Part A re-runs;
#   - the ending is the `ed*` scene band the final record hands off to.
#
# `reach` is what arriving means:
#   "scene"    the engine is in `scene` (Field or WorldMap);
#   "control"  ... and the scene has handed the pad back;
#   "flags"    ... and every flag in `reach_flags` is set - used where two
#              consecutive milestones share a scene and only a story beat
#              separates them. Each reach flag is one the anchor gained over
#              its predecessor AND that a clean partition-2 (story record)
#              SET site in that scene writes - the ladder's Part A prints
#              the candidates, and asserts each chosen flag is set in its own
#              anchor. Entry-script (P1[0]) writes are left out: they fire on
#              every visit and prove no beat.
#
# No game text, no bytes: scene labels, flag indices, hashes and names only.

[meta]
schema = "full-game-spine-v1"

