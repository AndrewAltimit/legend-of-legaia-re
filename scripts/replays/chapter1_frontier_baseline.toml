# Chapter-1 scene-frontier baseline.
#
# What `crates/engine-core/tests/chapter1_frontier_ladder.rs` reached over
# the whole chapter-1 reachable scene set, rather than along one route. The
# test asserts `>=` on every number below, so each is a ratchet: it may go up
# in a reviewed edit, and a drop fails the run.
#
# The scene set is not a list. It is the BFS closure of `town01` over each
# scene's own decoded `0x3F` named-scene-change destinations, stopped at the
# kingdom boundary - a destination that is another kingdom's overworld
# (`mapNN` other than `map01`) is recorded and not expanded, because `map02`
# and `map03` are the chapter-2 / chapter-3 arcs.
#
# Rungs, per scene, ordered and cumulative (the score is the count cleared
# before the first one that was not):
#   1 assets  Scene::load resolves and a MAN payload comes back
#   2 man     the MAN parses: partition table + 0x3F destination table
#   3 enter   SceneHost enters it in Field / WorldMap
#   4 script  its entry script settles and hands control back
#   5 walk    pad-only input displaces the player at least one tile
#   6 exit    an exit record fires and lands in the scene it names
#
# Rung 5 is pad-only - nothing is seated. Rung 6 is NOT pad-only and does not
# claim to be: the player is seated onto the exit's own trigger tile, so the
# rung scores the transition and its landing, not the locomotion to the door.
# Walking to a door under pad is `critical_path_baseline.toml`'s number, and
# it is a different and harder claim.
#
# A scene whose entry script leaves on its own (a scripted `0x3F` with no
# player input) is marked `~` on rungs 5 and 6 and scores 4. That is not an
# engine failure and the test reports those scenes separately - but the score
# still does not credit them, because a rung that never ran was never
# demonstrated.
#
# `scenes` is the closure size. It is a ratchet in its own right: a
# destination-decode regression that drops a scene off the graph would
# otherwise *raise* the average and read as progress.
#
# `full_ladder` counts scenes that cleared all six rungs.
#
# WHY THESE NUMBERS MOVED, AND BY HOW MUCH
#
# The closure roughly doubled and every rung number rose with it, because a
# `0x3F` operand's case is invisible to retail and the port's clean-label gate
# was lower-case-only. Retail never compares the operand against a name table:
# it copies the name into the next-scene global and the field asset loader
# concatenates it into the ISO path `DATA\FIELD\<name>.MAP`, and ISO 9660
# identifiers are upper case. Roughly half the disc's destinations are written
# `MAP03` / `KOR3` / `RETOCKIN`, and the port silently dropped every one -
# `uru`'s own exit among them. With the gate folding case, the closure grows
# from the Drake kingdom to most of the `0x3F` graph reachable from `town01`.
#
# Four later corrections raised the rung numbers again, each a port defect
# rather than a cap:
#
# - The field VM read op `0x45` sub-`0xC0` (CAMERA APPLY) as an absolute jump
#   to its `s16` operand. Retail's arm is a four-byte fall-through and the
#   `s16` is the apply trigger it hands to the camera composer, so a trigger of
#   zero sent the PC back to byte 0 and the record replayed forever.
#   `urudre2`'s only door record is one of those, which is why that room read
#   as one-way.
#
# - The same VM read op `0x43` sub-0/1/A/B (the halt-acquire) as yielding to an
#   absolute PC taken from an operand `s16`. That `s16` is a coordinate: the
#   sub-A/B one is negated into the target's Y. Retail falls through past the
#   op and stops the context on the halt bit instead.
#
# - The static partition-2 scene-change join abandoned a record at its first
#   undecodable byte while the executing walker resyncs past it. Message text
#   is full of such bytes, so every destination behind the first one was lost -
#   67 partition-2 records disc-wide gained a destination when the join started
#   sharing the walker's advance rule.
#
# - The cold-entry seat resolver gated "is this tile floor" on the object-grid
#   bit `0x1000`. Eighteen field scenes author `0x2000` and never `0x1000`, so
#   the resolver was inert in all of them and `kor5` seated the player inside a
#   wall. The gate now uses whichever bit the scene authored, and a candidate
#   seat the player cannot walk off is rejected.
#
# Where the frontier stops, and why (each of these is a finding the run
# prints in full; they are recorded here so the shortfall between
# `rung_total` and `scenes * 6` is not mistaken for noise):
#
# - The rung-5 shortfall is two scenes. `izumi`'s C1-gated first-visit record
#   relocates the player about thirty tiles with the pad released, so the
#   driven run cannot beat its own control (the revisit probe walks four tiles
#   normally). `korb3` is the one scene the seat fix costs: its object grid has
#   no `0x1000` cell, so it used to keep the unresolved retail seat and walk
#   from it, and it now resolves to its main region's centroid, where pad
#   locomotion does not move. That is a seat-pick question, not a walk one -
#   the same fix is what makes `kor5` walk and leave.
#
# - All five of the late Uru Mais / Drake scenes now leave, and Parts D/E/E2
#   say exactly how: `uru` -> `map03`, `urudre1` / `urudre3` -> `uru`,
#   `urudre2` -> `map01` through `.PCH`-carried gate-1 bands, and `jouine` ->
#   `town0e` through FMV 8 and `cutscene::fmv_post_play_handoff` (its record
#   carries no `0x3F` at all, so the static exit-site join cannot see it and
#   the scene still stops at rung 6 in the table while Part E drives it out).

scenes = 74
rung_total = 432
full_ladder = 64
