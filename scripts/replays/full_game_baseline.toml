# (default, or seed_<n> under LEGAIA_FGL_RNG_SEED=<n>), one key per category.
# Asserted <= in the measured configuration: a category that rises fails the
# run, a category the row leaves out stands at 0. Lower a number in a
# reviewed edit when a run fires fewer; never raise one to pass a run. A
