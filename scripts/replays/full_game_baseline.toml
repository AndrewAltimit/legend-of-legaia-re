# Full-game ladder baseline.
#
# The scores `crates/engine-shell/tests/full_game_ladder.rs` part B last
# cleared over the story spine in `scripts/replays/full_game_spine.toml`.
# Each number is asserted `>=`, so a drop fails the run and a rise is a
# reviewed edit (the test prints the block to paste). Never raise a number
# the run did not clear, and never lower one to make a red run green -
# a drop is a finding.
#
# Segment keys name the milestone the segment ENDS at. Tiers:
#   0 none        seeding failed or panicked
#   1 loads       the seeded save lands in its scene
#   2 enters      the entry script settles (control back, or the script left)
#   3 progresses  the next milestone is reached by seated traversal + beats
#   4 pad         the next milestone is reached with pad input only
#
# The headline counts are how many segments, taken in spine order, reach
# their next milestone at each tier; tier_sum is the sum over all segments.
# Every segment is seeded from the retail save at its milestone, so these
# are not what one New Game reaches - that is `[continuous]` below.
# See docs/tooling/full-game-ladder.md.

[headline]
contiguous_progresses = 35
contiguous_pad = 35
tier_sum = 140

# Part C, the continuous run: milestones one New Game reaches in order on
# pad input when it is never re-seeded from a retail save and reloads only
# the engine's own saves. Asserted `>=` like the rest.
[continuous]
reached = 35

# Part C on other hands of the rand stream: a run under
# LEGAIA_FGL_RNG_SEED=<n> is asserted against its own seed_<n> row. One
# stream's score can rest on a boss the hand only won by the deal; the set
# says the route holds across deals. Asserted `>=` like the rest.
[continuous_seeds]
seed_3 = 35
seed_4 = 35
seed_5 = 35
seed_6 = 35
seed_7 = 35
seed_8 = 35
seed_9 = 35
# --- lane C ---
seed_10 = 35
seed_11 = 35
seed_12 = 35
seed_13 = 35
seed_14 = 35
seed_15 = 35
seed_16 = 35

