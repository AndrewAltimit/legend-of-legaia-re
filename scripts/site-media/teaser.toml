[[shot]]
name = "w_play"
page = "play.html"
disc = true
viewport = [1600, 900]
prep = [{ waitFor = "!!window.__playRuntime" }, { eval = "document.querySelector('[data-scene=\"map01\"]').click()" },
        { waitFor = "window.__playView && window.__playView.scene" }, { wait = 3000 }, { scrollTo = "#play-canvas" }, { eval = "document.querySelector('#play-canvas').focus()" }]
