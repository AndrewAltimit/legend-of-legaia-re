# The project teaser: scenes of clip grids, read by `teaser.py` beside this file.
#
# [[shot]] rows are the sources; [[scene]] rows lay them out. A shot is one of:
#   engine  `scene` / `args` / `pad` / `keys` / `from` / `to` / `every`, as in
#           media.toml (a `legaia-engine play-window` run; `every` world ticks
#           per frame, 60 ticks a second, so 2 = the teaser's 30 fps in real
#           time). The run also records its mix (LEGAIA_CAPTURE_AUDIO_WAV)
#   str     a movie segment, as in media.toml
#   page    a site page: `page`, `disc` (read the disc first), `prep` and
#           `steps` (teaser-browser.mjs's step list), `seconds`, `viewport`
#   app     a desktop app on the private display: `app` (argv; {explorer},
#           {engine}, {asset_viewer}, {disc}, {extracted}, {work} expand),
#           `env`, `files` (written under the run's own home first), `size`
#           [w, h] for the window, `ready` (seconds before recording),
#           `seconds`, `pointer`, `actions` (each at `at` seconds: click,
#           move, drag, scroll, key, type; coordinates inside the window)
# Any shot may carry `crop` [x, y, w, h] in its frame's pixels. A page shot
# with `deflicker = true` holds the previous frame wherever the cropped
# region comes back blank: Chromium's screencast now and then grabs a WebGL
# canvas between its clear and its draw. A number holds longer blank runs
# (the asset viewer's canvas stays empty while the next model loads).
#
# A scene is `kind = "grid"` (a title, a subtitle and tiles laid out by
# `layout` = "grid" with `cols`, or "feature" = one large tile and the rest
# stacked beside it, at `aspect`) or `kind = "card"` (a blurred mosaic of
# its tiles under centred `lines`). A tile names its `shot`, a `label`, and
# optionally `skip` (seconds into the shot), `speed` and `gain`.
#
# Sound: a grid scene's engine tiles take turns being heard (in tile order, or
# the scene's `audio` list of tile indexes); the heard tile wears a gold ring
# and a speaker badge, and the soundtrack plays its own mix at that instant.
# A scene with no engine tile plays its `bed` instead: `{ shot, skip, gain }`,
# that shot's mix from `skip` seconds into it.

[defaults]
fps = 30
every = 2

[style]
bg_top = "#0a0e16"
bg_bottom = "#111a28"
accent = "#2a5bd7"
gold = "#e3b54a"
muted = "#9fb0c8"
border = "#2c3a50"
title_size = 64
subtitle_size = 32
label_size = 26
header_height = 188
crossfade_frames = 10

audio_rms = 0.12

[video]
crf = 17

# The committed copy the site's home page plays and the README links to
# (`teaser.py --web`): 720p at a size git can carry, and a poster frame.
[web]
video = "site/assets/teaser.mp4"
poster = "site/img/teaser-poster.jpg"
poster_play = "site/img/teaser-poster-play.jpg"
width = 1280
crf = 27
audio_bitrate = "112k"
poster_frame = 380

