# Site media manifest: the hero montage clips and the game-screenshot tiles.
#
# Read by `site-media.py` beside this file. Every clip is a `legaia-engine
# play-window` run in the default (enhanced) mode, its frames taken every
# `every` world ticks (60 ticks a second, so 5 ticks at the montage's 20 fps
# plays the game at 5/3 speed; 3 would be real time), or a movie segment
# through `mdec decode-str` (`str = "MOV/..."`, whose window `site-media.py`
# reads as 100 ticks a second, so the movie plays at its own speed).
#
# Clip fields:
#   name      cache directory and `--only` handle
#   caption   what the clip shows (the README / home page alt text lists these)
#   scene     `--scene` (the scene picker's entry: full party, story flags staged)
#   args      further play-window flags (`--battle`, `--party`, cheats, ...)
#   pad       `--pad-script` (TICK:BUTTON, FIRST-LAST:BUTTON holds)
#   keys      `--key-script` (minigame hotkeys: K dance, O slots, L fishing, B Baka Fighter)
#   from, to  the tick window kept for the montage (the run stops at `to`)
#   cut       true = hard cut into this clip instead of the cross-fade
#   str, start_frame, end_frame, fps   a movie clip (the window is in montage ticks)
#
# Tile fields: `file` under site/img/tiles/, `size` [w, h] (kept as the file's
# own), `clip` + `tick` to take a montage clip's frame, or a run of its own
# with the clip fields above and `tick` naming its frame.

[defaults]
fps = 20
every = 5
crossfade_frames = 5
poster_frame = 24

[defaults.video]
webm_bitrate = "760k"
mp4_bitrate = "800k"

[defaults.webp]
# The README embeds the animated webp; at the videos' size it runs to tens
# of MB, so it is a smaller, slower cut of the same frames.
width = 560
height = 420
fps = 12
max_bytes = 4800000
quality = [75, 68, 60, 52, 45, 38]

